Quando se reúnem de novo, Derick fica pálido. "A Aline."`,
`The second Roger Jr finishes his sentence, the lights turn red and the Base siren goes off. Everyone runs in a different direction.

Ten minutes of searching. Nothing. No forced doors, no camera footage.

When you regroup, Derick goes pale. "Aline."`,
`En el segundo en que Roger Jr termina la frase, las luces se ponen rojas y suena la sirena de la Base. Todos corren hacia un lado.

Diez minutos de búsqueda. Nada. Ninguna puerta forzada, ninguna cámara con imagen.

Cuando se reúnen de nuevo, Derick se pone pálido. "Aline."`)),
  choices:()=>[{label:L('Correr até a cela','Run to the cell','Correr a la celda'),main:true,run:()=>({go:'b6_cela'})}]},

b6_cela:{act:CH3,title:L('Cela vazia','Empty cell','Celda vacía'),
  text:()=>P(L(`A cela está vazia. As algemas estão abertas, não quebradas. Alguém tinha a chave.

Roger Jr sobe correndo até o bar, sozinho. Volta branco. "A Judite."

Ela está atrás do balcão, sentada, as mãos no colo. A pele toda cinza, como cimento. Os olhos abertos. Só ela abria a passagem por cima.`,
`The cell is empty. The cuffs are open, not broken. Someone had the key.

Roger Jr runs up to the bar, alone. He comes back white. "Judite."

She's behind the counter, seated, hands in her lap. Her skin is completely grey, like cement. Eyes open. She was the only one who could open the passage from above.`,
`La celda está vacía. Las esposas están abiertas, no rotas. Alguien tenía la llave.

Roger Jr sube corriendo al bar, solo. Vuelve pálido. "Judite."

Está detrás del mostrador, sentada, con las manos en el regazo. La piel toda gris, como cemento. Los ojos abiertos. Solo ella abría el pasaje desde arriba.`)),
  choices:()=>[
    {label:L('Olhar para o corpo','Look at the body','Mirar el cuerpo'),test:{sk:'Vontade',dt:14},
      ok:()=>({text:P(L(`Você se obriga a olhar. Nenhum ferimento. Só símbolos pequenos, desenhados a unha na palma das mãos. Ritual.`,`You force yourself to look. No wounds. Just small symbols scratched into her palms. A ritual.`,`Te obligas a mirar. Ninguna herida. Solo símbolos pequeños, rasguñados en las palmas. Un ritual.`))+(S.susp.rjr?P(L(`E Roger Jr foi o único que subiu. Sozinho.`,`And Roger Jr was the only one who went up. Alone.`,`Y Roger Jr fue el único que subió. Solo.`)):''),go:'b7_divisao'}),
      fail:()=>({text:P(L(`Você vira o rosto e vomita no chão do bar.`,`You turn away and throw up on the bar floor.`,`Apartas la cara y vomitas en el piso del bar.`))+loseSan('1d4','Judite'),go:'b7_divisao'})}
  ]},

b7_divisao:{act:CH3,title:L('Três caminhos','Three paths','Tres caminos'),
  text:()=>P(L(`Roger decide em trinta segundos. Equipe Thomas protege a Base. Equipe Bob volta ao hospital para investigar a outra saída do subsolo. E a Equipe Mada, com você, segue o rastreador que Derick escondeu na roupa de Aline durante o interrogatório.

O ponto no mapa para de se mexer. Derick amplia. Você reconhece a rua antes dele.

"Isso é..." "A minha casa", você diz. "A Mansão Wezen."`,
`Roger decides in thirty seconds. Team Thomas guards the Base. Team Bob goes back to the hospital to investigate the basement's other exit. And Team Mada, with you, follows the tracker Derick hid in Aline's clothes during the interrogation.

The dot on the map stops moving. Derick zooms in. You recognize the street before he does.

"That's..." "My house," you say. "The Wezen Mansion."`,
`Roger decide en treinta segundos. El Equipo Thomas protege la Base. El Equipo Bob vuelve al hospital a investigar la otra salida del subsuelo. Y el Equipo Mada, contigo, sigue el rastreador que Derick escondió en la ropa de Aline durante el interrogatorio.

El punto en el mapa deja de moverse. Derick amplía. Reconoces la calle antes que él.

"Eso es..." "Mi casa", dices. "La Mansión Wezen."`)),
  choices:()=>[{label:L('Partir com Mada, Derick, Leon e Jon','Leave with Mada, Derick, Leon and Jon','Partir con Mada, Derick, Leon y Jon'),main:true,run:()=>({go:'m1_vigia'})}]}
};
buildScenes2({A1,A2,CH4,CH5,CH6,CH7,EPI});
}

function buildScenes2({A1,A2,CH4,CH5,CH6,CH7,EPI}){
Object.assign(SCENES,{
m1_vigia:{act:CH4,title:L('A casa','The house','La casa'),checkpoint:true,
  text:()=>P(L(`Seis anos. O portão ainda tem a fita amarela da polícia, desbotada até ficar branca. A cozinha, onde a sua mãe fazia o macarrão de domingo, está às escuras. Você conhece cada janela. Cada rangido.

Vocês vigiam por uma hora. Leon e Jon, os dois ex-militares de Roger, cobrem os flancos sem que ninguém peça.`,
`Six years. The gate still has the yellow police tape, faded almost white. The kitchen, where your mother made Sunday pasta, is dark. You know every window. Every creak.

You watch for an hour. Leon and Jon, Roger's two ex-soldiers, cover the flanks without anyone asking.`,
`Seis años. El portón todavía tiene la cinta amarilla de la policía, desteñida hasta quedar blanca. La cocina, donde tu madre hacía la pasta del domingo, está a oscuras. Conoces cada ventana. Cada crujido.

Vigilan durante una hora. Leon y Jon, los dos exmilitares de Roger, cubren los flancos sin que nadie se lo pida.`)),
  choices:()=>[
    {once:'vigiar',label:L('Vigiar as janelas com atenção','Watch the windows closely','Vigilar las ventanas con atención'),test:{sk:'Percepção',dt:14,ctx:['distante']},
      ok:()=>({text:P(L(`No segundo andar, no escritório do seu pai, uma luz se acende e se apaga. E você jura ter visto algo passar na frente dela. Algo grande, andando de quatro.`,`On the second floor, in your father's study, a light flicks on and off. And you swear you saw something pass in front of it. Something big, walking on all fours.`,`En el segundo piso, en el despacho de tu padre, una luz se enciende y se apaga. Y juras haber visto algo pasar frente a ella. Algo grande, andando en cuatro patas.`))}),
      fail:()=>({text:P(L(`Uma hora de janelas escuras. Nada se mexe. Isso é o que mais te assusta.`,`An hour of dark windows. Nothing moves. That's what scares you most.`,`Una hora de ventanas oscuras. Nada se mueve. Eso es lo que más te asusta.`))})},
    {once:'obs_m',label:L('Observar Leon e Jon','Watch Leon and Jon','Observar a Leon y Jon'),test:{sk:'Intuição',dt:15},
      ok:()=>({text:P(L(`Leon olha mais para Mada do que para a casa. Jon ajusta a mira do fuzil, e a mira passa pelas costas de Mada antes de voltar para a janela.`,`Leon watches Mada more than the house. Jon adjusts his rifle scope, and the crosshairs pass over Mada's back before returning to the window.`,`Leon mira más a Mada que a la casa. Jon ajusta la mira del fusil, y la mira pasa por la espalda de Mada antes de volver a la ventana.`))+susp('leon',L('a vigia','the stakeout','la vigilancia'))+susp('jon',L('a vigia','the stakeout','la vigilancia'))}),
      fail:()=>({text:P(L(`Dois profissionais fazendo o trabalho. Nada mais.`,`Two professionals doing their job. Nothing more.`,`Dos profesionales haciendo su trabajo. Nada más.`))})},
    {label:L('Entrar pela porta da frente','Go in through the front door','Entrar por la puerta principal'),main:true,run:()=>({text:P(L(`A porta está destrancada. Leon entra primeiro, como sempre. Do teto do hall, algo despenca em cima dele.`,`The door is unlocked. Leon goes in first, as always. From the hall ceiling, something drops on top of him.`,`La puerta no tiene llave. Leon entra primero, como siempre. Del techo del vestíbulo, algo se le cae encima.`)),combat:{id:'besta_sangue',after:'m2_revelacao',allies:['mada','derick','leon','jon'],winText:L('A Besta tomba no meio do hall, sobre o tapete da sua mãe.','The Beast collapses in the middle of the hall, on your mother\'s rug.','La Bestia cae en medio del vestíbulo, sobre la alfombra de tu madre.')}})}
  ]},

m2_revelacao:{act:CH4,title:L('O que caiu do bolso','What fell from the pocket','Lo que cayó del bolsillo'),
  text:()=>P(L(`Do que restou do roupão, cai um porta-retratos pequeno. Vidro rachado. Uma foto de família: seu pai, sua mãe, Eros, você.

O roupão de seda era o do seu pai. A aliança no que sobrou da mão também.

A Besta de Sangue era Frederick Wezen.`,
`From what's left of the robe, a small picture frame falls out. Cracked glass. A family photo: your father, your mother, Eros, you.

The silk robe was your father's. So was the wedding ring on what's left of the hand.

The Blood Beast was Frederick Wezen.`,
`De lo que queda de la bata cae un portarretratos pequeño. Vidrio rajado. Una foto familiar: tu padre, tu madre, Eros, tú.

La bata de seda era la de tu padre. El anillo en lo que queda de la mano, también.

La Bestia de Sangre era Frederick Wezen.`)),
  choices:()=>[
    {label:L('Fechar os olhos do seu pai','Close your father\'s eyes','Cerrarle los ojos a tu padre'),test:{sk:'Vontade',dt:15},
      ok:()=>({text:P(L(`Suas mãos tremem, mas você faz. Mada fica de pé ao seu lado sem dizer nada, e isso é tudo o que você precisava.`,`Your hands shake, but you do it. Mada stands beside you without a word, and that's all you needed.`,`Te tiemblan las manos, pero lo haces. Mada se queda de pie a tu lado sin decir nada, y eso es todo lo que necesitabas.`))+bond('mada')+loseSan('1d3',L('seu pai','your father','tu padre')),go:'m2b_casa'}),
      fail:()=>({text:P(L(`Você não consegue chegar perto. Senta no degrau da escada com a foto no colo e não chora. Não aqui. Não na frente deles.`,`You can't bring yourself to get close. You sit on the stairs with the photo in your lap and don't cry. Not here. Not in front of them.`,`No logras acercarte. Te sientas en un escalón con la foto en el regazo y no lloras. No aquí. No delante de ellos.`))+loseSan('1d6',L('seu pai','your father','tu padre')),go:'m2b_casa'})}
  ]},

m2b_casa:{act:CH4,title:L('Os parentes','The relatives','Los parientes'),
  text:()=>P(L(`Pelos corredores, zumbis de sangue menores. Derick e Mada cuidam deles rápido, quase em silêncio. Cada um carrega no peito, cravado na carne, o brasão da família Wezen. Tios. Primos. A sua avó.

Você pega um dos brasões do chão. Não sabe por quê. Guarda no bolso.`,
`In the hallways, smaller blood zombies. Derick and Mada deal with them quickly, almost in silence. Each one carries the Wezen family crest on its chest, driven into the flesh. Uncles. Cousins. Your grandmother.

You pick one of the crests up off the floor. You don't know why. You put it in your pocket.`,
`Por los pasillos, zombis de sangre más pequeños. Derick y Mada se encargan rápido, casi en silencio. Cada uno lleva en el pecho, clavado en la carne, el escudo de la familia Wezen. Tíos. Primos. Tu abuela.

Levantas uno de los escudos del suelo. No sabes por qué. Te lo guardas en el bolsillo.`))+addClue('brasao'),
  choices:()=>[{label:L('Subir ao escritório do seu pai','Go up to your father\'s study','Subir al despacho de tu padre'),main:true,run:()=>({go:'m3_escritorio'})}]},

m3_escritorio:{act:CH4,title:L('O escritório','The study','El despacho'),
  text:()=>P(L(`O armário de livros está destruído, e atrás dele há uma porta de aço com um teclado. Em cima do teclado, alguém prendeu uma foto com fita.`,`The bookcase is destroyed, and behind it there's a steel door with a keypad. Above the keypad, someone has taped a photo.`,`La biblioteca está destrozada, y detrás hay una puerta de acero con un teclado. Encima del teclado, alguien pegó una foto con cinta.`))+addClue('foto')+P(L(`No visor: "SENHA: O TERCEIRO".`,`On the display: "PASSWORD: THE THIRD".`,`En la pantalla: "CONTRASEÑA: EL TERCERO".`))+
    (S.flags.senha_erros?P(L(`Tentativas erradas: ${S.flags.senha_erros}/3.`,`Wrong attempts: ${S.flags.senha_erros}/3.`,`Intentos fallidos: ${S.flags.senha_erros}/3.`)):''),
  choices:()=>[
    {input:{placeholder:L('Senha','Password','Contraseña')},label:L('Digitar','Enter','Ingresar'),
      run:v=>{const ok=(v||'').trim().toUpperCase()==='SKART';
        if(ok)return {text:P(L(`"Skart." A porta destrava. Por um segundo você tem sete anos de novo, com o gato no colo e o braço inteiro.`,`"Skart." The door unlocks. For a second you're seven again, the cat in your lap and your arm whole.`,`"Skart." La puerta se destraba. Por un segundo vuelves a tener siete años, con el gato en brazos y el brazo entero.`))+bond('derick'),go:'m4_tunel'};
        S.flags.senha_erros=(S.flags.senha_erros||0)+1;
        if(S.flags.senha_erros>=3)return {text:P(L(`O teclado trava. Derick suspira, corta a palma e desenha um símbolo na porta. O aço estala e cede, com um estrondo que acorda a casa inteira.`,`The keypad locks. Derick sighs, cuts his palm and draws a symbol on the door. The steel cracks and gives, with a boom that wakes the whole house.`,`El teclado se bloquea. Derick suspira, se corta la palma y dibuja un símbolo en la puerta. El acero cruje y cede, con un estruendo que despierta a toda la casa.`))+losePv('1d4',L('os estilhaços','the shrapnel','las esquirlas')),go:'m4_tunel'};
        return {text:P(L(`O visor pisca vermelho.`,`The display flashes red.`,`La pantalla parpadea en rojo.`))}}}
  ]},

m4_tunel:{act:CH4,title:L('O túnel','The tunnel','El túnel'),
  text:()=>P(L(`Um túnel de concreto, largo o bastante para um carro, sai do porão da mansão em linha reta. Vocês andam dez minutos no escuro até a lanterna de Derick encontrar o primeiro corpo.

Luna, sentada contra a parede, com a pele toda cinza. Ryan, alguns metros à frente, cheio de facadas e com o rosto afundado. E Bob. Três cortes paralelos, do ombro ao quadril.

Mada se ajoelha ao lado do irmão mais novo. Não faz barulho nenhum.`,
`A concrete tunnel, wide enough for a car, runs straight out of the mansion's basement. You walk ten minutes in the dark until Derick's flashlight finds the first body.

Luna, sitting against the wall, her skin completely grey. Ryan, a few meters ahead, full of stab wounds, his face caved in. And Bob. Three parallel cuts, shoulder to hip.

Mada kneels beside his younger brother. He doesn't make a sound.`,
`Un túnel de concreto, lo bastante ancho para un auto, sale en línea recta del sótano de la mansión. Caminan diez minutos a oscuras hasta que la linterna de Derick encuentra el primer cuerpo.

Luna, sentada contra la pared, con la piel toda gris. Ryan, unos metros más adelante, lleno de puñaladas y con la cara hundida. Y Bob. Tres cortes paralelos, del hombro a la cadera.

Mada se arrodilla junto a su hermano menor. No hace ningún ruido.`)),
  choices:()=>[
    {once:'luto',label:L('Ficar ao lado de Mada','Stay by Mada\'s side','Quedarte al lado de Mada'),test:{sk:'Vontade',dt:16},
      ok:()=>({text:P(L(`Você se ajoelha também. Não fala nada. Depois de um minuto, ele encosta o ombro no seu.`,`You kneel too. You say nothing. After a minute, he leans his shoulder against yours.`,`Te arrodillas también. No dices nada. Después de un minuto, él apoya el hombro contra el tuyo.`))+bond('mada')+loseSan('1d3',L('a Equipe Bob','Team Bob','el Equipo Bob'))}),
      fail:()=>({text:P(L(`Você tenta, mas a imagem de Luna segurando sua mão ontem não sai da sua cabeça.`,`You try, but the image of Luna holding your hand yesterday won't leave your head.`,`Lo intentas, pero la imagen de Luna tomándote la mano ayer no se te va de la cabeza.`))+loseSan('1d6',L('a Equipe Bob','Team Bob','el Equipo Bob'))})},
    {once:'exame',label:L('Examinar os ferimentos','Examine the wounds','Examinar las heridas'),test:{sk:'Medicina',dt:13},
      ok:()=>({text:P(L(`Facadas e golpes de nunchaku em Ryan: Luck. A pele cinza em Luna: o mesmo ritual de Judite. E Bob...`,`Stab wounds and nunchaku blows on Ryan: Luck. The grey skin on Luna: the same ritual as Judite. And Bob...`,`Puñaladas y golpes de nunchaku en Ryan: Luck. La piel gris de Luna: el mismo ritual que Judite. Y Bob...`))+addClue('ferimentos')}),
      fail:()=>({text:P(L(`Você não consegue olhar por tempo suficiente.`,`You can't look long enough.`,`No logras mirar el tiempo suficiente.`))+loseSan('1d3',L('os corpos','the bodies','los cuerpos'))})},
    {label:L('"A gente precisa ir", diz Derick','"We have to go," says Derick','"Tenemos que irnos", dice Derick'),main:true,run:()=>({go:'m5_hospital'})}
  ]},

m5_hospital:{act:CH4,title:L('De volta ao começo','Back to the start','De vuelta al comienzo'),
  text:()=>P(L(`O túnel termina numa escada. Vocês sobem e saem no subsolo do hospital. As celas estão abertas. Vazias. Nem sinal de Aline, Luck, Formiga. Nem do seu irmão.

Jon coça o queixo. "Mansão, hospital, túnel. Eles estão brincando com a gente enquanto o alvo de verdade é outro." Uma pausa longa demais. "A Base."`,
`The tunnel ends at a staircase. You climb up and come out in the hospital basement. The cells are open. Empty. No sign of Aline, Luck, Formiga. Or of your brother.

Jon scratches his chin. "Mansion, hospital, tunnel. They're playing with us while the real target is somewhere else." A pause that goes on too long. "The Base."`,
`El túnel termina en una escalera. Suben y salen al subsuelo del hospital. Las celdas están abiertas. Vacías. Ni rastro de Aline, Luck, Formiga. Ni de tu hermano.

Jon se rasca la barbilla. "Mansión, hospital, túnel. Están jugando con nosotros mientras el verdadero objetivo es otro." Una pausa demasiado larga. "La Base."`)),
  choices:()=>[{label:L('Sair do hospital','Leave the hospital','Salir del hospital'),main:true,run:()=>({go:'m6_traicao'})}]},

m6_traicao:{act:CH4,title:L('O estacionamento','The parking lot','El estacionamiento'),
  text:()=>P(L(`O estacionamento está vazio, exceto pelo carro do Bob. Mada vai na frente. Jon fica três passos atrás dele. Leon, ao seu lado.

Você ouve o clique de uma trava de segurança.`,
`The parking lot is empty except for Bob's car. Mada walks ahead. Jon stays three steps behind him. Leon, beside you.

You hear the click of a safety catch.`,
`El estacionamiento está vacío, salvo por el auto de Bob. Mada va adelante. Jon se queda tres pasos detrás de él. Leon, a tu lado.

Oyes el clic de un seguro.`)),
  choices:()=>{
    const arr=[];
    if(S.susp.jon||S.susp.leon)arr.push({label:L('Gritar "MADA!" antes do tiro','Scream "MADA!" before the shot','Gritar "¡MADA!" antes del disparo'),run:()=>{S.flags.avisou=true;return {text:P(L(`Mada já está girando antes do seu grito terminar. A katana sobe e a bala de Jon ricocheteia no aço com uma faísca. Ele te olha por um instante: você sabia. Ele também.`,`Mada is already turning before your scream ends. The katana comes up and Jon's bullet ricochets off the steel in a spark. He looks at you for an instant: you knew. So did he.`,`Mada ya está girando antes de que termines de gritar. La katana sube y la bala de Jon rebota en el acero con una chispa. Te mira un instante: tú lo sabías. Él también.`))+bond('mada',2),go:'m6b_traicao'}}});
    arr.push({label:L('Virar para olhar','Turn to look','Girarte a mirar'),run:()=>({text:P(L(`O tiro de Jon sai. Mada, que já desconfiava, gira e rebate a bala com a katana. A faísca ilumina o rosto de Jon. Ele nem parece surpreso.`,`Jon's shot goes off. Mada, who already had his doubts, spins and deflects the bullet with his katana. The spark lights up Jon's face. He doesn't even look surprised.`,`El disparo de Jon sale. Mada, que ya sospechaba, gira y desvía la bala con la katana. La chispa ilumina la cara de Jon. Ni siquiera parece sorprendido.`)),go:'m6b_traicao'})});
    return arr;
  }},

m6b_traicao:{act:CH4,title:L('Traição','Betrayal','Traición'),
  text:()=>P(L(`Leon saca a pistola e aponta para Derick. "Nada pessoal, garoto."

Mada fica entre os dois e os agentes. A voz dele não sobe nem um tom. "Derick. Pega a Koranna e leva ela no carro do Bob. Agora."

"Mada..." "AGORA."`,
`Leon draws his pistol and aims at Derick. "Nothing personal, kid."

Mada puts himself between the two of them and the others. His voice doesn't rise even a little. "Derick. Take Koranna and get her into Bob's car. Now."

"Mada..." "NOW."`,
`Leon saca la pistola y apunta a Derick. "Nada personal, chico."

Mada se pone entre los dos traidores y ellos. Su voz no sube ni un tono. "Derick. Toma a Koranna y llévala en el auto de Bob. Ahora."

"Mada..." "AHORA."`)),
  choices:()=>[
    {once:'ficar',label:L('"Eu fico e luto com você"','"I\'m staying to fight with you"','"Me quedo a pelear contigo"'),
      run:()=>({text:P(L(`"Você ainda não sabe lutar", ele diz, sem tirar os olhos de Jon. "Vai. Se eu não voltar, cuida dele."`,`"You don't know how to fight yet," he says, without taking his eyes off Jon. "Go. If I don't come back, look after him."`,`"Todavía no sabes pelear", dice, sin quitarle los ojos a Jon. "Vete. Si no vuelvo, cuídalo."`))+bond('mada')})},
    {label:L('Correr para o carro','Run for the car','Correr al auto'),main:true,test:{sk:'Atletismo',dt:12},
      ok:()=>({text:P(L(`Você corre abaixada. Derick já está com o motor ligado.`,`You run low. Derick already has the engine running.`,`Corres agachada. Derick ya tiene el motor encendido.`)),go:'m7_fuga'}),
      fail:()=>({text:P(L(`Leon atira na sua direção. A bala abre sua coxa de raspão.`,`Leon fires at you. The bullet grazes your thigh open.`,`Leon dispara hacia ti. La bala te abre el muslo de refilón.`))+losePv('1d8',L('o tiro de Leon','Leon\'s shot','el disparo de Leon')),go:'m7_fuga'})}
  ]},

m7_fuga:{act:CH4,title:L('Fuga','Escape','Huida'),
  text:()=>P(L(`Derick dirige com as duas mãos cravadas no volante. No retrovisor, os disparos no estacionamento ficam pequenos até sumir. Ele não fala. Os dedos dele estão brancos.`,`Derick drives with both hands clamped on the wheel. In the rearview mirror, the gunfire in the parking lot shrinks until it's gone. He doesn't speak. His knuckles are white.`,`Derick maneja con las dos manos clavadas en el volante. En el retrovisor, los disparos del estacionamiento se achican hasta desaparecer. No habla. Tiene los nudillos blancos.`)),
  choices:()=>[
    {label:L('Conversar com Derick','Talk to Derick','Hablar con Derick'),run:()=>{S.flags.sabe_traidor=true;return {text:P(L(`"Ele vai voltar", você diz. "Ele sempre volta", Derick responde rápido demais. Depois, mais baixo: "Eu não sei fazer nada sem ele. Nada." Vocês ficam em silêncio. Então ele franze a testa. "Jon e Leon foram recrutados pelo Roger. Pessoalmente. Koranna... se tinha dois lá fora, pode ter mais lá dentro."`,`"He'll come back," you say. "He always comes back," Derick answers too fast. Then, quieter: "I can't do anything without him. Nothing." You both go silent. Then he frowns. "Jon and Leon were recruited by Roger. Personally. Koranna... if there were two out there, there could be more inside."`,`"Va a volver", dices. "Siempre vuelve", responde Derick demasiado rápido. Luego, más bajo: "No sé hacer nada sin él. Nada." Se quedan en silencio. Entonces frunce el ceño. "A Jon y Leon los reclutó Roger. En persona. Koranna... si había dos afuera, puede haber más adentro."`))+bond('derick'),go:'m8_base'}}},
    {label:L('Ficar em silêncio','Stay silent','Quedarte en silencio'),run:()=>({text:P(L(`Você olha pela janela. A cidade passa em borrões de luz amarela.`,`You look out the window. The city passes in smears of yellow light.`,`Miras por la ventana. La ciudad pasa en manchones de luz amarilla.`)),go:'m8_base'})}
  ]},

m8_base:{act:CH4,title:L('A Base','The Base','La Base'),
  text:()=>P(L(`A estante de vinhos está afastada. A passagem, aberta.

Lá embaixo, o silêncio tem cheiro. Thomas, caído no corredor, ainda segurando a pistola. Roger, na própria cadeira. Jade e Lipe, juntos, um por cima do outro. A ala médica inteira. A prisão inteira.

E no fim do corredor, de luvas, arrastando um corpo para dentro de uma sala, organizado como sempre: Roger Jr.`,
`The wine rack has been pushed aside. The passage is open.

Down below, the silence has a smell. Thomas, fallen in the corridor, still holding his pistol. Roger, in his own chair. Jade and Lipe, together, one on top of the other. The entire medical wing. The entire prison.

And at the end of the corridor, gloved, dragging a body into a room, orderly as ever: Roger Jr.`,
`El estante de vinos está corrido. El pasaje, abierto.

Abajo, el silencio tiene olor. Thomas, caído en el pasillo, todavía con la pistola en la mano. Roger, en su propia silla. Jade y Lipe, juntos, uno encima del otro. Toda el ala médica. Toda la prisión.

Y al final del pasillo, con guantes, arrastrando un cuerpo hacia una sala, ordenado como siempre: Roger Jr.`))+((S.flags.sabe_traidor||S.susp.rjr)?P(L(`Você entende antes do Derick. Você já esperava. Sua mão já está na arma.`,`You understand before Derick does. You were expecting it. Your hand is already on your weapon.`,`Lo entiendes antes que Derick. Ya lo esperabas. Tu mano ya está en el arma.`)):''),
  choices:()=>[
    {label:L('Ver os corpos','Look at the bodies','Ver los cuerpos'),test:{sk:'Vontade',dt:16},
      ok:()=>({text:loseSan('1d4',L('a Base','the Base','la Base')),go:'m8b_rjr'}),
      fail:()=>({text:loseSan('2d4',L('a Base','the Base','la Base')),go:'m8b_rjr'})}
  ]},

m8b_rjr:{act:CH4,title:'Roger Jr',
  text:()=>P(L(`Ele larga o corpo e ajeita as luvas. "Eu nunca escolhi nada nessa vida. Nem o nome." Um sorriso educado. "Agora escolhi."

Derick fica na sua frente, com as mãos já sangrando para o ritual. Você sabe que não tem chance. Mas se cair, o Derick cai junto.`,
`He drops the body and adjusts his gloves. "I never chose anything in my life. Not even my name." A polite smile. "Now I have."

Derick steps in front of you, his hands already bleeding for the ritual. You know you don't stand a chance. But if you fall, Derick falls with you.`,
`Suelta el cuerpo y se acomoda los guantes. "Nunca elegí nada en mi vida. Ni el nombre." Una sonrisa educada. "Ahora elegí."

Derick se pone delante de ti, con las manos ya sangrando para el ritual. Sabes que no tienes chance. Pero si caes, Derick cae contigo.`)),
  choices:()=>[{label:L('Lutar','Fight','Pelear'),main:true,run:()=>({combat:{id:'roger_jr',after:'m9_van',allies:['derick'],script:'rogerjr',noDeath:true,surprise:!!(S.flags.sabe_traidor||S.susp.rjr)}})}]},

m9_van:{act:CH4,title:L('A van','The van','La camioneta'),
  text:()=>P(L(`Mada e Derick costuram um ao outro na ala médica vazia. Depois, cuidam de você. Depois, um por um, garantem que nenhum corpo da Base vá se levantar. Mada tira o relógio do pulso de Thomas e coloca no próprio.

Três pessoas saem de uma Base que tinha quarenta. Uma van sem placa. Nenhum destino.

Na estrada, Derick pergunta como ele venceu Jon e Leon. Mada demora para responder. "Eu duvidei. Achei que ia morrer." Ele olha para Derick pelo retrovisor. "Mas não daquele jeito. E não ia te deixar sozinho." Derick começa a chorar.`,
`Mada and Derick stitch each other up in the empty medical wing. Then they tend to you. Then, one by one, they make sure no body in the Base will get back up. Mada takes the watch off Thomas's wrist and puts it on his own.

Three people walk out of a Base that had forty. An unmarked van. No destination.

On the road, Derick asks how he beat Jon and Leon. Mada takes a while to answer. "I doubted. I thought I was going to die." He looks at Derick in the rearview mirror. "But not like that. And I wasn't going to leave you alone." Derick starts to cry.`,
`Mada y Derick se cosen el uno al otro en el ala médica vacía. Después te atienden a ti. Después, uno por uno, se aseguran de que ningún cuerpo de la Base vuelva a levantarse. Mada le quita el reloj de la muñeca a Thomas y se lo pone.

Tres personas salen de una Base que tenía cuarenta. Una camioneta sin patente. Ningún destino.

En la carretera, Derick pregunta cómo venció a Jon y a Leon. Mada tarda en responder. "Dudé. Pensé que iba a morir." Mira a Derick por el retrovisor. "Pero no así. Y no iba a dejarte solo." Derick empieza a llorar.`)),
  choices:()=>[
    {label:L('Segurar a mão de Derick','Hold Derick\'s hand','Tomarle la mano a Derick'),run:()=>({text:P(L(`Ele aperta de volta, forte, e não solta até dormir.`,`He squeezes back, hard, and doesn't let go until he falls asleep.`,`Te aprieta fuerte y no te suelta hasta dormirse.`))+bond('derick')+calm(2),levelup:'a5_apto'})},
    {label:L('Olhar pela janela e deixar ele chorar','Look out the window and let him cry','Mirar por la ventana y dejarlo llorar'),run:()=>({text:P(L(`Você aprendeu cedo que certas coisas não se interrompem.`,`You learned early that some things shouldn't be interrupted.`,`Aprendiste temprano que ciertas cosas no se interrumpen.`)),levelup:'a5_apto'})}
  ]},

a5_apto:{act:CH5,title:L('O apartamento','The apartment','El departamento'),checkpoint:true,
  text:()=>P(L(`Meses. Um apartamento num prédio abandonado, emprestado por alguém do passado do Mada. Colchões no chão, um mapa na parede cheio de alfinetes que não levam a lugar nenhum. A nova Equipe Mada: três pessoas.

Toda manhã, treino. Lança, pistola, queda, levantar. Mada não pega leve. Hoje ele está de bom humor, o que é pior.`,
`Months. An apartment in an abandoned building, lent by someone from Mada's past. Mattresses on the floor, a map on the wall full of pins that lead nowhere. The new Team Mada: three people.

Every morning, training. Spear, pistol, fall, get up. Mada doesn't go easy. Today he's in a good mood, which is worse.`,
`Meses. Un departamento en un edificio abandonado, prestado por alguien del pasado de Mada. Colchones en el piso, un mapa en la pared lleno de alfileres que no llevan a ningún lado. El nuevo Equipo Mada: tres personas.

Cada mañana, entrenamiento. Lanza, pistola, caer, levantarse. Mada no afloja. Hoy está de buen humor, lo cual es peor.`)),
  choices:()=>[
    {once:'treino_l',label:L('Treino de lança contra a katana de madeira','Spear practice against the wooden katana','Práctica de lanza contra la katana de madera'),test:{sk:'Luta',dt:15},
      ok:()=>({text:P(L(`Você finta, gira e encosta a ponta no pescoço dele. Ele sorri. "Finalmente."`,`You feint, spin and touch the tip to his neck. He smiles. "Finally."`,`Amagas, giras y le apoyas la punta en el cuello. Sonríe. "Por fin."`))+bond('mada')}),
      fail:()=>({text:P(L(`Você acaba no chão pela sexta vez. "De novo", ele diz, estendendo a mão.`,`You end up on the floor for the sixth time. "Again," he says, holding out his hand.`,`Terminas en el piso por sexta vez. "Otra vez", dice, tendiéndote la mano.`))})},
    {once:'treino_p',label:L('Treino de tiro no terraço','Target practice on the rooftop','Práctica de tiro en la azotea'),test:{sk:'Pontaria',dt:14},
      ok:()=>({text:P(L(`Cinco latas, cinco tiros. Derick aplaude do parapeito, de pijama.`,`Five cans, five shots. Derick applauds from the ledge, in his pajamas.`,`Cinco latas, cinco tiros. Derick aplaude desde el parapeto, en pijama.`))+bond('derick')}),
      fail:()=>({text:P(L(`O vento leva metade dos tiros. Derick finge que não viu.`,`The wind takes half your shots. Derick pretends he didn't see.`,`El viento se lleva la mitad de los tiros. Derick finge no haberlo visto.`))})},
    {label:L('"VT e Kavyur responderam", grita Derick do corredor','"VT and Kavyur replied!" Derick shouts from the hallway','"¡VT y Kavyur respondieron!", grita Derick desde el pasillo'),main:true,run:()=>({go:'a5_aeroporto'})}
  ]},

a5_aeroporto:{act:CH5,title:L('Sob o aeroporto','Under the airport','Bajo el aeropuerto'),
  text:()=>P(L(`Um hangar desativado, um elevador de carga, e sessenta metros para baixo: uma base maior do que a antiga Base da Ordem inteira. VT, loiro, de bermuda e fuzil M4 no ombro, abraça Mada como um irmão. Kavyur, moreno, fica mais atrás, observando você sem piscar.

Café, pão de queijo, e histórias: VT treinou os três irmãos Zart antes da Ordem. Eles escolheram a Ordem em vez dele. Ele ainda finge que não se importa.

"Pega o que precisar no arsenal", diz VT. "Aqui a regra é outra."`,
`A decommissioned hangar, a freight elevator, and sixty meters down: a base bigger than the entire old Order Base. VT, blond, in shorts with an M4 on his shoulder, hugs Mada like a brother. Kavyur, dark-haired, hangs back, watching you without blinking.

Coffee, cheese bread and stories: VT trained the three Zart brothers before the Order. They chose the Order over him. He still pretends he doesn't care.

"Take what you need from the armory," says VT. "Different rules here."`,
`Un hangar abandonado, un montacargas, y sesenta metros hacia abajo: una base más grande que toda la antigua Base de la Orden. VT, rubio, en bermudas y con un fusil M4 al hombro, abraza a Mada como a un hermano. Kavyur, moreno, se queda atrás, observándote sin parpadear.

Café, pan de queso e historias: VT entrenó a los tres hermanos Zart antes de la Orden. Ellos eligieron la Orden en lugar de él. Todavía finge que no le importa.

"Llévate lo que necesites del arsenal", dice VT. "Aquí las reglas son otras."`)),
  choices:()=>[{label:L('Abrir o arsenal de VT','Open VT\'s armory','Abrir el arsenal de VT'),main:true,run:()=>({arsenal:{next:'a5_revelacao',patente:'operador'}})}]},

a5_revelacao:{act:CH5,title:L('Conversas reservadas','Private talks','Charlas privadas'),
  text:()=>P(L(`VT chama Mada para uma sala e fecha a porta. Kavyur fica com você e com Derick. Mada pediu para ele manter a pistola apontada para você a conversa toda. "Nada pessoal", diz Kavyur. "Ele confia pouco. Eu confio menos."`,`VT calls Mada into a room and closes the door. Kavyur stays with you and Derick. Mada asked him to keep his pistol pointed at you the whole time. "Nothing personal," says Kavyur. "He doesn't trust much. I trust less."`,`VT llama a Mada a una sala y cierra la puerta. Kavyur se queda contigo y con Derick. Mada le pidió que mantuviera la pistola apuntándote toda la charla. "Nada personal", dice Kavyur. "Él confía poco. Yo confío menos."`)),
  choices:()=>[
    {once:'ouvir_vt',label:L('Tentar ouvir a conversa de VT e Mada','Try to overhear VT and Mada','Intentar escuchar la charla de VT y Mada'),test:{sk:'Furtividade',dt:15},
      ok:()=>{S.flags.ouviu_vt=true;return {text:P(L(`"...o Eros não sabia que ela estava viva, Mada. Ele achava que tinha deixado a irmã morrer. Procurou aqueles três para trazer ela de volta com ritual. Eles usaram isso." Você cobre a boca com a mão.`,`"...Eros didn't know she was alive, Mada. He thought he'd let his sister die. He went to those three to bring her back with a ritual. They used that." You cover your mouth with your hand.`,`"...Eros no sabía que ella estaba viva, Mada. Creía que había dejado morir a su hermana. Buscó a esos tres para traerla de vuelta con un ritual. Ellos lo usaron." Te tapas la boca con la mano.`))+loseSan('1d4',L('a verdade','the truth','la verdad'))}},
      fail:()=>({text:P(L(`Kavyur estala a língua e balança a pistola. "Senta."`,`Kavyur clicks his tongue and waves the pistol. "Sit."`,`Kavyur chasquea la lengua y mueve la pistola. "Siéntate."`))})},
    {once:'kavyur',label:L('Conversar com Kavyur','Talk to Kavyur','Hablar con Kavyur'),
      run:()=>({text:P(L(`Ele conta sem rodeio: estudava o paranormal, se meteu com um grupo que queria criar uma criatura. Todos morreram. Os Zart chegaram no último segundo. Você conta a sua história em troca. Quando termina, ele abaixa a pistola. Só um pouco.`,`He tells it straight: he studied the paranormal, got involved with a group trying to create a creature. They all died. The Zarts arrived at the last second. You tell him your story in return. When you finish, he lowers the pistol. Just a little.`,`Te lo cuenta sin rodeos: estudiaba lo paranormal, se metió con un grupo que quería crear una criatura. Todos murieron. Los Zart llegaron en el último segundo. Tú le cuentas tu historia a cambio. Cuando terminas, baja la pistola. Solo un poco.`))+bond('kavyur')+calm(2)})},
    {label:L('Ir embora com Mada e Derick','Leave with Mada and Derick','Irte con Mada y Derick'),main:true,run:()=>({go:'a5_volta'})}
  ]},

a5_volta:{act:CH5,title:L('A estrada','The road','La carretera'),
  text:()=>P(L(`No carro, Mada conta tudo. Eros não sabia que você estava viva. Ele tentou te trazer de volta. Foi manipulado. Jon, Leon e Roger Jr agiam por ambição, querendo tomar a Ordem. E Eros sumiu do próprio grupo que o usava, sem deixar rastro.${S.flags.ouviu_vt?' Você já sabia, mas ouvir de novo não dói menos.':''}

Você chora. Na frente deles. Derick passa para o banco de trás e te abraça sem dizer nada. Mada dirige em silêncio.

Meia hora depois, ele para num posto. "Janta. Você escolhe."`,
`In the car, Mada tells you everything. Eros didn't know you were alive. He tried to bring you back. He was manipulated. Jon, Leon and Roger Jr acted out of ambition, trying to take over the Order. And Eros vanished from the very group that was using him, without a trace.${S.flags.ouviu_vt?' You already knew, but hearing it again doesn\'t hurt any less.':''}

You cry. In front of them. Derick climbs into the back seat and hugs you without a word. Mada drives in silence.

Half an hour later, he pulls into a gas station. "Dinner. You pick."`,
`En el auto, Mada te cuenta todo. Eros no sabía que estabas viva. Intentó traerte de vuelta. Fue manipulado. Jon, Leon y Roger Jr actuaban por ambición, queriendo tomar la Orden. Y Eros desapareció del mismo grupo que lo usaba, sin dejar rastro.${S.flags.ouviu_vt?' Ya lo sabías, pero oírlo de nuevo no duele menos.':''}

Lloras. Delante de ellos. Derick pasa al asiento de atrás y te abraza sin decir nada. Mada maneja en silencio.

Media hora después, para en una estación de servicio. "Cena. Tú eliges."`)),
  choices:()=>[
    {label:L('Pizza','Pizza','Pizza'),run:()=>({text:P(L(`Pizza de calabresa no capô da van, às onze da noite. Derick diz que era exatamente o que ele ia escolher.`,`Pepperoni pizza on the hood of the van at eleven at night. Derick says it's exactly what he would've picked.`,`Pizza de longaniza sobre el capó de la camioneta, a las once de la noche. Derick dice que era exactamente lo que él iba a elegir.`))+calm(3),go:'a5_noite'})},
    {label:L('Hambúrguer','Burgers','Hamburguesas'),run:()=>({text:P(L(`Hambúrguer de posto, gordura escorrendo até o cotovelo. Derick diz que era exatamente o que ele ia escolher.`,`Gas station burgers, grease running down to your elbows. Derick says it's exactly what he would've picked.`,`Hamburguesas de gasolinera, la grasa chorreando hasta el codo. Derick dice que era exactamente lo que él iba a elegir.`))+calm(3),go:'a5_noite'})}
  ]},

a5_noite:{act:CH5,title:L('Madrugada','Late night','Madrugada'),
  text:()=>P(L(`Você deita. Pela porta entreaberta, a luz da cozinha. Mada e Derick conversam baixo.`,`You lie down. Through the half-open door, the kitchen light. Mada and Derick talk quietly.`,`Te acuestas. Por la puerta entreabierta, la luz de la cocina. Mada y Derick hablan en voz baja.`)),
  choices:()=>[
    {label:L('Dormir','Sleep','Dormir'),run:()=>({text:P(L(`Pela primeira vez em meses, você dorme sem sonhar.`,`For the first time in months, you sleep without dreaming.`,`Por primera vez en meses, duermes sin soñar.`))+calm(d(4)),levelup:'a6_tunel'})},
    {label:L('Ficar escutando','Keep listening','Quedarte escuchando'),test:{sk:'Furtividade',dt:12},
      ok:()=>{S.flags.noite=true;return {text:P(L(`"Eu desconfiava do Thomas", diz Mada. "Do meu irmão. Enquanto os três traidores estavam do meu lado." Derick: "Você não tinha como saber. Foca no agora." E depois: "O Eros sumir vivo do grupo? Duvido. Eles usaram o Luck de cobaia. Podem ter usado ele." Silêncio. "Amanhã a gente volta pro túnel."`,`"I suspected Thomas," says Mada. "My own brother. While the three traitors were right next to me." Derick: "You had no way of knowing. Focus on now." And then: "Eros getting out of that group alive? I doubt it. They used Luck as a test subject. They might have used him too." Silence. "Tomorrow we go back to the tunnel."`,`"Yo sospechaba de Thomas", dice Mada. "De mi propio hermano. Mientras los tres traidores estaban a mi lado." Derick: "No tenías cómo saberlo. Concéntrate en el ahora." Y después: "¿Eros saliendo vivo de ese grupo? Lo dudo. Usaron a Luck de cobaya. Pueden haberlo usado a él." Silencio. "Mañana volvemos al túnel."`))+loseSan('1d3',L('a dúvida','the doubt','la duda')),levelup:'a6_tunel'}},
      fail:()=>({text:P(L(`O piso range. A conversa para. Você finge dormir até dormir de verdade.`,`The floor creaks. The conversation stops. You pretend to sleep until you really do.`,`El piso cruje. La charla se corta. Finges dormir hasta dormirte de verdad.`)),levelup:'a6_tunel'})}
  ]},

a6_tunel:{act:CH6,title:L('De volta ao escuro','Back into the dark','De vuelta a la oscuridad'),checkpoint:true,
  text:()=>P(L(`Vocês descem direto pelo escritório do seu pai. O túnel está mais frio do que você lembrava. Os corpos da Equipe Bob já não estão lá.

Três vozes à frente. Uma fogueira. Aline, afiando a espada. Luck, girando o nunchaku. Formiga, desenhando no chão com o dedo.

Luck vê vocês primeiro e abre um sorriso enorme. "Voltaram pro lugar onde o irmãozinho morreu, Mada?"

Mada vai em Luck. Derick vai em Formiga. E Aline vem em você.`,
`You go straight down through your father's study. The tunnel is colder than you remember. Team Bob's bodies are gone.

Three voices ahead. A fire. Aline, sharpening her sword. Luck, spinning his nunchaku. Formiga, drawing on the ground with his finger.

Luck sees you first and breaks into a huge grin. "Back where little brother died, Mada?"

Mada goes for Luck. Derick goes for Formiga. And Aline comes for you.`,
`Bajan directo por el despacho de tu padre. El túnel está más frío de lo que recordabas. Los cuerpos del Equipo Bob ya no están.

Tres voces más adelante. Una fogata. Aline, afilando la espada. Luck, girando el nunchaku. Formiga, dibujando en el suelo con el dedo.

Luck los ve primero y abre una sonrisa enorme. "¿Volvieron adonde murió el hermanito, Mada?"

Mada va por Luck. Derick va por Formiga. Y Aline viene por ti.`)),
  choices:()=>[{label:L('Enfrentar Aline','Face Aline','Enfrentar a Aline'),main:true,run:()=>({combat:{id:'aline2',after:'a6_enpap',script:'aline2',noDeath:true}})}]},

a6_enpap:{act:CH6,title:'Enpap-X',
  text:()=>P(L(`O corpo de Aline cai de um lado, a cabeça do outro. Luck para de rir.

"FORMIGA! O FRASCO!" Formiga crava uma seringa no pescoço dele e sai correndo túnel adentro. Luck grita. As costas dele se abrem. Dois braços novos saem das costelas.`,
`Aline's body falls one way, her head the other. Luck stops laughing.

"FORMIGA! THE VIAL!" Formiga jams a syringe into his neck and runs off down the tunnel. Luck screams. His back splits open. Two new arms burst out of his ribs.`,
`El cuerpo de Aline cae hacia un lado y la cabeza hacia el otro. Luck deja de reír.

"¡FORMIGA! ¡EL FRASCO!" Formiga le clava una jeringa en el cuello y sale corriendo túnel adentro. Luck grita. La espalda se le abre. Dos brazos nuevos le salen de las costillas.`)),
  choices:()=>[{label:L('Lutar ao lado de Mada e Derick','Fight alongside Mada and Derick','Pelear junto a Mada y Derick'),main:true,run:()=>({combat:{id:'enpapx',after:'a6_frasco',allies:['mada','derick'],winText:L('O Enpap-X desaba e se desfaz em sangue preto.','The Enpap-X collapses and dissolves into black blood.','El Enpap-X se derrumba y se deshace en sangre negra.')}})}]},

a6_frasco:{act:CH6,title:L('O frasco','The vial','El frasco'),
  text:()=>P(L(`Derick recolhe a seringa do chão e vira contra a luz. "Mada." A etiqueta é do almoxarifado da Base. Alguém lá de dentro roubou isso antes de tudo cair.`,`Derick picks the syringe up off the ground and holds it to the light. "Mada." The label is from the Base's supply room. Someone inside stole this before everything fell apart.`,`Derick recoge la jeringa del suelo y la pone a contraluz. "Mada." La etiqueta es del almacén de la Base. Alguien de adentro robó esto antes de que todo cayera.`))+addClue('frasco'),
  choices:()=>[
    {label:L('Correr atrás de Formiga','Chase Formiga','Correr tras Formiga'),test:{sk:'Atletismo',dt:16},
      ok:()=>({text:P(L(`Você quase alcança. Ele se vira no último segundo e te olha: não com raiva, com uma tristeza estranha. Some pela escada do hospital.`,`You almost catch him. He turns at the last second and looks at you: not with anger, but with a strange sadness. He disappears up the hospital stairs.`,`Casi lo alcanzas. Se da vuelta en el último segundo y te mira: no con rabia, con una tristeza extraña. Desaparece por la escalera del hospital.`)),go:'a6_celular'}),
      fail:()=>({text:P(L(`O túnel é longo demais. Quando vocês chegam ao hospital, ele já sumiu.`,`The tunnel is too long. By the time you reach the hospital, he's gone.`,`El túnel es demasiado largo. Cuando llegan al hospital, ya desapareció.`)),go:'a6_celular'})}
  ]},

a6_celular:{act:CH6,title:L('O celular','The phone','El celular'),
  text:()=>P(L(`De volta aos corpos. Mada revista Luck. Você revista Aline. No bolso dela, um celular rachado sem senha.`,`Back to the bodies. Mada searches Luck. You search Aline. In her pocket, a cracked phone with no passcode.`,`De vuelta a los cuerpos. Mada revisa a Luck. Tú revisas a Aline. En su bolsillo, un celular rajado sin contraseña.`)),
  choices:()=>[{label:L('Olhar o celular','Check the phone','Revisar el celular'),main:true,run:()=>({text:P(L(`Nenhuma conversa. Nenhuma foto. Um único endereço salvo.`,`No messages. No photos. A single saved address.`,`Ninguna conversación. Ninguna foto. Una sola dirección guardada.`))+addClue('endereco'),levelup:'a7_caminho'})}]},

a7_caminho:{act:CH7,title:L('Zona industrial','Industrial district','Zona industrial'),checkpoint:true,
  text:()=>P(L(`O carro sacode na estrada de terra. Você finalmente pergunta o que ninguém quer responder. "Vocês acham que ele ainda está vivo?"`,`The car rattles along the dirt road. You finally ask what no one wants to answer. "Do you think he's still alive?"`,`El auto se sacude en el camino de tierra. Por fin preguntas lo que nadie quiere responder. "¿Creen que todavía está vivo?"`)),
  choices:()=>[
    {label:L('Pedir a Derick para ser sincero','Ask Derick to be honest','Pedirle a Derick que sea sincero'),run:()=>({text:P(L(`Derick demora. "Eu acho que eles usaram ele como cobaia. Como o Luck." Silêncio até a fábrica.`,`Derick takes a while. "I think they used him as a test subject. Like Luck." Silence all the way to the factory.`,`Derick tarda. "Creo que lo usaron de cobaya. Como a Luck." Silencio hasta la fábrica.`))+bond('derick')+loseSan('1d3',L('a verdade','the truth','la verdad')),go:'a7_fabrica'})},
    {label:L('Não perguntar mais nada','Don\'t ask anything else','No preguntar nada más'),run:()=>({text:P(L(`Você deixa a pergunta morrer no ar.`,`You let the question die in the air.`,`Dejas que la pregunta muera en el aire.`)),go:'a7_fabrica'})}
  ]},

a7_fabrica:{act:CH7,title:L('A fábrica abandonada','The abandoned factory','La fábrica abandonada'),
  text:()=>P(L(`Chaminés apagadas, telhado de amianto. Mada vai sozinho pela direita. Você e Derick, pela esquerda. A primeira barreira: uma escada de ferro enferrujada até uma passarela.`,`Dead chimneys, an asbestos roof. Mada goes alone around the right. You and Derick, the left. The first obstacle: a rusty iron ladder up to a catwalk.`,`Chimeneas apagadas, techo de amianto. Mada va solo por la derecha. Tú y Derick, por la izquierda. El primer obstáculo: una escalera de hierro oxidada hasta una pasarela.`)),
  choices:()=>[
    {label:L('Subir rápido, antes que alguém apareça','Climb fast, before anyone shows up','Subir rápido, antes de que aparezca alguien'),test:{sk:'Furtividade',dt:15},
      ok:()=>({text:P(L(`Três degraus por vez, sem um som. Você está lá em cima em segundos.`,`Three rungs at a time, without a sound. You're up top in seconds.`,`Tres peldaños a la vez, sin un sonido. Estás arriba en segundos.`)),go:'a7_tabuas'}),
      fail:()=>{S.flags.ruido=(S.flags.ruido||0)+1;return {text:P(L(`Um degrau solta um gemido de metal que ecoa pela fábrica inteira.`,`A rung lets out a metallic groan that echoes through the whole factory.`,`Un peldaño suelta un gemido metálico que retumba por toda la fábrica.`)),go:'a7_tabuas'}}},
    {label:L('Subir devagar, degrau por degrau','Climb slowly, rung by rung','Subir despacio, peldaño por peldaño'),test:{sk:'Furtividade',dt:11},
      ok:()=>({text:P(L(`Minutos inteiros. Cada degrau testado. Silêncio total.`,`Whole minutes. Every rung tested. Total silence.`,`Minutos enteros. Cada peldaño probado. Silencio total.`)),go:'a7_tabuas'}),
      fail:()=>{S.flags.ruido=(S.flags.ruido||0)+1;return {text:P(L(`Mesmo devagar, a ferrugem estala sob seu pé.`,`Even going slow, the rust crackles under your foot.`,`Aun despacio, el óxido cruje bajo tu pie.`)),go:'a7_tabuas'}}}
  ]},

a7_tabuas:{act:CH7,title:L('A janela','The window','La ventana'),
  text:()=>P(L(`No fim da passarela, uma janela pregada com tábuas. Por uma fresta, você vê uma sala cheia de figuras de pé, imóveis, feitas de ossos cobertos de uma gosma preta. Esqueletos de Lodo. Dezenas.`,`At the end of the catwalk, a window nailed shut with boards. Through a gap, you see a room full of standing figures, motionless, made of bones coated in black goo. Sludge Skeletons. Dozens.`,`Al final de la pasarela, una ventana tapiada con tablas. Por una rendija ves una sala llena de figuras de pie, inmóviles, hechas de huesos cubiertos de una baba negra. Esqueletos de Lodo. Docenas.`)),
  choices:()=>[
    {label:L('Arrancar as tábuas de uma vez','Rip the boards off all at once','Arrancar las tablas de una vez'),test:{sk:'Atletismo',dt:14,ctx:['porta']},
      ok:()=>({text:P(L(`O braço mecânico arranca as três tábuas num puxão só, sem estalo.`,`Your mechanical arm tears off all three boards in one pull, without a crack.`,`El brazo mecánico arranca las tres tablas de un solo tirón, sin un crujido.`)),go:'a7_aranha_pre'}),
      fail:()=>{S.flags.ruido=(S.flags.ruido||0)+1;return {text:P(L(`A última tábua quebra com um estalo seco.`,`The last board snaps with a dry crack.`,`La última tabla se parte con un chasquido seco.`)),go:'a7_aranha_pre'}}},
    {label:L('Soltar prego por prego','Pull the nails one by one','Sacar clavo por clavo'),test:{sk:'Furtividade',dt:12},
      ok:()=>({text:P(L(`Um prego de cada vez. Derick segura as tábuas para não caírem.`,`One nail at a time. Derick holds the boards so they don't fall.`,`Un clavo a la vez. Derick sostiene las tablas para que no caigan.`)),go:'a7_aranha_pre'}),
      fail:()=>{S.flags.ruido=(S.flags.ruido||0)+1;return {text:P(L(`Um prego escapa e quica no chão de metal.`,`A nail slips free and bounces on the metal floor.`,`Un clavo se escapa y rebota en el piso de metal.`)),go:'a7_aranha_pre'}}}
  ]},

a7_aranha_pre:{act:CH7,title:L('Oito patas','Eight legs','Ocho patas'),
  text:()=>P(L(`Do outro lado da janela, não é a sala dos esqueletos. É um galpão. E no meio dele, presa por cabos, uma aranha preta do tamanho de um carro, com um tubo enfiado no abdômen drenando o Lodo dela.

Tudo em você quer correr. Correr como naquela noite. Como o Eros correu.`,
`On the other side of the window, it's not the skeleton room. It's a warehouse. And in the middle of it, held by cables, a black spider the size of a car, with a tube jammed into its abdomen draining its Sludge.

Everything in you wants to run. Run like that night. Like Eros ran.`,
`Del otro lado de la ventana no está la sala de los esqueletos. Es un galpón. Y en el medio, sujeta con cables, una araña negra del tamaño de un auto, con un tubo clavado en el abdomen drenándole el Lodo.

Todo en ti quiere correr. Correr como aquella noche. Como corrió Eros.`))+(S.flags.ruido?P(L(`Oito olhos se abrem, um por um, e se viram para você.`,`Eight eyes open, one by one, and turn toward you.`,`Ocho ojos se abren, uno por uno, y se vuelven hacia ti.`)):P(L(`Ela está dormindo. As patas se contraem de leve, sonhando.`,`It's asleep. Its legs twitch slightly, dreaming.`,`Está dormida. Las patas se contraen levemente, soñando.`))),
  choices:()=>[
    {label:S.flags.ruido?L('Ficar. Lutar.','Stay. Fight.','Quedarte. Pelear.'):L('Deixar Derick preparar o fogo enquanto ela dorme','Let Derick prepare the fire while it sleeps','Dejar que Derick prepare el fuego mientras duerme'),main:true,
      run:()=>({combat:{id:'aracnasita',after:'a7_tiros',allies:['derick'],presenceMod:3,weak:!S.flags.ruido,surprise:!S.flags.ruido,enemyFirst:!!S.flags.ruido,winText:L('A Aracnasita se encolhe, as patas dobrando para dentro, e para de se mexer.','The Arachnasite curls up, legs folding inward, and stops moving.','La Aracnásita se encoge, las patas doblándose hacia adentro, y deja de moverse.')}})}
  ]},

a7_tiros:{act:CH7,title:L('Tiros','Gunfire','Disparos'),
  text:()=>P(L(`Você abre os olhos só quando Derick toca seu ombro. Acabou.

Do outro lado da fábrica, tiros de fuzil. Rajadas longas, disciplinadas. Não é a pistola do Mada.`,
`You only open your eyes when Derick touches your shoulder. It's over.

From the other side of the factory, rifle fire. Long, disciplined bursts. That's not Mada's pistol.`,
`Solo abres los ojos cuando Derick te toca el hombro. Se terminó.

Del otro lado de la fábrica, disparos de fusil. Ráfagas largas, disciplinadas. No es la pistola de Mada.`)),
  choices:()=>[
    {label:L('Seguir o tubo, como planejado','Follow the tube, as planned','Seguir el tubo, como estaba planeado'),main:true,run:()=>({go:'a7_docs'})},
    {label:L('Ir atrás dos tiros','Go after the gunfire','Ir hacia los disparos'),test:{sk:'Percepção',dt:15},
      ok:()=>({text:P(L(`Você chega a ver, por uma janela interna, um homem loiro com um M4. VT? Aqui? Os tiros param. Você volta para o tubo.`,`Through an interior window you catch sight of a blond man with an M4. VT? Here? The shooting stops. You go back to the tube.`,`Por una ventana interior alcanzas a ver a un hombre rubio con un M4. ¿VT? ¿Aquí? Los disparos cesan. Vuelves al tubo.`)),go:'a7_docs'}),
      fail:()=>({text:P(L(`O eco confunde tudo. Os tiros param antes de vocês acharem a origem. Tempo perdido.`,`The echo confuses everything. The shooting stops before you find the source. Time wasted.`,`El eco lo confunde todo. Los disparos cesan antes de encontrar el origen. Tiempo perdido.`))+loseSan('1d2',L('a espera','the waiting','la espera')),go:'a7_docs'})}
  ]},

a7_docs:{act:CH7,title:L('O subsolo','The sub-basement','El subsuelo'),
  text:()=>P(L(`O tubo desce até um subsolo com mesas de metal e arquivos de aço. Papéis por toda parte.`,`The tube runs down into a sub-basement with metal tables and steel filing cabinets. Papers everywhere.`,`El tubo baja hasta un subsuelo con mesas de metal y archivadores de acero. Papeles por todas partes.`)),
  choices:()=>[
    {once:'docs',label:L('Ler os documentos com calma','Read the documents carefully','Leer los documentos con calma'),test:{sk:'Investigação',dt:14},
      ok:()=>({text:P(L(`Você lê tudo. E cada folha tira um pedaço do chão debaixo dos seus pés. No fundo da pasta, uma foto: seu pai, sorridente, ao lado de uma Aline jovem, sem nenhuma cicatriz.`,`You read everything. And every page pulls another piece of ground out from under your feet. At the bottom of the folder, a photo: your father, smiling, next to a young Aline without a single scar.`,`Lo lees todo. Y cada hoja te quita un pedazo de suelo bajo los pies. Al fondo de la carpeta, una foto: tu padre, sonriente, junto a una Aline joven, sin ninguna cicatriz.`))+addClue('ficha_ataque')+addClue('frederick')+loseSan('1d4',L('seu pai','your father','tu padre'))}),
      fail:()=>({text:P(L(`Você só consegue ler a primeira ficha antes de Derick apontar a escada.`,`You only manage to read the first file before Derick points at the stairs.`,`Solo alcanzas a leer la primera ficha antes de que Derick señale la escalera.`))+addClue('ficha_ataque')})},
    {label:L('Descer mais','Go further down','Bajar más'),main:true,run:()=>({go:'a7_porta'})}
  ]},

a7_porta:{act:CH7,title:L('A porta reforçada','The reinforced door','La puerta reforzada'),
  text:()=>P(L(`No andar de baixo, os Esqueletos de Lodo estão todos no chão, estilhaçados por tiros. Alguém chegou antes.

No fim do corredor, uma porta de aço com um encaixe no centro, no formato exato de um brasão.`,`On the level below, the Sludge Skeletons are all on the floor, shattered by gunfire. Someone got here first.

At the end of the corridor, a steel door with a slot in the center, in the exact shape of a crest.`,`En el piso de abajo, los Esqueletos de Lodo están todos en el suelo, destrozados a balazos. Alguien llegó antes.

Al final del pasillo, una puerta de acero con un encaje en el centro, con la forma exacta de un escudo.`))+(has('brasao')?P(L(`Você tira do bolso o brasão que pegou na mansão. Encaixa. Ele esquenta na sua mão, como se reconhecesse o seu sangue.`,`You take the crest you picked up at the mansion out of your pocket. It fits. It warms in your hand, as if it recognized your blood.`,`Sacas del bolsillo el escudo que tomaste en la mansión. Encaja. Se calienta en tu mano, como si reconociera tu sangre.`)):P(L(`Você não tem o brasão. Mas a fechadura tem uma agulha. Você fura o dedo. A porta reconhece o sangue Wezen.`,`You don't have the crest. But the lock has a needle. You prick your finger. The door recognizes Wezen blood.`,`No tienes el escudo. Pero la cerradura tiene una aguja. Te pinchas el dedo. La puerta reconoce la sangre Wezen.`))),
  choices:()=>[{label:L('Abrir','Open it','Abrir'),main:true,run:()=>({go:'a7_confronto'})}]},

a7_confronto:{act:CH7,title:L('A cápsula','The capsule','La cápsula'),checkpoint:true,
  text:()=>P(L(`Uma sala enorme, com o teto a vinte metros. No centro, uma cápsula de vidro cheia de Lodo. Dentro dela, desacordado, magro, o olho esquerdo branco: Eros.

Formiga mexe num painel ao lado dela. Na frente dele, uma criatura magra de Lodo, com um crânio humano apodrecido por dentro: um Carniçal. E contra ela, Mada, VT e Kavyur. Kavyur está no chão, sangrando muito.

Formiga te vê. E sorri.`,
`A huge room, the ceiling twenty meters up. In the center, a glass capsule full of Sludge. Inside, unconscious, thin, his left eye white: Eros.

Formiga works a panel beside it. In front of him, a thin Sludge creature with a rotting human skull inside it: a Ghoul. And fighting it, Mada, VT and Kavyur. Kavyur is on the ground, bleeding badly.

Formiga sees you. And smiles.`,
`Una sala enorme, con el techo a veinte metros. En el centro, una cápsula de vidrio llena de Lodo. Adentro, inconsciente, flaco, con el ojo izquierdo blanco: Eros.

Formiga maneja un panel junto a ella. Delante de él, una criatura flaca de Lodo con un cráneo humano podrido por dentro: un Necrófago. Y contra ella, Mada, VT y Kavyur. Kavyur está en el suelo, sangrando mucho.

Formiga te ve. Y sonríe.`)),
  choices:()=>[
    {label:L('Chamá-lo pelo nome verdadeiro','Call him by his real name','Llamarlo por su nombre verdadero'),cond:()=>has('frederick'),
      run:()=>({text:P(L(`"Felipe." Ele congela. Ninguém o chama assim há anos. E então ele conta. Tudo. Os experimentos do seu pai. O Deus da Morte. Aline, contratada para conduzir tudo, que não aguentou e os libertou. O ataque à mansão, disfarçado de coisa paranormal. "Eu queria que ele sobrevivesse. Pra ver." E o Eros, anos depois, batendo na porta deles pedindo ajuda para trazer você de volta. "Foi fácil demais."`,`"Felipe." He freezes. No one has called him that in years. And then he tells you. Everything. Your father's experiments. The God of Death. Aline, hired to run it all, who couldn't stand it and set them free. The attack on the mansion, dressed up as something paranormal. "I wanted him to survive. To watch." And Eros, years later, knocking on their door asking for help to bring you back. "It was too easy."`,`"Felipe." Se congela. Nadie lo llama así desde hace años. Y entonces lo cuenta. Todo. Los experimentos de tu padre. El Dios de la Muerte. Aline, contratada para dirigirlo todo, que no aguantó y los liberó. El ataque a la mansión, disfrazado de algo paranormal. "Quería que él sobreviviera. Para que lo viera." Y Eros, años después, golpeando su puerta para pedir ayuda para traerte de vuelta. "Fue demasiado fácil."`))+addClue('verdade')+loseSan('1d4',L('a verdade','the truth','la verdad')),go:'a7_carnicais'})},
    {label:L('"Solta o meu irmão, Formiga"','"Let my brother go, Formiga"','"Suelta a mi hermano, Formiga"'),
      run:()=>({text:P(L(`Ele ri. "Seu pai começou isso. Eu só estou terminando." Ele não explica mais nada.`,`He laughs. "Your father started this. I'm just finishing it." He doesn't explain anything else.`,`Se ríe. "Tu padre empezó esto. Yo solo lo estoy terminando." No explica nada más.`)),go:'a7_carnicais'})}
  ]},

a7_carnicais:{act:CH7,title:L('Três','Three','Tres'),
  text:()=>P(L(`"Sabe de quem é esse corpo?" Formiga aponta o Carniçal. "Leon. E esses..." Ele aperta dois botões. Das paredes, duas cápsulas se abrem. Mais dois Carniçais: Jon. Roger Jr.

Três. VT grita para recuar. Mada olha para você. Derick olha para você.

Atrás de Formiga, o Lodo começa a borbulhar dentro da cápsula do Eros.`,
`"Know whose body that is?" Formiga points at the Ghoul. "Leon's. And these..." He presses two buttons. Two capsules open in the walls. Two more Ghouls: Jon. Roger Jr.

Three. VT shouts to fall back. Mada looks at you. Derick looks at you.

Behind Formiga, the Sludge starts to bubble inside Eros's capsule.`,
`"¿Sabes de quién es ese cuerpo?" Formiga señala al Necrófago. "De Leon. Y estos..." Aprieta dos botones. En las paredes se abren dos cápsulas. Dos Necrófagos más: Jon. Roger Jr.

Tres. VT grita que retrocedan. Mada te mira. Derick te mira.

Detrás de Formiga, el Lodo empieza a burbujear dentro de la cápsula de Eros.`)),
  choices:()=>[
    {label:L('"Eu não vou abandonar ele de novo."','"I\'m not leaving him again."','"No voy a abandonarlo otra vez."'),main:true,

/* ================= ESTADO ================= */
const SAVE_KEY='succedere-v1';
let S=null;
const draft=()=>({name:'Koranna Wezen',origin:null,cls:'especialista',attr:{AGI:1,FOR:1,INT:1,PRE:1,VIG:1},picks:[],rituals:[],inv:[],autoInv:true,rand:[]});
let D=draft();
let busy=false;
function clone(o){return JSON.parse(JSON.stringify(o))}
function save(){try{if(S&&S.cls)localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function originSkills(o,randList){return o==='amnesico'?(randList||[]):(ORIGINS[o]?ORIGINS[o].skills:[])}

/* ================= DADOS / ROLAGENS ================= */
const d=n=>1+Math.floor(Math.random()*n);
function rollExpr(expr,mult=1,extraDice=0){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr.replace(/\s/g,''));
  const n=(+m[1]+extraDice)*mult, s=+m[2], mod=m[3]?+m[3]:0;
  const rolls=Array.from({length:n},()=>d(s));
  return {total:Math.max(1,rolls.reduce((a,b)=>a+b,0)+mod),rolls,expr:`${n}d${s}${mod?(mod>0?'+':'')+mod:''}`};
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTrained=k=>S.trained.includes(k);
const locked=k=>TRAINED_ONLY.has(k)&&!isTrained(k);
function diceFor(k,mod=0,attr){const a=S.attr[attr||SKILLS[k]]+mod;return a>0?`${a}d20`:`${2-a}d20↓`}
function testLabel(k,dt,extra=0,ctx=[],mod=0,attr){
  if(locked(k))return `${sk(k)}* · <b>${L('somente treinada','trained only','solo entrenada')}</b>`;
  const b=(isTrained(k)?5:0)+gearBonus(k,ctx).b+extra;
  return `${sk(k)} · ${diceFor(k,mod,attr)}${b>0?'+'+b:b<0?b:''}${dt!=null?` · <b>${DTs()} ${dt}</b>`:''}`;
}
function log(t){S.log=S.log||[];S.log.unshift(t);if(S.log.length>40)S.log.pop()}

async function showRoll(r){
  const tray=document.getElementById('tray');tray.hidden=false;
  const diceHtml=r.dice.map((v,i)=>`<span class="die spin${r.enemy?' en':''}" data-i="${i}">?</span>`).join('');
  tray.innerHTML=`<div class="tr-label">${r.label}</div>
    <div class="stamp none" id="stamp"></div>
    <div class="tr-dice">${diceHtml}<span class="tr-sum" id="trsum"></span></div>
    <div class="tr-parts" id="trparts"></div>`;
  const els=[...tray.querySelectorAll('.die')];
  try{tray.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'})}catch(e){}
  if(!reduced()){const t0=Date.now();while(Date.now()-t0<650){els.forEach(e=>e.textContent=d(20));await wait(60)}}
  let keptShown=false;
  els.forEach((e,i)=>{e.classList.remove('spin');e.textContent=r.dice[i];
    const isKept=!keptShown&&r.dice[i]===r.kept;if(isKept)keptShown=true;
    if(!isKept)e.classList.add('drop');else if(!r.enemy){if(r.kept===20)e.classList.add('n20');if(r.kept===1)e.classList.add('n1')}});
  document.getElementById('trsum').innerHTML=`${r.bonus?(r.bonus>0?` + ${r.bonus}`:` − ${-r.bonus}`):''} = <b>${r.total}</b>${r.dt!=null?` <span>vs ${r.enemy?L('Defesa','Defense','Defensa'):DTs()} ${r.dt}</span>`:''}`;
  if(r.parts&&r.parts.length)document.getElementById('trparts').textContent=r.parts.join(' · ');
  const st=document.getElementById('stamp');
  if(r.ok!=null){
    if(r.enemy){st.className='stamp '+(r.ok?'fail':'ok');st.textContent=r.ok?L('ACERTOU','HIT','ACERTÓ'):L('ERROU','MISS','FALLÓ')}
    else if(r.crit&&r.ok){st.className='stamp crit';st.textContent=L('CRÍTICO','CRITICAL','CRÍTICO')}
    else{st.className='stamp '+(r.ok?'ok':'fail');st.textContent=r.ok?L('SUCESSO','SUCCESS','ÉXITO'):L('FALHA','FAILURE','FALLO')}
  }
  await wait(reduced()?120:520);
}
async function test(k,dt,o={}){
  const ak=o.attr||SKILLS[k];const a=S.attr[ak]??1;
  const n=a+(o.diceMod||0),low=n<=0,count=low?2-n:n;
  const dice=Array.from({length:count},()=>d(20));
  const kept=low?Math.min(...dice):Math.max(...dice);
  let bonus=0;const parts=[`${sk(k)} (${ab(ak)} ${a}${o.diceMod?`, ${o.diceMod}d20`:''})`];
  (o.notes||[]).forEach(x=>parts.push(x));
  if(isTrained(k)){bonus+=5;parts.push(L('treinada +5','trained +5','entrenada +5'))}
  const g=gearBonus(k,o.ctx||[]);bonus+=g.b;parts.push(...g.parts);
  if(o.bonus){bonus+=o.bonus;parts.push(`${o.bonusLabel||L('bônus','bonus','bono')} ${o.bonus>0?'+':''}${o.bonus}`)}
  if(S.nextBonus){bonus+=S.nextBonus;parts.push(`${L('preparo','preparation','preparación')} +${S.nextBonus}`);S.nextBonus=0}
  if(S.peritoArmed&&isTrained(k)&&S.pe>=2&&S.cls==='especialista'){
    S.pe-=2;const p=rollExpr(S.power>0?'1d8':'1d6').total;bonus+=p;parts.push(`${CLASSES.especialista.power} +${p} (−2 ${L('PE','EP','PE')})`);S.peritoArmed=false;
  }
  const total=kept+bonus,ok=dt==null?null:total>=dt,crit=o.crit?kept>=o.crit:false;
  const label=o.label||`${L('Teste de','Roll:','Tirada de')} ${sk(k)}`;
  await showRoll({label,dice,kept,bonus,total,dt,ok,crit,parts});
  log(`${label}: [${dice.join(', ')}]${bonus?(bonus>0?'+':'')+bonus:''} = ${total}${dt!=null?` vs ${dt} → ${ok?L('sucesso','success','éxito'):L('falha','failure','fallo')}`:''}`);
  renderSheet();
  return {total,ok,crit,kept};
}

/* ================= EFEITOS ================= */
const SANw=()=>L('Sanidade','Sanity','Cordura');
function addClue(id){if(!S.clues.includes(id)){S.clues.push(id);return `<p class="gain">✦ ${L('Pista obtida','Clue found','Pista obtenida')}: ${CLUES[id].t}</p>`}return ''}
function loseSan(expr,src){const r=rollExpr(expr);S.san=Math.max(0,S.san-r.total);log(`${src}: −${r.total} SAN (${r.expr})`);return `<p class="loss">− ${r.total} ${SANw()} (${src})</p>`}
function losePv(expr,src){const r=rollExpr(expr);S.pv=Math.max(0,S.pv-r.total);log(`${src}: −${r.total} ${PV()}`);return `<p class="loss">− ${r.total} ${PV()} (${src})</p>`}
function healPv(n){const b=S.pv;S.pv=Math.min(S.pvMax,S.pv+n);return S.pv-b}
function calm(n){const b=S.san;S.san=Math.min(S.sanMax,S.san+n);return S.san>b?`<p class="gain">+${S.san-b} ${SANw()}</p>`:''}
function defense(){return 10+S.attr.AGI+curArmor().def}
function ritualDT(){return 10+S.attr.PRE+(isTrained('Ocultismo')?5:0)}
const fl=k=>!!S.flags[k];
const has=c=>S.clues.includes(c);
function setCheckpoint(){const c=clone(S);delete c.checkpoint;c.log=[];S.checkpoint=c}
function recalcMax(){
  const c=CLASSES[S.cls],st=(S.nex-5)/5;
  S.pvMax=c.pv[0]+S.attr.VIG+st*(c.pv[1]+S.attr.VIG);
  S.peMax=c.pe[0]+S.attr.PRE+st*(c.pe[1]+S.attr.PRE);
  S.sanMax=c.san[0]+st*c.san[1];
}
const P=s=>s.split('\n\n').map(p=>p.startsWith('RADIO:')?`<p class="radio"><b>${p.slice(6,p.indexOf('|'))}</b>${p.slice(p.indexOf('|')+1)}</p>`:`<p>${p}</p>`).join('');
const tm=id=>S.team&&S.team.includes(id);
const teamNames=()=>S.team.map(i=>TEAM[i].name.split(' ')[0]);
function bond(k,n=1){S.bond[k]=(S.bond[k]||0)+n;return `<p class="gain">◆ ${L('Vínculo com','Bond with','Vínculo con')} ${BOND_NAME[k]} ${n>0?'+':''}${n}</p>`}
function susp(who,why){if(S.susp[who])return '';S.susp[who]=why||true;return `<p class="loss">▲ ${L('Suspeita anotada','Suspicion noted','Sospecha anotada')}: ${TEAM[who].name}</p>`}
function hintTraitor(){
  const t=S.team.filter(x=>ALLIES[x].traitor&&!S.susp[x]);
  if(!t.length)return P(L('Você observa cada um. Nada fora do lugar. Ou todo mundo aqui é muito bom em esconder.','You watch each of them. Nothing out of place. Or everyone here is very good at hiding.','Observas a cada uno. Nada fuera de lugar. O todos aquí son muy buenos escondiendo.'));
  const who=t[d(t.length)-1];const h=TRAITOR_HINTS[who];
  return P(h[d(h.length)-1])+susp(who,L('comportamento','behavior','comportamiento'));
}
function addLoot(id){
  const it=ITEMS[id];const cap=capacity(S.attr.FOR,S.inv),used=spacesUsed(S.inv);
  if(used+it.sp>cap)return `<p class="loss">${L('Sem espaço na mochila para','No room in your backpack for','Sin espacio en la mochila para')} ${it.name}.</p>`;
  S.inv.push(newInst(id));return `<p class="gain">+ ${it.name}</p>`;
}

/* ================= RENDER ================= */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const $=id=>document.getElementById(id);
function applyInsanity(){const v=S&&S.cls&&S.sanMax?Math.max(0,1-S.san/S.sanMax):0;document.documentElement.style.setProperty('--insan',(v*v).toFixed(3))}
function whispers(html){
  if(!S.cls||S.san/S.sanMax>.3)return html;
  const w=L(['VOCÊ SAIU DE CASA','ELE TE DEIXOU','OITO PATAS','A CULPA É SUA','SKART'],['YOU LEFT THE HOUSE','HE LEFT YOU','EIGHT LEGS','IT\'S YOUR FAULT','SKART'],['SALISTE DE CASA','TE DEJÓ','OCHO PATAS','ES TU CULPA','SKART']);
  return html.replace(/<\/p>/,`</p><span class="whisper">${w[d(w.length)-1]}</span>`);
}
function renderMini(){const m=$('mini');if(!S||!S.cls||!S.inv){m.innerHTML='';return}
  m.innerHTML=`<span style="color:var(--pv)">${PV()} <b>${S.pv}</b></span><span style="color:var(--pe)">${L('PE','EP','PE')} <b>${S.pe}</b></span><span style="color:var(--san)">SAN <b>${S.san}</b></span>`}
function meter(cls,l,v,max){return `<div class="meter ${cls}"><span class="l">${l}</span><span class="bar"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></span><span class="v">${v}/${max}</span></div>`}
function renderChrome(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':LANG;
  $('sheetBtn').textContent=L('Ficha','Sheet','Ficha');$('menuBtn').textContent=L('Menu','Menu','Menú');
  const sm=document.querySelector('.brand small');if(sm)sm.textContent=L('Ordo Realitas · história de fã','Ordo Realitas · fan story','Ordo Realitas · historia de fan');
  const ls=$('langSel');if(ls&&ls.value!==LANG)ls.value=LANG;
}
function renderSheet(){
  renderMini();applyInsanity();
  const sh=$('sheet');
  const inGame=S&&S.cls&&S.inv&&!['title','create'].includes(S.screen);
  $('layout').classList.toggle('nosheet',!inGame);
  if(!inGame){sh.innerHTML='';return}
  const c=CLASSES[S.cls],w=equipped(),st=wStats(w),ar=curArmor();
  const canAct=!busy&&S.screen==='game';
  const cap=capacity(S.attr.FOR,S.inv),used=spacesUsed(S.inv);
  const add=st.addAttr&&S.attr[st.addAttr]?'+'+S.attr[st.addAttr]:'';
  const noProf=L('sem prof.','non-prof.','sin comp.');
  sh.innerHTML=`
  <h2 class="sh-name">${esc(S.name)}</h2>
  <div class="sh-sub">${c.name} · ${ORIGINS[S.origin]?.name??S.origin}</div>

function dFixed(){const s=new Set();CLASSES[D.cls].fixed.forEach(x=>s.add(x));if(D.origin)originSkills(D.origin,D.rand).forEach(x=>s.add(x));return s}
function dPickCount(){const c=CLASSES[D.cls];let overlap=0;if(D.origin)originSkills(D.origin,D.rand).forEach(x=>{if(c.fixed.includes(x))overlap++});return c.extra+D.attr.INT+overlap}
function dStats(){const c=CLASSES[D.cls];return {pv:c.pv[0]+D.attr.VIG,pe:c.pe[0]+D.attr.PRE,san:c.san[0],def:10+D.attr.AGI}}
function dProblems(){
  const p=[];const pts=dPoints(),pc=dPickCount();

}

/* ---------- equipamento / arsenal / equipe ---------- */
function gearProblems(inv,FOR){
  const p=[];const cap=capacity(FOR,inv),used=spacesUsed(inv);
  if(used>cap)p.push(L(`carga acima do limite (${used}/${cap})`,`over the load limit (${used}/${cap})`,`carga por encima del límite (${used}/${cap})`));
  Object.entries(PATENTE.lim).forEach(([c,l])=>{const n=catCount(inv,+c);if(n>l)p.push(L(`itens de categoria ${CAT[c]} demais (${n}/${l})`,`too many category ${CAT[c]} items (${n}/${l})`,`demasiados objetos de categoría ${CAT[c]} (${n}/${l})`))});
  if(inv.some(i=>itemCat(i)>PATENTE.maxCat))p.push(L(`há item acima da categoria ${CAT[PATENTE.maxCat]}`,`an item is above category ${CAT[PATENTE.maxCat]}`,`hay un objeto por encima de la categoría ${CAT[PATENTE.maxCat]}`));
  if(inv.filter(i=>ITEMS[i.id].kind==='protecao'&&!ITEMS[i.id].shield).length>1)p.push(L('só dá para vestir uma proteção','you can only wear one armor','solo puedes usar una protección'));
  if(inv.filter(i=>i.id==='escudo').length>1)p.push(L('só um escudo','only one shield','solo un escudo'));
  return p;
}
function gearWarnings(inv,cls){
  const w=[];const p=PROF[cls]||{};
  inv.forEach(i=>{const it=ITEMS[i.id];
    if(it.prof==='tatica'&&it.kind==='arma'&&!p.tatica)w.push(L(`${it.name}: sem proficiência em armas táticas (−2d20 no ataque).`,`${it.name}: not proficient with tactical weapons (−2d20 to attack).`,`${it.name}: sin competencia en armas tácticas (−2d20 al ataque).`));
    if(it.kind==='protecao'&&!(i.id==='leve'&&p.leve))w.push(L(`${it.name}: sem proficiência (−1d20 nos ataques e −5 em perícias com carga).`,`${it.name}: not proficient (−1d20 to attacks and −5 to load skills).`,`${it.name}: sin competencia (−1d20 a los ataques y −5 en pericias con carga).`));
    if(it.ammo&&!inv.some(x=>x.id===it.ammo))w.push(L(`${it.name}: sem munição (${ITEMS[it.ammo].name}).`,`${it.name}: no ammo (${ITEMS[it.ammo].name}).`,`${it.name}: sin munición (${ITEMS[it.ammo].name}).`));
  });
  if(!inv.some(i=>ITEMS[i.id].dmg))w.push(L('Nenhuma arma: você vai lutar com o braço mecânico (1d6).','No weapon: you\'ll fight with your mechanical arm (1d6).','Ningún arma: vas a pelear con el brazo mecánico (1d6).'));
  return [...new Set(w)];
}

      return `${sub}<div class="gi"><div class="gi-t"><b>${it.name}</b> <span class="cat c${it.cat}">${CAT[it.cat]}</span> <small>${it.sp} ${esp}${itemStats(it)?' · '+itemStats(it):''}${noProf?' · <em>'+L('sem proficiência','not proficient','sin competencia')+'</em>':''}</small><p>${it.desc||''}</p></div><button class="sbtn add" data-a="g-add" data-id="${k}" ${w?'disabled':''}>${w||L('Adicionar','Add','Agregar')}</button></div>`}).join('')}</details>`}).join('');

   <div class="gear-head"><span>${L('Espaços','Spaces','Espacios')} <b class="${used>cap?'bad':''}">${used}/${cap}</b></span>${Object.entries(PATENTE.lim).map(([c,l])=>{const n=catCount(inv,+c);return `<span>${L('Categoria','Category','Categoría')} ${CAT[c]} <b class="${n>l?'bad':''}">${n}/${l}</b></span>`}).join('')}<span>${L('Deslocamento','Movement','Desplazamiento')} <b>9 m</b></span>
   <span class="sp"></span><button class="sbtn" data-a="g-suggest">${L('Kit sugerido','Suggested kit','Kit sugerido')}</button><button class="sbtn" data-a="g-clear" ${inv.length?'':'disabled'}>${L('Esvaziar','Clear','Vaciar')}</button></div>
   ${probs.length?`<div class="warn">${probs.join(' · ')}</div>`:''}

async function choose(i){
  if(busy)return;
  const ch=sceneChoices()[i];if(!ch||(ch.test&&locked(ch.test.sk)))return;
  const inputVal=ch.input?(($('sc-in')||{}).value||''):null;
  busy=true;render();
  let res,cls='';
  if(ch.input){res=ch.run(inputVal)}
  else if(ch.test){
    const b=typeof ch.test.bonus==='function'?ch.test.bonus():(ch.test.bonus||0);
    const r=await test(ch.test.sk,ch.test.dt,{bonus:b,bonusLabel:ch.test.bonusLabel,ctx:ch.test.ctx});
    res=r.ok?ch.ok(r):(ch.fail?ch.fail(r):{text:''});cls=r.ok?'ok':'fail';
    if(ch.once&&(r.ok||!ch.retry))S.done[ch.once]=true;
  }else{res=ch.run();if(ch.once)S.done[ch.once]=true}
  busy=false;
  S.outcome=res.text||null;S.outcomeCls=cls;
  if(checkDown())return;
  if(res.team){S.screen='team';S.teamSel=[];save();render();window.scrollTo(0,0);return}
  if(res.arsenal){startArsenal(res.arsenal);return}
  if(res.end){S.screen='end';clearSave();render();window.scrollTo(0,0);return}
  if(res.combat){await startCombat(res.combat);return}
  if(res.levelup){startLevel(res.levelup);return}
  if(res.go){S.scene=res.go;if(SCENES[res.go].checkpoint)setCheckpoint();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})}
  save();render();
}
function checkDown(){
  if(S.pv<=0||S.san<=0){S.downReason=S.pv<=0?'pv':'san';S.screen='down';busy=false;render();window.scrollTo(0,0);return true}
  return false;
}

function cline(t,cls=''){S.combat.lines.push({t,cls});if(S.combat.lines.length>10)S.combat.lines.shift();render()}
const strip=h=>h.replace(/<[^>]+>/g,'').trim();
function effDef(){const C=S.combat;return C.e.def-(C.cond.bloq>0?2:0)}
function ammoPack(type){return S.inv.find(i=>i.id===type&&i.cenas>0)}
function ammoReady(type){return !!(S.combat.ammo[type]||ammoPack(type))}
function ensureAmmo(type){
  const C=S.combat;if(C.ammo[type])return C.ammo[type];
  const p=ammoPack(type);if(!p)return null;
  if(p.cenas<99)p.cenas--;

  if(p.cenas<=0){S.inv=S.inv.filter(i=>i!==p);cline(L(`Você abre o último pacote de ${ITEMS[type].name.toLowerCase()}.`,`You open your last pack of ${ITEMS[type].name.toLowerCase()}.`,`Abres tu último paquete de ${ITEMS[type].name.toLowerCase()}.`))}
  return C.ammo[type];
}

    if(r.ok)cline(L('Você encara a criatura sem desviar os olhos. Sua mente aguenta.','You stare the creature down without looking away. Your mind holds.','Miras a la criatura sin apartar los ojos. Tu mente aguanta.'),'good');
    else cline(L('A simples existência dela machuca sua mente. ','Its mere existence wounds your mind. ','Su sola existencia te lastima la mente. ')+strip(loseSan(e.presence.san,L('Presença Perturbadora','Disturbing Presence','Presencia Perturbadora'))),'hit');

function usableDesc(i){

async function enemyResist(label,dt){
  const e=S.combat.e;const x=d(20),tot=x+e.res,res=tot>=dt;
  await showRoll({label:`${label} · ${L('o alvo tenta resistir','the target tries to resist','el objetivo intenta resistir')}`,dice:[x],kept:x,bonus:e.res,total:tot,dt,ok:!res,parts:[res?L('O alvo resistiu','The target resisted','El objetivo resistió'):L('O alvo não resistiu','The target failed to resist','El objetivo no resistió')]});
  return res;
}
function hurt(n,type='fisico'){
  const C=S.combat,e=C.e;const fire=type==='fogo'||type==='energia';
  if(e.immune&&!fire&&!(C.cond.exposed>0))return 0;
  if(fire&&e.immune)C.cond.exposed=2;
  if(fire&&e.weakFire)n*=2;
  e.pv-=n;return n;
}
const absorbed=(n)=>n===0&&S.combat.e.immune?L(' (o Lodo absorve tudo)',' (the Sludge absorbs it all)',' (el Lodo lo absorbe todo)'):'';

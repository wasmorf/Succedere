<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Succedere</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --void:#08060d;
    --panel:#120c1e;
    --panel-raised:#1c1430;
    --line:#2a2043;
    --line-soft:#1e1730;
    --violet:#8b5cf6;
    --violet-bright:#c9aefb;
    --violet-deep:#4c2f8c;
    --text:#efe9fb;
    --text-dim:#a99cc9;
    --text-faint:#6a5c85;
    --rose:#d9527e;
    --font-display:'Cinzel', Georgia, serif;
    --font-body:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    padding-inline:16px;
  }
  ::selection{background:var(--violet-deep);color:#fff;}

  a{color:var(--violet-bright);}

  .veil{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(139,92,246,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 100%, rgba(217,82,126,.08), transparent 55%);
  }

  #app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-block:24px 64px;min-height:100%;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg, rgba(28,20,48,.92), rgba(18,12,30,.92));
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    margin-bottom:18px;
  }
  .topbar-left{
    display:flex;align-items:center;gap:10px;min-width:0;
    background:transparent;border:none;padding:0;margin:0;cursor:pointer;text-align:left;font:inherit;color:inherit;
    border-radius:8px;
  }
  .topbar-left:hover .topbar-title{color:var(--violet-bright);}
  .topbar-left:hover .sigil{color:var(--violet-bright);}
  .topbar-left:focus-visible{outline:2px solid var(--violet);outline-offset:3px;}
  .topbar-left span{display:flex;flex-direction:column;min-width:0;}
  .topbar .sigil{width:26px;height:26px;flex:none;color:var(--violet-bright);}
  .logo-img{object-fit:contain;display:block;}
  .hero-sigil img, .ending .sigil img{width:100%;height:100%;object-fit:contain;display:block;}
  .topbar-title{font-family:var(--font-display);font-size:.85rem;letter-spacing:.09em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s;}
  .topbar-sub{font-family:var(--font-mono);font-size:.65rem;color:var(--text-faint);letter-spacing:.06em;white-space:nowrap;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex:none;}
  .chip-act{
    font-family:var(--font-mono);font-size:.65rem;letter-spacing:.08em;color:var(--violet-bright);
    border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap;
    background:rgba(139,92,246,.08);
  }
  .icon-btn{
    background:transparent;border:1px solid var(--line);color:var(--text-faint);
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;
    transition:border-color .15s,color .15s;flex:none;
  }
  .icon-btn:hover{color:var(--rose);border-color:var(--rose);}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;}
  .icon-btn:disabled:hover{color:var(--text-faint);border-color:var(--line);}
  .icon-btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}

  /* ---------- Party HUD ---------- */
  .party{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .party-chip{
    display:flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--panel);
    padding:5px 10px 5px 6px;border-radius:999px;
  }
  .party-badge{
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
    font-family:var(--font-mono);font-size:.6rem;font-weight:600;color:var(--void);
    background:var(--role-color, var(--violet));flex:none;
  }
  .party-name{font-size:.72rem;color:var(--text-dim);font-weight:600;white-space:nowrap;}

  /* ---------- Scene panel ---------- */
  .scene{
    position:relative;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:18px;
    padding:26px 24px;
    overflow:hidden;
  }
  .scene::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--violet),var(--rose));
  }
  .scene-eyebrow{
    font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--violet-bright);margin:0 0 6px;
  }
  .scene-title{
    font-family:var(--font-display);font-size:1.3rem;font-weight:600;letter-spacing:.01em;
    margin:0 0 14px;text-wrap:balance;color:var(--text);
  }
  .scene-body p{
    margin:0 0 13px;font-size:1rem;line-height:1.65;color:var(--text);
    max-width:64ch;
    opacity:0;transform:translateY(6px);
    animation:rise .5s ease forwards;
  }
  .scene-body p:last-child{margin-bottom:0;}
  @keyframes rise{to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){
    .scene-body p{animation:none;opacity:1;transform:none;}
  }

  .speaker{color:var(--violet-bright);font-weight:700;}

  /* ---------- Choices ---------- */
  .choices{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
  .choice-btn{
    display:flex;align-items:center;gap:10px;
    width:100%;text-align:left;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--font-body);font-size:.94rem;font-weight:600;
    padding:13px 16px;border-radius:12px;cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s;
  }
  .choice-btn:hover{border-color:var(--violet);background:#241a3d;}
  .choice-btn:active{transform:scale(.99);}
  .choice-btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  .choice-btn .arrow{color:var(--violet-bright);flex:none;font-family:var(--font-mono);}
  .choice-btn.danger .arrow{color:var(--rose);}
  .choice-btn small{display:block;font-weight:500;color:var(--text-faint);font-size:.76rem;margin-top:2px;}

  .continue-row{margin-top:20px;}
  .continue-row .choice-btn{justify-content:space-between;}

  /* ---------- Interactive widgets ---------- */
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px;}
  .agent-card{
    border:1px solid var(--line);background:var(--panel-raised);border-radius:12px;
    padding:12px;cursor:pointer;transition:border-color .15s,background .15s;
    display:flex;flex-direction:column;gap:6px;
  }
  .agent-card:hover{border-color:var(--violet-deep);}
  .agent-card.selected{border-color:var(--violet);background:#241a3d;box-shadow:0 0 0 1px var(--violet) inset;}
  .agent-card .role{
    font-family:var(--font-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--role-color,var(--violet-bright));
  }
  .agent-card .aname{font-weight:700;font-size:.95rem;}
  .agent-card .tag{font-size:.74rem;color:var(--text-faint);line-height:1.4;}
  .selection-status{
    display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;
    font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim);
  }
  .confirm-btn{
    background:var(--violet);color:#0c0714;border:none;border-radius:10px;
    padding:10px 18px;font-family:var(--font-body);font-weight:800;font-size:.86rem;cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  .confirm-btn:disabled{opacity:.35;cursor:not-allowed;}
  .confirm-btn:not(:disabled):hover{background:var(--violet-bright);}

  .order-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:34px;}
  .order-pill{
    font-family:var(--font-mono);font-size:.72rem;border:1px solid var(--violet-deep);
    background:rgba(139,92,246,.12);color:var(--violet-bright);padding:5px 10px;border-radius:999px;
  }

  .puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
  .puzzle-spot{
    border:1px solid var(--line);background:var(--panel-raised);border-radius:12px;
    padding:18px 10px;text-align:center;cursor:pointer;font-family:var(--font-mono);
    font-size:.8rem;color:var(--text-dim);transition:border-color .15s,background .15s;
  }
  .puzzle-spot:hover{border-color:var(--violet);}
  .puzzle-meta{font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint);margin-top:12px;}
  .puzzle-feedback{font-size:.85rem;margin-top:10px;min-height:1.3em;color:var(--rose);}

  /* ---------- Combat ---------- */
  .combat{margin-top:16px;}
  .combat-sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .combat-side{border:1px solid var(--line);background:var(--panel-raised);border-radius:12px;padding:12px;}
  .combat-side .cname{font-weight:700;font-size:.88rem;margin-bottom:6px;}
  .combat-side.enemy .cname{color:var(--rose);}
  .combat-side.party .cname{color:var(--violet-bright);}
  .hp-track{width:100%;height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden;}
  .hp-fill{height:100%;border-radius:999px;transition:width .35s ease;}
  .combat-side.enemy .hp-fill{background:linear-gradient(90deg,var(--rose),#f28ba8);}
  .combat-side.party .hp-fill{background:linear-gradient(90deg,var(--violet),var(--violet-bright));}
  .hp-label{font-family:var(--font-mono);font-size:.64rem;color:var(--text-faint);margin-top:5px;}
  .combat-log{
    margin-top:12px;border:1px solid var(--line-soft);border-radius:12px;background:rgba(0,0,0,.25);
    padding:10px 12px;max-height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;
  }
  .combat-log p{margin:0;font-size:.82rem;line-height:1.4;color:var(--text-dim);}
  .combat-log p:last-child{color:var(--text);}
  .combat-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;}
  .combat-actions .choice-btn{flex:1 1 150px;width:auto;}
  .combat-actions .choice-btn:disabled{opacity:.4;cursor:not-allowed;}

  .stealth-row{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
  .stealth-step-label{font-family:var(--font-mono);font-size:.68rem;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;}

  /* ---------- Progress dots ---------- */
  .progress{display:flex;gap:5px;margin-top:16px;}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--line);}
  .dot.done{background:var(--violet);}

  /* ---------- Title screen ---------- */
  .titlescreen{
    min-height:calc(100vh - 40px);
    min-height:calc(100dvh - 40px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:20px;padding-block:40px;
  }
  .hero-sigil{width:min(56vw,240px);height:min(56vw,240px);color:var(--violet);filter:drop-shadow(0 0 34px rgba(139,92,246,.5));}
  .titlescreen h1{
    font-family:var(--font-display);font-weight:700;font-size:clamp(2.1rem,8vw,3.4rem);
    letter-spacing:.03em;margin:0;text-wrap:balance;
    background:linear-gradient(180deg,#fff,var(--violet-bright));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .titlescreen .kicker{
    font-family:var(--font-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--violet-bright);font-weight:600;
  }
  .titlescreen .tagline{color:var(--text);max-width:46ch;font-size:1.05rem;line-height:1.7;font-weight:500;}
  .title-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:8px;}
  .primary-btn{
    background:var(--violet);color:#0c0714;border:none;border-radius:12px;
    padding:14px 20px;font-family:var(--font-body);font-weight:800;font-size:.98rem;cursor:pointer;
    transition:background .15s,transform .1s;
  }
  .primary-btn:hover{background:var(--violet-bright);}
  .primary-btn:active{transform:scale(.99);}
  .ghost-btn{
    background:transparent;color:var(--text-dim);border:1px solid var(--line);border-radius:12px;
    padding:13px 20px;font-family:var(--font-body);font-weight:700;font-size:.9rem;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .ghost-btn:hover{border-color:var(--violet);color:var(--text);}
  .disclaimer{
    margin-top:26px;max-width:48ch;font-size:.8rem;line-height:1.65;color:var(--text-dim);
    border-top:1px solid var(--line-soft);padding-top:16px;
  }
  .social-link{
    display:inline-flex;align-items:center;gap:7px;margin-top:4px;
    color:var(--text-dim);text-decoration:none;font-family:var(--font-mono);font-size:.78rem;
    border:1px solid var(--line);padding:7px 14px;border-radius:999px;
    transition:border-color .15s,color .15s,background .15s;
  }
  .social-link:hover{border-color:var(--violet);color:var(--text);background:rgba(139,92,246,.08);}

  /* ---------- Ending screen ---------- */
  .ending{
    text-align:center;padding-block:50px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .ending .sigil{width:70px;height:70px;color:var(--rose);}
  .ending h2{font-family:var(--font-display);font-size:1.6rem;color:var(--text);margin:0;}
  .ending .kicker{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--violet-bright);}

  @media (max-width:480px){
    .agent-grid{grid-template-columns:repeat(2,1fr);}
    .puzzle-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>

  /* ============================ RENDER ENGINE ============================ */

  var appEl = document.getElementById('app');
  var TOTAL_STEPS_ACT1 = 30, TOTAL_STEPS_ACT2 = 32;
  var ORDER_ACT1 = [], ORDER_ACT2 = [];
  (function buildOrder(){
    for (var k in story){ if (story[k].act===1) ORDER_ACT1.push(k); else if (story[k].act===2) ORDER_ACT2.push(k); }
  })();

  function save(){
    try{ localStorage.setItem('succedere_save', JSON.stringify(state)); }catch(e){}
  }
  function loadSave(){
    try{
      var raw = localStorage.getItem('succedere_save');
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function clearSave(){
    try{ localStorage.removeItem('succedere_save'); }catch(e){}
  }

  function resetState(){
    state = {
      node:'s_intro', agents:[], parasiteOrder:[], parasiteHost:null,
      puzzleTries:0, puzzleAlarm:null, noise:0, talked:{},
      interrogation:null, escapeTalk:null, finalChoice:null,
      combat:null, history:[],
      _tmpAgentPick:[]
    };
  }

  function scrollTop(){
    try{ window.scrollTo({top:0, left:0, behavior:'smooth'}); }
    catch(e){ try{ window.scrollTo(0,0); }catch(e2){} }
  }

  function navigate(id){
    if (!state.history) state.history = [];
    if (state.node && state.node !== 'title' && state.node !== id) state.history.push(state.node);
    state.node = id;
    save();
    render();
    scrollTop();
  }

  function goBack(){
    if (!state.history || !state.history.length) return;
    state.node = state.history.pop();
    state.combat = null;
    save();
    render();
    scrollTop();
  }

  function render(){
    appEl.innerHTML = '';
    if (state.node === 'title'){ renderTitle(); return; }
    var node = story[state.node];
    if (!node){ renderTitle(); return; }

    appEl.appendChild(topBar(node));
    if (state.node !== 's_intro' && node.act) appEl.appendChild(partyHud());

    var scene = document.createElement('div');
    scene.className = 'scene';

    var eyebrow = document.createElement('p');
    eyebrow.className = 'scene-eyebrow';
    eyebrow.textContent = node.eyebrow || '';
    scene.appendChild(eyebrow);

    var title = document.createElement('h1');
    title.className = 'scene-title';
    title.textContent = node.title || '';
    scene.appendChild(title);

    var body = document.createElement('div');
    body.className = 'scene-body';
    var paras = typeof node.body === 'function' ? node.body() : node.body;
    paras.forEach(function(p, i){
      var el = document.createElement('p');
      el.style.animationDelay = (i*0.09)+'s';
      el.innerHTML = p;
      body.appendChild(el);
    });
    scene.appendChild(body);

    appEl.appendChild(scene);

    var interactive = document.createElement('div');
    interactive.className = 'scene';
    interactive.style.marginTop = '14px';
    var hasInteractive = false;

    if (node.type === 'teamselect'){ hasInteractive = true; renderTeamSelect(interactive); }
    else if (node.type === 'parasiteorder'){ hasInteractive = true; renderParasiteOrder(interactive); }
    else if (node.type === 'puzzle'){ hasInteractive = true; renderPuzzle(interactive); }
    else if (node.type === 'restday'){ hasInteractive = true; renderRestDay(interactive); }
    else if (node.type === 'talkbob'){ hasInteractive = true; renderTalkBob(interactive); }
    else if (node.type === 'roadtalk'){ hasInteractive = true; renderRoadTalk(interactive); }
    else if (node.type === 'talkkavyur'){ hasInteractive = true; renderTalkKavyur(interactive); }
    else if (node.type === 'nightchoice'){ hasInteractive = true; renderNightChoice(interactive); }
    else if (node.type === 'stealth'){ hasInteractive = true; renderStealth(interactive, node); }
    else if (node.type === 'combat'){ hasInteractive = true; renderCombat(interactive, node); }

    if (hasInteractive) appEl.appendChild(interactive);

    if (node.choices && node.choices.length){
      var choicesWrap = document.createElement('div');
      choicesWrap.className = 'choices';
      node.choices.forEach(function(c){
        var btn = document.createElement('button');
        btn.className = 'choice-btn' + (c.danger?' danger':'');
        btn.innerHTML = '<span class="arrow">&raquo;</span><span><span>'+c.label+'</span>' + (c.desc?('<small>'+c.desc+'</small>'):'') + '</span>';
        btn.addEventListener('click', function(){
          if (c.restart){ resetState(); clearSave(); navigate('s_intro'); return; }
          navigate(typeof c.next === 'function' ? c.next() : c.next);
        });
        choicesWrap.appendChild(btn);
      });
      appEl.appendChild(choicesWrap);
    }

    if (node.ending){
      var end = document.createElement('div');
      end.className = 'ending';
      end.innerHTML = '<div class="sigil">'+LOGO_IMG+'</div><p class="kicker">Fim de Jogo — Final</p>';
      appEl.insertBefore(end, appEl.firstChild.nextSibling);
    }
  }

  function topBar(node){
    var bar = document.createElement('div');
    bar.className = 'topbar';
    var actLabel = node.act===2 ? 'ATO II' : 'ATO I';
    var idx = node.act===2 ? ORDER_ACT2.indexOf(state.node) : ORDER_ACT1.indexOf(state.node);
    var total = node.act===2 ? ORDER_ACT2.length : ORDER_ACT1.length;
    bar.innerHTML =
      '<button class="topbar-left" id="home-btn" title="Voltar ao início" aria-label="Voltar ao início">'+LOGO_IMG_SIGIL+
        '<span><span class="topbar-title">SUCCEDERE</span><span class="topbar-sub">Ordem Paranormal · fã-fic</span></span>'+
      '</button>'+
      '<div class="topbar-right">'+
        '<span class="chip-act">'+actLabel+'</span>'+
        '<button class="icon-btn" id="restart-btn" title="Reiniciar" aria-label="Reiniciar história">&#8634;</button>'+
      '</div>';
    bar.querySelector('#home-btn').addEventListener('click', function(){
      appEl.innerHTML = '';
      renderTitle();
      scrollTop();
    });
    bar.querySelector('#restart-btn').addEventListener('click', function(){
      if (confirm('Reiniciar a história do zero?')){ resetState(); clearSave(); navigate('s_intro'); }
    });
    return bar;
  }

  function partyHud(){
    var wrap = document.createElement('div');
    wrap.className = 'party';
    var members = [];
    if (state.node !== 's_intro' && state.node !== 's_bar' && state.node !== 's_base_arrival' && state.node !== 's_mada_meet' && state.node !== 's_team_select'){
      members.push({name:'Koranna', role:'Especialista'});
    }
    var n = story[state.node];
    if (n && n.act === 1 && ORDER_ACT1.indexOf(state.node) >= ORDER_ACT1.indexOf('s_equip') && ORDER_ACT1.indexOf(state.node) <= ORDER_ACT1.indexOf('s_combat_aline')){
      agentObjs().forEach(function(a){ members.push(a); });
    }
    if (n && n.act === 1 && ORDER_ACT1.indexOf(state.node) >= ORDER_ACT1.indexOf('s_split_teams')){
      members.push({name:'Mada', role:'Combatente'});
      if (ORDER_ACT1.indexOf(state.node) < ORDER_ACT1.indexOf('s_base_arrival2')) members.push({name:'Derick', role:'Ocultista'});
    }
    if (n && n.act === 2){
      members.push({name:'Mada', role:'Combatente'}, {name:'Derick', role:'Ocultista'});
    }
    if (!members.length) return wrap;
    var seen = {};
    members.forEach(function(m){
      if (seen[m.name]) return; seen[m.name]=true;
      var chip = document.createElement('div');
      chip.className = 'party-chip';
      var color = ROLE_COLOR[m.role] || '#8b5cf6';
      chip.innerHTML = '<span class="party-badge" style="--role-color:'+color+'">'+(ROLE_LETTER[m.role]||'?')+'</span><span class="party-name">'+m.name+'</span>';
      wrap.appendChild(chip);
    });
    return wrap;
  }

  /* ---- team select widget ---- */
  function renderTeamSelect(container){
    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow'; eyebrow.textContent='Agentes Disponíveis';
    container.appendChild(eyebrow);
    var grid = document.createElement('div'); grid.className = 'agent-grid';
    var picked = state._tmpAgentPick || [];
    Object.keys(AGENTS).forEach(function(key){
      var a = AGENTS[key];
      var card = document.createElement('div');
      card.className = 'agent-card' + (picked.indexOf(key)>-1 ? ' selected' : '');
      card.style.setProperty('--role-color', ROLE_COLOR[a.role]);

      navigate(story.s_team_select.afterChoices);

    container.appendChild(status);

  /* ---- parasite order widget ---- */
  function renderParasiteOrder(container){

    container.appendChild(eyebrow);
    var order = state.parasiteOrder;

  /* ---- puzzle widget ---- */
  function renderPuzzle(container){
    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow'; eyebrow.textContent='Tentativa '+(state.puzzleTries+1)+' de 3';
    container.appendChild(eyebrow);
    var grid = document.createElement('div'); grid.className='puzzle-grid';
    var feedback = document.createElement('p'); feedback.className='puzzle-feedback';
    var correct = 1; // fixed correct spot per attempt
    ['A','B','C'].forEach(function(label, idx){
      var spot = document.createElement('div');
      spot.className = 'puzzle-spot';
      spot.textContent = 'Ponto '+label;
      spot.addEventListener('click', function(){
        if (idx === correct){
          state.puzzleAlarm = false;
          navigate('s_basement');
        } else {
          state.puzzleTries++;
          if (state.puzzleTries >= 3){
            state.puzzleAlarm = true;
            navigate('s_basement');
          } else {
            render();
          }
        }
      });
      grid.appendChild(spot);
    });
    container.appendChild(grid);
    container.appendChild(feedback);
    var meta = document.createElement('p'); meta.className='puzzle-meta';
    meta.textContent = 'Compare o desenho na parede com a planta do hospital antes de escolher.';

  /* ---- combat ---- */
  function renderCombat(container, node){
    if (!state.combat || state.combat.id !== state.node){
      state.combat = {
        id: state.node,
        enemyHp: node.enemy.hp,
        enemyMaxHp: node.enemy.hp,
        partyHp: 100,
        partyMaxHp: 100,
        log: ['O combate começa contra ' + node.enemy.name + '.'],
        over: false
      };
    }
    var c = state.combat;
    var roles = node.roles();
    var hasCombatente = roles.indexOf('Combatente') > -1;
    var hasOcultista = roles.indexOf('Ocultista') > -1; // só aparece se um Ocultista de verdade estiver na luta — Koranna é Especialista, nunca conta aqui
    var hasEspecialista = true; // Koranna é Especialista e luta em todo combate

    var wrap = document.createElement('div'); wrap.className = 'combat';

    var sides = document.createElement('div'); sides.className = 'combat-sides';
    var enemyPct = Math.max(0, c.enemyHp / c.enemyMaxHp * 100);
    var partyPct = Math.max(0, c.partyHp / c.partyMaxHp * 100);

    var enemySide = document.createElement('div'); enemySide.className = 'combat-side enemy';
    var enemyHpText = node.forcedLoss ? '?' : (Math.max(0, c.enemyHp) + ' / ' + c.enemyMaxHp);
    enemySide.innerHTML = '<div class="cname">' + node.enemy.name + '</div>' +
      '<div class="hp-track"><div class="hp-fill" style="width:' + (node.forcedLoss ? 100 : enemyPct) + '%"></div></div>' +
      '<div class="hp-label">' + enemyHpText + '</div>';
    sides.appendChild(enemySide);

    var partySide = document.createElement('div'); partySide.className = 'combat-side party';
    partySide.innerHTML = '<div class="cname">Equipe</div>' +
      '<div class="hp-track"><div class="hp-fill" style="width:' + partyPct + '%"></div></div>' +
      '<div class="hp-label">' + Math.max(0, c.partyHp) + ' / ' + c.partyMaxHp + '</div>';
    sides.appendChild(partySide);
    wrap.appendChild(sides);

    var log = document.createElement('div'); log.className = 'combat-log';
    c.log.slice(-6).forEach(function(line){
      var p = document.createElement('p'); p.textContent = line; log.appendChild(p);
    });
    wrap.appendChild(log);

    var actions = document.createElement('div'); actions.className = 'combat-actions';

    function endCheck(){
      if (!node.forcedLoss && c.enemyHp <= 0 && !c.over){
        c.over = true;
        c.log.push(node.enemy.name + ' é derrotado.');
        render();
        setTimeout(function(){ state.combat = null; navigate(node.onWin); }, 900);
        return true;
      }
      if (c.partyHp <= 0 && !c.over){
        c.over = true;
        c.log.push(node.loseText || 'A equipe está no limite, mas segura a posição e vira o combate.');
        render();
        setTimeout(function(){ state.combat = null; navigate(node.onWin); }, 900);
        return true;
      }
      return false;
    }

    function enemyTurn(defended){
      var dmg = Math.round(node.enemy.atkMin + Math.random() * (node.enemy.atkMax - node.enemy.atkMin));
      if (defended) dmg = Math.round(dmg / 2);
      c.partyHp = Math.max(0, c.partyHp - dmg);
      c.log.push(node.enemy.name + ' ataca — ' + dmg + ' de dano.');
    }

    function playerAction(kind){
      if (c.over) return;
      var dmg = 0, msg = '', defended = false;
      if (kind === 'attack'){
        dmg = 8 + Math.floor(Math.random() * 9);
        if (hasCombatente) dmg += 6;
        msg = 'A equipe ataca de frente' + (hasCombatente ? ' com força extra' : '') + ' — ' + dmg + ' de dano.';
      } else if (kind === 'ritual'){
        dmg = 10 + Math.floor(Math.random() * 9);
        if (node.enemy.tag === 'paranormal') dmg += 8;
        msg = 'Um ritual atinge ' + node.enemy.name + (node.enemy.tag === 'paranormal' ? ' com força extra' : '') + ' — ' + dmg + ' de dano.';
      } else if (kind === 'shot'){
        dmg = 10 + Math.floor(Math.random() * 11);
        msg = 'Um tiro certeiro acerta em cheio — ' + dmg + ' de dano.';
      } else if (kind === 'defend'){
        defended = true;
        msg = 'A equipe se protege, pronta para amortecer o próximo golpe.';
      }
      if (dmg > 0) c.enemyHp = Math.max(0, c.enemyHp - dmg);
      c.log.push(msg);
      if (endCheck()) return;
      enemyTurn(defended);
      if (endCheck()) return;
      render();
    }

    function makeBtn(label, kind, show){
      if (!show) return;
      var btn = document.createElement('button');
      btn.className = 'choice-btn'; btn.disabled = c.over;
      btn.innerHTML = '<span class="arrow">&raquo;</span><span>' + label + '</span>';
      btn.addEventListener('click', function(){ playerAction(kind); });
      actions.appendChild(btn);
    }

    makeBtn('Atacar', 'attack', true);
    makeBtn('Ritual (Ocultista)', 'ritual', hasOcultista);
    makeBtn('Tiro certeiro (Personagem com Arma)', 'shot', hasEspecialista);
    makeBtn('Defender', 'defend', true);

    wrap.appendChild(actions);
    container.appendChild(wrap);
  }

  /* ---- rest day / talk widgets (multi-optional then continue) ---- */
  function renderOptionalTalks(container, people, doneKeyPrefix, nextNode){
    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow'; eyebrow.textContent='Conversas opcionais';
    container.appendChild(eyebrow);
    var wrap = document.createElement('div'); wrap.className='choices';
    people.forEach(function(p){
      var talkedKey = doneKeyPrefix+p.key;
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      var done = state.talked[talkedKey];
      btn.innerHTML = '<span class="arrow">'+(done?'&#10003;':'&raquo;')+'</span><span><span>Falar com '+p.name+'</span><small>'+p.desc+'</small></span>';
      if (done) btn.style.opacity = '.55';
      btn.addEventListener('click', function(){
        state.talked[talkedKey] = true;
        showTalkModal(p.name, p.text);
        render();
      });
      wrap.appendChild(btn);
    });
    container.appendChild(wrap);
    var cont = document.createElement('button');
    cont.className = 'confirm-btn';
    cont.style.marginTop = '14px';
    cont.textContent = 'Seguir em frente';
    cont.addEventListener('click', function(){ navigate(nextNode); });
    container.appendChild(cont);
  }

  function showTalkModal(name, text){
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(4,3,8,.75);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;';
    var box = document.createElement('div');
    box.style.cssText = 'max-width:520px;background:var(--panel-raised);border:1px solid var(--line);border-radius:16px;padding:22px;';
    box.innerHTML = '<p class="scene-eyebrow">'+name+'</p><div class="scene-body"><p style="animation:none;opacity:1;">'+text+'</p></div>';
    var closeBtn = document.createElement('button');
    closeBtn.className = 'confirm-btn'; closeBtn.style.marginTop='16px'; closeBtn.textContent='Fechar';
    closeBtn.addEventListener('click', function(){ document.body.removeChild(overlay); });
    box.appendChild(closeBtn);
    overlay.appendChild(box);
    overlay.addEventListener('click', function(e){ if(e.target===overlay) document.body.removeChild(overlay); });
    document.body.appendChild(overlay);
  }

  function renderRestDay(container){
    renderOptionalTalks(container, [
      {key:'thomas', name:'Thomas', desc:'Sobre o resgate e a liderança da Ordem', text:'Thomas fala sobre o resgate da Equipe Bob — e, sem rodeios, sobre a própria ambição: ele quer ser o próximo líder da Ordem quando Roger sair. É um dos mais fortes, braço direito dele.'},
      {key:'derick', name:'Derick', desc:'Um assunto mais leve', text:'Derick puxa assunto sobre a lança que você escolheu, curioso e leve — um respiro raro em meio a tanta coisa pesada.'},
      {key:'mada', name:'Mada', desc:'Sobre o que você está sentindo', text:'Mada pergunta como você está lidando com ter visto seu irmão. Ele se abre um pouco também, contando como perdeu a própria família e como acabou salvando o Derick.'}
    ], 'rest_', story.s_return_base.afterChoices);
  }

  function renderTalkBob(container){
    renderOptionalTalks(container, [
      {key:'ryan', name:'Ryan', desc:'Cuidado — ele está com raiva', text:'Ryan olha para você com raiva e julgamento. "Foda-se aquele filho da puta traidor", ele diz, sem filtro nenhum.'},
      {key:'luna', name:'Luna', desc:'Como o Eros parecia ser', text:'Luna diz que, no início, Eros parecia meio bobinho, ingênuo — parecia ser uma boa pessoa.'},
      {key:'bob', name:'Bob', desc:'O líder da equipe', text:'Bob evita o assunto. "Pergunta pra Luna", ele diz — e se você já perguntou, ele só balança a cabeça: "Não tem mais o que falar."'}
    ], 'bob_', story.s_waiting.afterChoices);
  }

  function renderRoadTalk(container){
    var node = story[state.node];
    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow'; eyebrow.textContent='No carro';
    container.appendChild(eyebrow);
    var wrap = document.createElement('div'); wrap.className='choices';

      if (node.target === 'derick1'){

  function renderTalkKavyur(container){

      showTalkModal('Kavyur', 'Ele conta: estudava o paranormal até se juntar a um grupo tentando criar uma criatura. Deu errado — a criatura matou todos, e estava prestes a matá-lo também quando os irmãos Zart chegaram. Você conta sua própria história em troca, resumida, mas inteira.');

  function renderNightChoice(container){
    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow'; eyebrow.textContent='Sua escolha';

    var wrap = document.createElement('div'); wrap.className='choices';

  /* ---- stealth widget ---- */
  var STEALTH_STEPS = [
    {label:'1º degrau', safe:'Pisar na lateral', risky:'Pisar no centro, mais rápido'},
    {label:'2º degrau', safe:'Transferir o peso aos poucos', risky:'Passar com o peso todo de uma vez'},
    {label:'3º degrau', safe:'Desviar do ponto mais fraco', risky:'Seguir direto, sem checar'}
  ];
  var PLANK_STEPS = [
    {label:'1ª tábua', safe:'Soltar os pregos devagar', risky:'Arrancar de uma vez'},
    {label:'2ª tábua', safe:'Erguer com cuidado pra não bater em nada', risky:'Puxar rápido pro lado'},
    {label:'3ª tábua', safe:'Apoiar no chão sem soltar', risky:'Deixar cair de uma vez'}
  ];
  function renderStealth(container, node){
    if (state.stealthStepNode !== state.node){ state.stealthStepNode = state.node; state.stealthStep = 0; }
    var steps = node.round === 1 ? STEALTH_STEPS : PLANK_STEPS;
    var stepIdx = state.stealthStep || 0;
    var step = steps[stepIdx];

    var eyebrow = document.createElement('p'); eyebrow.className='scene-eyebrow';
    eyebrow.textContent = (node.round===1 ? 'Subindo a escada' : 'Removendo as tábuas') + ' — passo ' + (stepIdx+1) + ' de ' + steps.length;
    container.appendChild(eyebrow);

    var label = document.createElement('p'); label.className='stealth-step-label'; label.textContent = step.label;

    var wrap = document.createElement('div'); wrap.className='stealth-row';
    wrap.appendChild(label);
    var row = document.createElement('div'); row.style.cssText='display:flex;gap:9px;';
    var btnA = document.createElement('button'); btnA.className='choice-btn'; btnA.style.flex='1';
    btnA.innerHTML = '<span class="arrow">&raquo;</span><span>'+step.safe+'</span>';
    var btnB = document.createElement('button'); btnB.className='choice-btn'; btnB.style.flex='1';
    btnB.innerHTML = '<span class="arrow">&raquo;</span><span>'+step.risky+'</span>';
    row.appendChild(btnA); row.appendChild(btnB);
    wrap.appendChild(row);
    container.appendChild(wrap);

    btnA.addEventListener('click', function(){ advanceStealth(node, false); });
    btnB.addEventListener('click', function(){ advanceStealth(node, true); });
  }
  function advanceStealth(node, risky){
    if (risky) state.noise++;
    state.stealthStep = (state.stealthStep || 0) + 1;
    if (state.stealthStep >= 3){
      state.stealthStep = 0;
      if (node.round === 1) navigate('s2_stealth2');
      else navigate('s2_aracnasita_intro');
    } else {
      save();
      render();
    }
  }

  /* ---- title screen ---- */
  function renderTitle(){
    var wrap = document.createElement('div');
    wrap.className = 'titlescreen';
    var hasSave = !!loadSave();
    wrap.innerHTML =
      '<div class="hero-sigil">'+LOGO_IMG+'</div>'+
      '<p class="kicker">Ordem Paranormal</p>'+
      '<h1>Succedere</h1>'+
      '<p class="tagline">Koranna Wezen entra para a Ordo Realitas em busca do irmão que ela achava morto. Suas escolhas decidem o que ela descobre — e o que ela é capaz de fazer com isso.</p>'+
      '<div class="title-actions">'+
        (hasSave ? '<button class="primary-btn" id="continue-btn">Continuar história</button>' : '') +
        '<button class="'+(hasSave?'ghost-btn':'primary-btn')+'" id="new-btn">'+(hasSave?'Começar de novo':'Começar')+'</button>'+
      '</div>'+
      '<a class="social-link" href="https://x.com/wasmorf1" target="_blank" rel="noopener noreferrer" aria-label="Perfil no X">'+
        '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.5 8.6L23.3 22H16.7l-5.2-6.8L5.6 22H2.5l8-9.2L1.5 2h6.8l4.7 6.2L18.9 2Zm-1.2 18h1.7L7.4 4H5.6l12.1 16Z"/></svg>'+
        '<span>@wasmorf1</span>'+
      '</a>'+
      '<p class="disclaimer">Succedere é uma história de fã, não oficial, inspirada no universo de <b>Ordem Paranormal</b>, criado por Rafael "Cellbit" Lange. Sem afiliação com Cellbit, a Jambô Editora ou qualquer produto licenciado de Ordem Paranormal.</p>';

    appEl.appendChild(wrap);

    var newBtn = document.getElementById('new-btn');
    newBtn.addEventListener('click', function(){
      resetState(); clearSave(); navigate('s_intro');
    });
    var contBtn = document.getElementById('continue-btn');
    if (contBtn){
      contBtn.addEventListener('click', function(){
        var s = loadSave();
        if (s){ if (!s.history) s.history = []; s.combat = null; state = s; render(); }
        else { resetState(); navigate('s_intro'); }
      });
    }
  }

  /* ---- init ---- */
  render();

  /* hot reload support */
  try{
    if (window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return state; });
      var boot = function(data){ if (data && data.node){ state = data; if (!state.history) state.history = []; } render(); };
      if (window.claude.hot.ready) window.claude.hot.ready(boot); else boot(window.claude.hot.data || {});
    }
  }catch(e){}

})();

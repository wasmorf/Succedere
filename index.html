function drawScope(){
  const cv=$('scope');if(!cv)return;
  const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  let t=0;
  function frame(){
    if(!document.body.contains(cv))return;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(212,70,61,.85)';ctx.lineWidth=1.4;ctx.beginPath();
    for(let x=0;x<=W;x+=3){
      const burst=Math.exp(-Math.pow((x/W-((t*0.0015)%1.3))*9,2));
      const y=H/2+Math.sin(x*0.05+t*0.05)*3+(Math.random()-.5)*(4+burst*H*.8);
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();t++;
    if(!reduced())requestAnimationFrame(frame);
  }
  frame();
}

function gearProblems(inv,FOR){
  const p=[];const cap=capacity(FOR,inv),used=spacesUsed(inv);
  if(used>cap)p.push(`carga acima do limite (${used}/${cap} espaços)`);
  Object.entries(PATENTE.lim).forEach(([c,l])=>{const n=catCount(inv,+c);if(n>l)p.push(`itens de categoria ${CAT[c]} demais (${n}/${l})`)});
  if(inv.some(i=>itemCat(i)>PATENTE.maxCat))p.push(`há item acima da categoria ${CAT[PATENTE.maxCat]}`);
  if(inv.filter(i=>ITEMS[i.id].kind==='protecao'&&!ITEMS[i.id].shield).length>1)p.push('só dá para vestir uma proteção');
  if(inv.filter(i=>i.id==='escudo').length>1)p.push('só um escudo');
  return p;
}
function gearWarnings(inv,cls){
  const w=[];const p=PROF[cls]||{};
  inv.forEach(i=>{const it=ITEMS[i.id];
    if(it.prof==='tatica'&&it.kind==='arma'&&!p.tatica)w.push(`${it.name}: sem proficiência em armas táticas (−2d20 no ataque).`);
    if(it.kind==='protecao'&&!(i.id==='leve'&&p.leve))w.push(`${it.name}: sem proficiência (−1d20 nos ataques e −5 em perícias com carga).`);
    if(it.ammo&&!inv.some(x=>x.id===it.ammo))w.push(`${it.name}: sem munição (${ITEMS[it.ammo].name}).`);
  });
  if(!inv.some(i=>ITEMS[i.id].dmg))w.push('Nenhuma arma: você vai lutar desarmado (1d3).');
  return [...new Set(w)];
}

async function choose(i){
  if(busy)return;
  const ch=sceneChoices()[i];if(!ch||(ch.test&&locked(ch.test.sk)))return;
  const inputVal=ch.input?(($('sc-in')||{}).value||''):null;
  busy=true;render();
  let res,cls='';
  if(ch.input){res=ch.run(inputVal)}
  else if(ch.test){
    const b=typeof ch.test.bonus==='function'?ch.test.bonus():(ch.test.bonus||0);
    const r=await test(ch.test.sk,ch.test.dt,{bonus:b,bonusLabel:ch.test.bonusLabel,ctx:ch.test.ctx});
    res=r.ok?ch.ok(r):(ch.fail?ch.fail(r):{text:P('Nada.')});cls=r.ok?'ok':'fail';
    if(ch.once&&(r.ok||!ch.retry))S.done[ch.once]=true;
  }else{res=ch.run();if(ch.once)S.done[ch.once]=true}
  busy=false;
  S.outcome=res.text||null;S.outcomeCls=cls;
  if(checkDown())return;
  if(res.team){S.screen='team';S.teamSel=[];save();render();window.scrollTo(0,0);return}
  if(res.arsenal){startArsenal(res.arsenal);return}
  if(res.end){S.screen='end';clearSave();render();window.scrollTo(0,0);return}
  if(res.combat){await startCombat(res.combat);return}
  if(res.levelup){startLevel(res.levelup);return}
  if(res.go){S.scene=res.go;if(SCENES[res.go].checkpoint)setCheckpoint();window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'})}
  save();render();
}

const COND_NAME={atord:'atordoado',ofusc:'ofuscado',cego:'cego',chamas:'em chamas',fumaca:'fumaça',bloq:'sinal bloqueado'};
function cline(t,cls=''){S.combat.lines.push({t,cls});if(S.combat.lines.length>10)S.combat.lines.shift();render()}
function effDef(){const C=S.combat;return C.e.def-(C.cond.bloq>0?2:0)}
function ammoPack(type){return S.inv.find(i=>i.id===type&&i.cenas>0)}
function ammoReady(type){return !!(S.combat.ammo[type]||ammoPack(type))}
function ensureAmmo(type){
  const C=S.combat;if(C.ammo[type])return C.ammo[type];
  const p=ammoPack(type);if(!p)return null;
  if(p.cenas<99)p.cenas--;
  C.ammo[type]={mods:[...p.mods]};
  if(p.cenas<=0){S.inv=S.inv.filter(i=>i!==p);cline(`Você abre o último pacote de ${ITEMS[type].name.toLowerCase()}.`)}
  return C.ammo[type];
}
async function startCombat(o){

  if(o.weak)e.pv=Math.round(e.pv*.7);
  e.pvMax=e.pv;
  S.combat={id:o.id,e,round:1,lines:[],defBuff:0,veu:0,guard:false,obj:(o.id==='ouvinte'&&fl('sab1'))?1:0,after:o.after,revealed:false,
    cond:{atord:0,ofusc:0,cego:0,chamas:0,fumaca:0,bloq:0,exposed:0},ammo:{},mina:false,lant:false,bloqUsed:false,ko:false,
    allies:o.allies||[],allyRate:o.allyRate||1,traitorsHold:!!o.traitorsHold,script:o.script||null,noDeath:!!o.noDeath,winText:o.winText||'',hex:0,fusion:false};
  S.screen='combat';busy=true;render();window.scrollTo(0,0);

  if(e.immune)cline('O Lodo torna a Aracnasita imune a dano. Só fogo ou calor a expõe, até o próximo turno dela.');
  if(S.combat.allies.length)cline(`Ao seu lado: ${S.combat.allies.map(a=>ALLIES[a].name).join(', ')}.`);
  if(e.camo)cline(`${e.name} pisca entre este mundo e o sinal: camuflagem (−1d20 nos seus ataques${hasItem('termico')?', anulada pelos óculos térmicos':''}).`);
  if(e.presence){
    const dt=e.presence.dt+(o.presenceMod>0?o.presenceMod:0);
    const bonus=o.presenceMod<0?-o.presenceMod:0;
    const r=await test('Vontade',dt,{label:'Presença Perturbadora'+(o.id==='aracnasita'?' (aracnofobia +3 DT)':''),bonus,bonusLabel:'preparo'});
    if(r.ok)cline('Você encara a criatura sem desviar os olhos. Sua mente aguenta.','good');
    else{const t=loseSan(e.presence.san,'Presença Perturbadora').replace(/<[^>]+>/g,'');cline(`A simples existência dela machuca sua mente. ${t}`,'hit')}
    if(checkDown())return;
  }
  let first;
  if(o.surprise){first=true;cline('Surpresa! Você age primeiro.','good')}
  else if(o.enemyFirst){first=false;cline('Você foi pego desprevenido.','hit')}
  else{
    const r=await test('Iniciativa',null,{label:'Iniciativa'});
    const er=d(20)+e.init;first=r.total>=er;
    cline(`Iniciativa: você ${r.total} × ${er} ${e.name}. ${first?'Você age primeiro.':'Ele age primeiro.'}`);
  }
  if(!first){const r=await enemyTurn();if(await combatEnd(r==='dead'))return}
  busy=false;render();
}
function usableDesc(i){
  const C=S.combat,e=C.e,dt=itemDT();
  switch(i.id){
    case 'g_atord':return [`atordoa 1 rodada · Fort DT ${dt}`,''];
    case 'g_frag':return [`8d6 · Refl DT ${dt} p/ metade`,''];
    case 'g_fumaca':return ['50% de erro contra você · 2 rodadas',''];
    case 'g_incend':return [`6d6 + em chamas · Refl DT ${dt}`,''];
    case 'mina':return C.mina?['já instalada','x']:locked('Tática')?['exige Tática treinada','x']:['instalar: Tática DT 15',''];
    case 'algemas':return e.human?[`agarrar: Luta DT ${e.pv<=e.pvMax/2?15:20}`,'']:['só funciona em humanos','x'];
    case 'bloqueador':return C.bloqUsed?['já usado neste combate','x']:[e.signal?'−2 Def e sem especial · 3 rodadas':'sem efeito neste alvo',''];
    case 'cicatrizante':return [S.pv>=S.pvMax?'PV cheios':'cura 2d8+2 PV',S.pv>=S.pvMax?'x':''];
    case 'dardos':return [`Pontaria · derruba humanos · ×${i.charges}`,''];
    case 'sinalizadora':return [`Pontaria · 2d6 fogo · ×${i.charges}`,''];
    case 'spray':return e.eyes?[`cega 1d4 rodadas · Fort DT ${dt} · ×${i.charges}`,'']:['o alvo não tem olhos','x'];
    case 'taser':return [`1d6 + atordoa · Fort DT ${dt} · ×${i.charges}`,''];
  }
  return null;
}

async function enemyResist(label,dt){

}
async function doAttack(mode,sp){

  let ammoMods=[];

  if(mode==='fusion'){diceMod-=1;notes.push('mirar no ponto de fusão −1d20')}
  if(C.hex>0){diceMod-=1;notes.push('símbolo hipnótico −1d20');C.hex=0}
  if(!st.prof)notes.push('sem proficiência −2d20');
  if(st.chainsaw)notes.push('motosserra −1d20');
  if(curArmor().nonprof)notes.push('proteção sem proficiência −1d20');
  if(rajada&&!st.comp){diceMod-=1;notes.push('rajada −1d20')}
  const camo=e.camo&&!hasItem('termico')&&!st.thermal;
  if(camo){diceMod-=1;notes.push('camuflagem −1d20')}
  const r=await test(st.skill,effDef(),{label:`${sp?'Ataque Especial':rajada?'Rajada':mode==='fusion'?'Ponto de fusão':'Ataque'} · ${st.name}`,attr:st.attr,diceMod,notes,bonus:st.atk+(sp?5:0),bonusLabel:sp?'arma/especial':'arma',crit:st.margin});
  if(!r.ok){cline(`Você erra ${e.name}.`);return true}
  const mult=r.crit?st.mult+(ammoMods.includes('dumdum')?1:0):1;
  const n=(st.n+st.extraDice+(rajada?1:0))*mult;
  const rolls=Array.from({length:n},()=>d(st.s));
  if(st.chainsaw){let extra=rolls.filter(x=>x===6).length,g=0;while(extra>0&&g<20){const x=d(6);rolls.push(x);extra--;g++;if(x===6)extra++}}
  let dmg=rolls.reduce((a,b)=>a+b,0);
  const add=st.addAttr?S.attr[st.addAttr]:0;dmg+=add+st.dmgB+(sp?5:0);
  let exp=0;if(ammoMods.includes('explosiva')){exp=rollExpr('2d6').total;dmg+=exp}

  log(`Dano: ${dmg} [${rolls.join(',')}]`);
  return true;
}

    else if(rt.type==='buff'){S.nextBonus=5;C.revealed=true;cline(`${rt.name}${extra}: você lê a criatura.${e.el?` Ela é fraca a ${EL_NAME[WEAK[e.el]]}.`:' Não há elemento nela: é só humana.'} (+5 no próximo teste)`,'good')}
  }
  else if(kind==='obj'){

      if(C.obj>=ob.need){S.flags.fim='sabotagem';busy=false;return winCombat()}}
    else cline('O transmissor cospe faíscas. Não foi desta vez.');
  }
  else if(kind==='item')acted=await useItem(arg);

  else if(kind==='guard'){C.guard=true;S.pe=Math.min(S.peMax,S.pe+1);cline('Você recua e se protege, recuperando o fôlego (+5 Defesa, +1 PE).')}
  else if(kind==='scan'){const r=await test(arg,16,{label:'Procurar o ponto fraco'});if(r.ok){C.fusion=true;cline('Você vê: no centro da massa, onde o Lodo é mais novo, o corpo do Eros ainda pulsa quente. Ali o fogo entra. Ali a lança entra.','good')}else cline('É Lodo demais, rosto demais. Você não consegue focar.')}
  else if(kind==='kav'){const r=await test('Atletismo',15,{label:'Puxar Kavyur'});if(r.ok){S.flags.kavyur_salvo=true;C.kav=true;cline('Você agarra Kavyur pela gola e arrasta ele para trás de uma coluna. Ele xinga você de tudo. Mas está longe do fogo.','good')}else cline('Kavyur se solta de você, cego de ódio, e volta para a Besta.')}

    if(r.ok){C.e.pv=0;C.finalDone=true;cline(`Você lembra da mesa de domingo. Do macarrão. Do gato no colo dele. E crava a ${hasItem('lanca')?'lança':'arma'} no ponto exato, com toda a certeza do mundo. A Besta explode em Lodo.`,'good')}

  }

async function enemyTurn(){
  const C=S.combat,e=C.e,cd=C.cond;
  const tick=()=>{if(cd.cego>0)cd.cego--;if(cd.fumaca>0)cd.fumaca--;if(cd.bloq>0)cd.bloq--;if(cd.exposed>0)cd.exposed--;C.defBuff=0;renderSheet()};
  if(cd.chamas>0){const x=hurt(d(6),'fogo');cd.chamas--;cline(`${e.name} queima: −${x} PV.`,'good');if(e.pv<=0){tick();return 'dead'}}
  if(cd.atord>0){cd.atord--;cline(`${e.name} está atordoado e não age.`,'good');tick();return}
  C.defBuff=(C.guard?5:0)+(C.veu>0?5:0);
  const sp=e.special;
  if(sp&&C.round%sp.every===0&&cd.bloq<=0&&sp.kind==='hex'){
    cline(`${sp.name}! ${sp.text} (−1d20 no seu próximo ataque)`,'hit');C.hex=1;
  }else if(sp&&C.round%sp.every===0&&cd.bloq<=0&&sp.kind==='atk'){
    cline(`${sp.name}! ${sp.text}`,'hit');
    const roll=d(20),tot=roll+e.atk+2,def=defense()+C.defBuff;const hit=roll===20||tot>=def;
    await showRoll({label:`${sp.name}`,dice:[roll],kept:roll,bonus:e.atk+2,total:tot,dt:def,ok:hit,enemy:true});
    if(hit){const dmg=Math.max(0,rollExpr(sp.dmg).total-curArmor().rd);S.pv=Math.max(0,S.pv-dmg);cline(`Você é atingida em cheio: −${dmg} PV.`,'hit');const sc=$('screen');sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')}
    else cline('Você se joga para o lado no último instante.','good');
  }else if(sp&&C.round%sp.every===0&&cd.bloq<=0){
    cline(`${sp.name}! ${sp.text}`,'hit');
    const r=await test(sp.skill,sp.dt,{label:sp.name});
    if(r.ok)cline('Você aguenta firme.','good');
    else cline(loseSan(sp.san,sp.name).replace(/<[^>]+>/g,'').trim(),'hit');
  }else{
    if((cd.fumaca>0||cd.cego>0)&&Math.random()<.5){cline(`${e.name} ataca ${cd.cego>0?'às cegas':'no meio da fumaça'} e erra.`,'good');tick();return}
    if(C.allies.length&&Math.random()<.35){const a=ALLIES[C.allies[d(C.allies.length)-1]];const hitA=d(20)+e.atk>=15;cline(hitA?`${e.name} acerta ${a.name}, que recua ferido.`:`${e.name} ataca ${a.name}, que desvia.`,hitA?'hit':'');tick();return}
    const pen=cd.ofusc>0?5:0;if(cd.ofusc>0)cd.ofusc--;
    const roll=d(20),tot=roll+e.atk-pen,def=defense()+C.defBuff;
    const hit=roll===20||tot>=def;
    await showRoll({label:`${e.name} ataca${pen?' (ofuscado −5)':''}`,dice:[roll],kept:roll,bonus:e.atk-pen,total:tot,dt:def,ok:hit,enemy:true});
    if(hit){
      const dr=rollExpr(e.dmg,roll===20?2:1);const rd=curArmor().rd;const dmg=Math.max(0,dr.total-rd);
      S.pv=Math.max(0,S.pv-dmg);
      cline(`${roll===20?'Crítico! ':''}${e.name} te acerta: −${dmg} PV${rd?` (RD ${rd} absorveu ${Math.min(rd,dr.total)})`:''}.`,'hit');log(`${e.name}: −${dmg} PV`);
      const sc=$('screen');sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');
    }else cline(`${e.name} ataca e erra.`);
  }
  tick();
}
function winCombat(custom){
  const C=S.combat;const after=C.after;

  if(C.ko&&!custom)txt='O inimigo está fora de combate.';
  S.combat=null;S.treatReady=true;
  S.screen='game';S.scene=after;S.outcome=`<p>${txt}</p>`;S.outcomeCls='ok';
  if(SCENES[after]&&SCENES[after].checkpoint)setCheckpoint();

}
function hurt(n,type='fisico'){
  const C=S.combat,e=C.e;const fire=type==='fogo'||type==='energia';
  if(e.immune&&!fire&&!(C.cond.exposed>0))return 0;
  if(fire&&e.immune){C.cond.exposed=2}
  if(fire&&e.weakFire)n*=2;
  e.pv-=n;return n;
}
async function allyTurn(){
  const C=S.combat,e=C.e;
  for(const id of C.allies){
    if(e.pv<=0)return 'dead';
    const a=ALLIES[id];
    if(id==='derick'&&e.immune&&!(C.cond.exposed>0)){
      if(d(20)+6>=12){const dm=hurt(rollExpr('2d6').total,'fogo');cline(`Derick conjura fogo de sangue. O Lodo ferve e a Aracnasita guincha (${dm} de dano). Ela está exposta!`,'good')}
      else cline('Derick tenta o ritual de fogo, mas a chama morre na mão dele.');
      continue;
    }
    if(Math.random()>C.allyRate){continue}
    const roll=d(20)+a.atk;
    if(roll>=effDef()){
      if(C.traitorsHold&&a.traitor&&Math.random()<.6){S.flags.aline_hint=true;cline(`${a.name} ${a.miss}.`);continue}
      const dm=hurt(rollExpr(a.dmg).total,a.type||'fisico');
      cline(`${a.name} ${a.verb}: ${dm} de dano${dm===0&&e.immune?' (o Lodo absorve)':''}.`,'good');
    }else cline(`${a.name} ataca e erra.`);
  }
  renderSheet();
  if(e.pv<=0)return 'dead';
}
async function combatEnd(dead){

  if(C.noDeath&&S.pv<=0){S.pv=1;const r=SCRIPTS[C.script].end(C,'down');busy=false;winCombat(r);return true}

  if(dead||C.ko||C.e.pv<=0){busy=false;const r=C.script&&SCRIPTS[C.script].end?SCRIPTS[C.script].end(C,'win'):null;winCombat(r||undefined);return true}
  if(C.script&&SCRIPTS[C.script].check){const r=SCRIPTS[C.script].check(C);if(r){busy=false;winCombat(r);return true}}
  return false;
}

  const bonds=Object.values(S.bond).reduce((a,b)=>a+b,0);const sus=Object.keys(S.susp).length;
  const score=S.clues.length+bonds+sus*2+(sanP>.5?2:0)+(fl('kavyur_salvo')?2:0)+(fl('avisou')?2:0);
  const rank=score>=28?'S':score>=20?'A':score>=13?'B':'C';
  const rankTxt={S:'Mada diz, sem rodeio, que você é a melhor agente que ele já treinou.',A:'Uma agente de verdade. A Ordem renasce em mãos boas.',B:'Você sobreviveu ao que derrubou uma Ordem inteira.',C:'Você sobreviveu. Por pouco. E ainda tem muito para aprender.'}[rank];
  const L=[];
  L.push(has('verdade')?'Você sabe a verdade inteira: o que seu pai fez com dois garotos, por que Aline mudou de lado, e como a esperança do Eros virou a arma deles.':has('frederick')?'Você leu o bastante para saber que seu pai não era inocente. O resto, o túmulo de Felipe guarda.':'Muita coisa ficou sem resposta. Às vezes você acorda achando que devia ter lido aqueles papéis.');
  L.push('O último rosto que o Eros viu foi o seu. Ele soube, no fim, que você estava viva. Ele disse para você correr. Você não correu.');
  L.push(sus>=3?'Você desconfiou dos três traidores antes de qualquer um. Mada nunca mais deixa de te ouvir.':sus>0?`Você viu os sinais em ${Object.keys(S.susp).map(k=>TEAM[k].name.split(' ')[0]).join(' e ')} antes da hora. Não o bastante para salvar a Base, mas o bastante para Mada te levar a sério.`:'A traição te pegou de surpresa, como pegou todo mundo.');
  L.push(B('mada')>=5?'Mada confia em você como confiava nos irmãos.':B('mada')>=3?'Mada te trata como parte da família que sobrou.':'Mada ainda te observa de longe, medindo.');
  L.push(B('derick')>=4?'Derick te chama de irmã quando acha que você não está ouvindo.':B('derick')>=2?'Derick e você viraram a dupla que segura a Base.':'Derick é gentil, mas ainda fala mais com o Mada do que com você.');
  L.push(fl('kavyur_salvo')?'Kavyur manda mensagem toda semana. VT, nunca. Mas também nunca desligou o telefone de emergência.':'VT cortou relações. Kavyur ainda escreve, escondido.');
  L.push(sanP>.6?'Você dorme bem na maioria das noites.':sanP>.3?'Você ainda não consegue ver uma aranha sem sair do cômodo.':'Toda noite você sonha com a mesa de domingo. Todas as cadeiras ocupadas por Lodo.');
  return `<section class="lvl"><div class="act">Fim · Ato II</div>
  <h1 class="scene">Relatório de agente</h1>
  <div class="report"><span class="rank">${rank}</span><h2>Koranna Wezen</h2>
    <p style="font-family:var(--mono);font-size:13px">Especialista · ${ORIGINS[S.origin]?.name??''} · NEX ${S.nex}% · SAN ${S.san}/${S.sanMax} · PV ${S.pv}/${S.pvMax}</p>
    ${L.map(l=>`<p>${l}</p>`).join('')}
    <p><b>Avaliação:</b> ${rankTxt}</p>
    <ul><li>Pistas: ${S.clues.length}/${Object.keys(CLUES).length}</li><li>Traidores percebidos antes da hora: ${sus}/3</li><li>Vínculos: ${bonds}</li><li>Pontuação: ${score}</li></ul>
  </div>
  <div class="btns"><button class="cta" data-a="new">Jogar de novo</button><button class="ghost" data-a="menu">Menu principal</button></div>
  <a class="social" href="https://x.com/wasmorf1?s=11" target="_blank" rel="noopener noreferrer" aria-label="Perfil do autor no X (Twitter): @wasmorf1"><span class="x" aria-hidden="true">𝕏</span>@wasmorf1</a></section>`;
}

/* ================= EVENTOS ================= */
async function treat(){
  if(busy||!S.treatReady)return;busy=true;render();
  const r=await test('Medicina',15,{label:'Primeiros socorros'});
  S.treatReady=false;busy=false;
  if(r.ok){const h=healPv(rollExpr('2d6').total+S.attr.INT);S.outcome=`<p class="gain">Primeiros socorros: +${h} PV.</p>`;S.outcomeCls='ok'}
  else{S.outcome='<p>Os curativos não seguram. Você só vai poder tentar de novo depois da próxima luta.</p>';S.outcomeCls='fail'}
  save();render();
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  switch(a){
    case 'new':D=draft();S={screen:'create'};render();window.scrollTo(0,0);break;
    case 'continue':{const sv=loadSave();if(sv){S=sv;busy=false;if(S.screen==='combat'&&!S.combat)S.screen='game';if(S.screen==='arsenal'){S.screen='game'}render()}break}
    case 'back':case 'menu':if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};render();drawScope();break;
    case 'origin':{D.origin=id;if(ORIGINS[id].random){const all=Object.keys(SKILLS).sort(()=>Math.random()-.5);ORIGINS[id].skills=all.slice(0,2)}render();break}
    case 'cls':{const changed=D.cls!==id;D.cls=id;D.picks=[];if(id!=='ocultista')D.rituals=[];if(changed&&(!D.inv.length||D.autoInv)){D.inv=suggestInv(id);D.autoInv=true}render();break}
    case 'attr':{const dv=+b.dataset.d;D.attr[id]+=dv;const max=dPickCount();if(D.picks.length>max)D.picks=D.picks.slice(0,max);render();break}
    case 'pick':D.picks=D.picks.includes(id)?D.picks.filter(x=>x!==id):[...D.picks,id];render();break;
    case 'rit':D.rituals=D.rituals.includes(id)?D.rituals.filter(x=>x!==id):[...D.rituals,id];render();break;
    case 'g-add':D.inv.push(newInst(id));D.autoInv=false;render();break;
    case 'g-del':D.inv=D.inv.filter(i=>i.uid!==id);D.autoInv=false;render();break;
    case 'g-moddel':{const i=D.inv.find(x=>x.uid===id);if(i){i.mods=i.mods.filter(m=>m!==b.dataset.mod);if(b.dataset.mod==='funcao')i.skill2=null;if(b.dataset.mod==='instrumental'&&i.id!=='kit')i.kitSkill=null}render();break}
    case 'g-suggest':if(D.cls){D.inv=suggestInv(D.cls);D.autoInv=true;render()}break;
    case 'g-clear':D.inv=[];D.autoInv=false;render();break;
    case 'start':startGame();break;
    case 'team-toggle':{const sel=S.teamSel||[];S.teamSel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];render();break}
    case 'team-ok':if((S.teamSel||[]).length===3){S.team=S.teamSel;S.screen='game';S.scene='c1_arsenal';S.outcome=null;save();render();window.scrollTo(0,0)}break;
    case 'arsenal-ok':{if(gearProblems(D.inv,D.attr.FOR).length)return;S.inv=D.inv;const l=S.inv.find(i=>i.id==='lanca')||S.inv.find(i=>ITEMS[i.id].dmg);if(!S.inv.some(i=>i.uid===S.equip))S.equip=l?l.uid:'_desarmado';S.scene=S.arsenal.next;S.arsenal=null;S.screen='game';S.outcome=null;if(SCENES[S.scene].checkpoint)setCheckpoint();save();render();window.scrollTo(0,0);break}
    case 'c-scan':playerAction('scan',id);break;
    case 'c-kav':playerAction('kav');break;
    case 'c-final':playerAction('final');break;
    case 'choose':choose(+b.dataset.i);break;
    case 'treat':treat();break;
    case 'equip':if(!busy){S.equip=id;save();render()}break;
    case 'use-out':{if(busy)return;const i=S.inv.find(x=>x.uid===id);if(!i)return;S.inv=S.inv.filter(x=>x!==i);const h=healPv(rollExpr('2d8+2').total);log(`Cicatrizante: +${h} PV`);S.outcome=`<p class="gain">Cicatrizante: +${h} PV.</p>`;S.outcomeCls='ok';save();render();break}
    case 'castout':{const r=RITUALS[id];if(busy||S.pe<r.cost)return;S.pe-=r.cost;let t='';if(S.cls!=='ocultista'){S.san=Math.max(0,S.san-2);t=' (−2 SAN)'}
      if(r.type==='heal'){const h=healPv(rollExpr(r.dmg,1,S.cls==='ocultista'?S.power:0).total);t=`${r.name}${t}: +${h} PV.`}else{S.nextBonus=5;t=`${r.name}${t}: +5 no próximo teste.`}
      log(t);S.outcome=`<p class="gain">${t}</p>`;S.outcomeCls='ok';if(checkDown())return;save();render();break}
    case 'c-atk':playerAction('atk',id);break;
    case 'c-rit':playerAction('rit',id);break;
    case 'c-obj':playerAction('obj',id);break;
    case 'c-item':playerAction('item',id);break;
    case 'c-mina':playerAction('mina');break;
    case 'c-lant':{const C=S.combat;if(busy||!C||C.lant)return;C.lant=true;C.cond.ofusc=Math.max(C.cond.ofusc,1);cline('Você mira a lanterna tática nos olhos dele. Ofuscado! (ação livre)','good');break}
    case 'c-guard':playerAction('guard');break;
    case 'lv-opt':S.lvl.opt=id;S.lvl.sub=null;render();break;
    case 'lv-sub':S.lvl.sub=id;render();break;
    case 'lv-ok':{const L=S.lvl;if(L.opt==='skill')S.trained.push(L.sub);if(L.opt==='rit')S.rituals.push(L.sub);if(L.opt==='power')S.power++;L.stage='rest';save();render();window.scrollTo(0,0);break}
    case 'rest':restChoice(id);break;
    case 'retry':{const cp=S.checkpoint;S=clone(cp);S.checkpoint=cp;busy=false;S.screen='game';S.outcome=null;save();render();window.scrollTo(0,0);break}
  }
});
document.addEventListener('toggle',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('cg')){D.openG=D.openG||{'Armas simples':true};D.openG[t.dataset.g]=t.open}},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='sc-in'){const b=ev.target.parentElement.querySelector('[data-a=choose]');if(b)b.click()}});
document.addEventListener('input',ev=>{if(ev.target.id==='f-name')D.name=ev.target.value});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='perito'){S.peritoArmed=t.checked;save();return}
  if(t.id==='c-equip'){switchWeapon(t.value);return}
  if(t.dataset&&t.dataset.inv){const i=D.inv.find(x=>x.uid===t.dataset.inv);if(!i)return;const f=t.dataset.f;
    if(f==='mod'){if(!t.value)return;i.mods.push(t.value);if(t.value==='funcao')i.skill2='Intuição';if(t.value==='instrumental')i.kitSkill=i.kitSkill||'Medicina'}
    else i[f]=t.value;
    D.autoInv=false;render()}
});
$('sheetBtn').addEventListener('click',()=>$('sheet').classList.toggle('open'));
$('menuBtn').addEventListener('click',()=>{if(busy)return;if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};$('sheet').classList.remove('open');render();drawScope()});
document.addEventListener('click',ev=>{const sh=$('sheet');if(sh.classList.contains('open')&&!sh.contains(ev.target)&&ev.target.id!=='sheetBtn')sh.classList.remove('open')});

/* ================= BOOT ================= */
{const t=document.querySelector('.crest');const h=$('crestSm');if(h)h.src=CREST}
function start(data){
  if(data&&data.S){S=data.S;if(data.D)D=data.D}else S={screen:'title'};
  busy=false;
  if(S.screen==='combat'&&S.combat){/* retoma combate parado */}
  render();if(S.screen==='title')drawScope();
}
window.claude?.hot?.snapshot?.(()=>({S,D}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

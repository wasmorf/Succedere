  --sangue:#d4463d; --morte:#a3a3aa; --energia:#a07bff; --conhec:#e3b943; --medo:#f4f1ec;
  --pv:#d4463d; --pe:#5fb8cc; --san:#d9c9ff;
  --ok:#86c47f; --fail:#e0574d;
  --type:"Special Elite", "Courier New", monospace;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --insan:0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
body{background:var(--ground);color:var(--bone);font-family:var(--serif);font-size:17px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  opacity:calc(.4 + var(--insan)*1.2)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(60,20,110,calc(var(--insan)*.6)) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--conhec);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,7,11,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--type);font-size:20px;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.freq{color:var(--accent)}
.top-sp{flex:1}
.mini{display:none;gap:10px;font-family:var(--mono);font-size:13px}
.mini b{font-weight:600}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tbtn:hover{border-color:var(--muted)}
#sheetBtn{display:none}

.layout{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:24px 60px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:32px;align-items:start}
.layout.nosheet{grid-template-columns:minmax(0,1fr)}
#sheet{position:sticky;top:70px;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;scrollbar-width:thin}
#sheet:empty{display:none}
main{min-width:0}

/* sheet */
.sh-name{font-family:var(--type);font-size:22px;line-height:1.2;margin:0}
.sh-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.nex{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:3px}
.nex b{color:var(--conhec);font-size:15px}
.meters{display:grid;gap:10px;margin:16px 0}
.meter{display:grid;grid-template-columns:38px 1fr 64px;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.meter .bar{height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;transition:width .5s ease}
.meter .v{text-align:right;font-variant-numeric:tabular-nums}
.meter.pv i{background:var(--pv)} .meter.pe i{background:var(--pe)} .meter.san i{background:var(--san)}
.meter.pv .l{color:var(--pv)} .meter.pe .l{color:var(--pe)} .meter.san .l{color:var(--san)}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.attr{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 0}
.attr b{display:block;font-family:var(--mono);font-size:18px}
.attr span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.sh-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:8px;padding:2px 0}
.kv span:last-child{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13px}
.skills div{display:flex;justify-content:space-between;color:var(--faint)}
.skills div.tr{color:var(--bone)}
.skills em{font-style:normal;font-family:var(--mono);font-size:11px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.sbtn{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sbtn:hover:not(:disabled){color:var(--bone);border-color:var(--muted)}
.el{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:2px;border:1px solid currentColor}
.el.sangue{color:var(--sangue)} .el.morte{color:var(--morte)} .el.energia{color:var(--energia)} .el.conhecimento{color:var(--conhec)} .el.medo{color:var(--medo)}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:2px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.clue:nth-child(odd){transform:rotate(-.6deg)} .clue:nth-child(even){transform:rotate(.5deg)}
.clue summary{font-family:var(--type);padding:6px 10px;cursor:pointer;list-style:none}
.clue summary::-webkit-details-marker{display:none}
.clue summary::before{content:"▸ ";opacity:.6}
.clue[open] summary::before{content:"▾ "}
.clue p{margin:0;padding:0 10px 8px;font-size:13.5px;line-height:1.45}
.empty{font-size:13px;color:var(--faint);font-style:italic}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log div{border-left:2px solid var(--line);padding-left:6px}
details.logw summary{cursor:pointer}

/* story */
.act{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);display:flex;gap:10px;align-items:center}
.act::after{content:"";flex:1;height:1px;background:var(--line)}
h1.scene{font-family:var(--type);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:10px 0 18px;text-wrap:balance}
.story{max-width:66ch}
.story p{margin:0 0 1em;text-shadow:calc(var(--insan)*2.2px) 0 rgba(212,70,61,.55),calc(var(--insan)*-2.2px) 0 rgba(160,123,255,.5)}
.story .radio{border-left:3px solid var(--pe);padding:4px 0 4px 14px;font-style:italic;color:#cfe6ec}
.story .radio b{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pe);display:block}
.whisper{display:block;font-family:var(--type);color:var(--accent);letter-spacing:.3em;font-size:13px;margin:-4px 0 12px;opacity:.8;animation:flick 2.4s infinite}
@keyframes flick{0%,100%{opacity:.8}45%{opacity:.2}50%{opacity:.9}}
.outcome{max-width:66ch;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 16px;margin:0 0 22px;font-size:16px}
.outcome.ok{border-color:rgba(134,196,127,.5)} .outcome.fail{border-color:rgba(224,87,77,.5)}
.outcome p{margin:0 0 .5em} .outcome p:last-child{margin:0}
.gain{font-family:var(--mono);font-size:13px;color:var(--conhec)}
.loss{font-family:var(--mono);font-size:13px;color:var(--fail)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:66ch;margin-top:26px}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;transition:border-color .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--bone);transform:translateX(3px)}
.choice .t{font-size:17px}
.choice .tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.35}
.choice .tag b{color:var(--bone);font-weight:600}
.choice.main{border-color:var(--accent)}
.choice.main .t::before{content:"→ ";color:var(--accent)}
.perito{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.perito input{accent-color:var(--conhec)}

/* tray */
#tray[hidden]{display:none}
#tray{margin-top:28px;max-width:66ch;border:1px dashed var(--line);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;background:linear-gradient(180deg,var(--panel),transparent)}
.tr-label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tr-dice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono)}
.die{width:40px;height:44px;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--ground);background:var(--bone);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-variant-numeric:tabular-nums}
.die.drop{background:var(--faint);opacity:.55}
.die.spin{animation:spin .12s linear infinite}
.die.n20{background:var(--conhec)} .die.n1{background:var(--sangue);color:var(--bone)}
.die.en{background:var(--sangue);color:var(--bone)}
@keyframes spin{50%{transform:rotate(12deg) scale(.92)}}
.tr-sum{font-size:14px;color:var(--muted)}
.tr-sum b{font-size:22px;color:var(--bone);font-variant-numeric:tabular-nums}
.stamp{grid-row:1/span 2;grid-column:2;font-family:var(--type);font-size:20px;letter-spacing:.1em;padding:4px 12px;border:2px solid currentColor;transform:rotate(-6deg);border-radius:3px}
.stamp.ok{color:var(--ok)} .stamp.fail{color:var(--fail)} .stamp.crit{color:var(--conhec)} .stamp.none{display:none}
.tr-parts{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* create */
.wrap{max-width:900px}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.step{margin-top:34px}
.step h2{font-family:var(--type);font-weight:400;font-size:22px;margin:0 0 4px}
.step .hint{font-size:14px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grid.origins{max-height:520px;overflow:auto;padding:2px 6px 2px 2px;scrollbar-width:thin}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--conhec);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--conhec)}
.card b{font-family:var(--type);font-weight:400;font-size:18px}
.card span{font-size:13.5px;color:var(--muted);line-height:1.4}
.card small{font-family:var(--mono);font-size:11px;color:var(--faint)}
.field{background:var(--panel);border:1px solid var(--line);color:var(--bone);font:inherit;font-family:var(--type);font-size:22px;padding:10px 14px;border-radius:4px;width:100%;max-width:420px}
.alloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.al{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.al .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.al b{font-family:var(--mono);font-size:26px}
.al .nm{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.al p{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.35}
.pm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:18px}
.pool{font-family:var(--mono);font-size:13px;margin-bottom:12px}
.pool b{color:var(--conhec);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.chip.sel{border-color:var(--conhec);color:var(--conhec)}
.chip.lock{border-style:dashed;color:var(--muted);cursor:default}
.summary{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:20px}
.summary .stats{font-family:var(--mono);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.cta{background:var(--accent-deep);color:#fff;border:none;border-radius:4px;padding:12px 22px;font-family:var(--type);font-size:18px;letter-spacing:.04em}
.cta:hover:not(:disabled){filter:brightness(1.1)}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:11px 20px;font-family:var(--type);font-size:17px}
.warn{font-family:var(--mono);font-size:12px;color:var(--fail)}

/* title */
.title{padding-block:6vh 0;max-width:760px}
.title .case{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.title h1{white-space:nowrap;font-family:var(--type);font-weight:400;font-size:clamp(44px,13vw,92px);line-height:.95;margin:14px 0 18px;letter-spacing:-.01em}
.title h1 span{display:inline;color:var(--accent);position:relative}
.crest{width:min(220px,55vw);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 0 22px rgba(157,107,255,.55))}
.title{margin-inline:auto;text-align:center}
.title .lede{margin-inline:auto}
.title .btns{justify-content:center}
.title .rules{text-align:left}
.title .rules summary{text-align:center}
.crest-sm{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(157,107,255,.5))}
.brand{align-items:center!important}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.rules{margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.rules summary{font-family:var(--type);font-size:19px;cursor:pointer}
.rules dl{display:grid;grid-template-columns:140px 1fr;gap:10px 18px;font-size:15px;margin-top:16px}
.rules dt{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--conhec);padding-top:3px}
.rules dd{margin:0;color:var(--muted)}
.wheel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:12px}

/* combat */
.foe{max-width:66ch;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:relative;overflow:hidden}
.foe::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,var(--foec,transparent),transparent 60%);opacity:.18;pointer-events:none}
.foe h2{font-family:var(--type);font-weight:400;font-size:26px;margin:4px 0 2px}
.foe .kind{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foe .meter{grid-template-columns:38px 1fr 80px;margin-top:14px}
.foe .meter i{background:var(--foec,var(--sangue))}
.foe .desc{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.obj{margin-top:12px;font-family:var(--mono);font-size:12px;display:flex;gap:6px;align-items:center}
.obj i{width:18px;height:8px;border:1px solid var(--pe);display:inline-block}
.obj i.on{background:var(--pe)}
.round{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px}
.clog{max-width:66ch;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.clog p{margin:0;padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.clog p:last-child{color:var(--bone);border-color:var(--bone)}
.clog p.hit{border-color:var(--fail)} .clog p.good{border-color:var(--ok)}
.actions{max-width:66ch;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:22px}
.abtn{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.abtn:hover:not(:disabled){border-color:var(--bone)}
.abtn b{font-weight:600;font-size:15.5px}
.abtn small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.abtn.sp{border-color:rgba(95,184,204,.5)}
.abtn .el{align-self:flex-start;margin-top:3px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}


/* equipamento */
.gear-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin-bottom:10px}
.gear-head b{color:var(--bone);font-size:16px;font-variant-numeric:tabular-nums}
.gear-head b.bad{color:var(--fail)}
.gear-head .sp{flex:1}
.note{font-family:var(--mono);font-size:12px;color:var(--conhec);margin:8px 0;line-height:1.5}
.invlist{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
.inv{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.inv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv-top b{font-weight:600}
.inv-top small{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;min-width:120px}
.inv-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.inv-opts:empty{display:none}
.inv-opts .chip{font-size:12px;padding:3px 10px}
.cat{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:2px;padding:1px 6px;border:1px solid currentColor}
.cat.c0{color:var(--muted)} .cat.c1{color:var(--pe)} .cat.c2,.cat.c3{color:var(--fail)}
.sel-s{background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:12px;padding:4px 6px;max-width:100%}
.catalog{display:flex;flex-direction:column;gap:8px}
.cg{border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.cg summary{cursor:pointer;padding:10px 14px;font-family:var(--type);font-size:17px}
.cg summary small{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
.csub{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:10px 14px 4px;border-top:1px solid var(--line)}
.gi{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 14px}
.gi-t{min-width:0}
.gi-t small{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.gi-t em{color:var(--conhec);font-style:normal}
.gi-t p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.sbtn.add{white-space:nowrap;flex-shrink:0}
.sbtn.add:not(:disabled){color:var(--bone);border-color:var(--muted)}
.dim{font-family:var(--mono);font-size:11px;color:var(--faint)}
.wsel{max-width:66ch;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.wsel small{font-size:11px;color:var(--faint)}
.abtn.it{border-style:dashed}

/* succedere */
.allies{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.allies span{border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--bone)}
.abtn.final{grid-column:1/-1;border-color:var(--accent);background:linear-gradient(90deg,rgba(157,107,255,.2),transparent)}
.abtn.final b{font-family:var(--type);font-size:20px;font-weight:400;color:var(--accent)}
.inputc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inputc .field{max-width:260px;text-transform:uppercase;letter-spacing:.2em}
.profile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:16px 18px;max-width:66ch}
.profile p{margin:0 0 8px}
.bondv{color:var(--accent)!important;letter-spacing:.15em}
.clog p.hint{border-color:var(--conhec)}
/* social */
.social{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--bone);text-decoration:none;font-family:var(--mono);font-size:13px;background:var(--panel)}
.social:hover,.social:focus-visible{border-color:var(--accent);color:var(--accent)}
.social .x{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Math","DejaVu Sans",sans-serif;font-size:18px;line-height:1}
/* level */
.lvl{max-width:760px}
.nexbig{font-family:var(--mono);font-size:15px;color:var(--muted);display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.nexbig b{font-size:40px;color:var(--conhec);font-weight:600}
.gains{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:14px;margin-bottom:10px}
.report{max-width:66ch;background:var(--paper);color:var(--paper-ink);padding:22px 24px;border-radius:2px;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.report h2{font-family:var(--type);font-weight:400;margin:0 0 6px;font-size:24px}
.report .rank{font-family:var(--type);font-size:64px;line-height:1;color:#5b2aa8;float:right;border:3px solid #5b2aa8;padding:4px 14px;transform:rotate(6deg);margin:0 0 10px 16px}
.report p{margin:0 0 .8em}
.report ul{margin:.3em 0 0;padding-left:18px;font-size:15px}

@media (max-width:860px){
  .top-in{gap:8px 10px}
  .brand{order:2;flex:1;justify-content:center;min-width:0}
  #sheetBtn{order:1}
  #menuBtn{order:3}
  .top-sp{display:none}
  .mini{order:4;flex-basis:100%;justify-content:center}
  .mini:empty{display:none}
  input,select,.sel-s,.field{font-size:16px!important}
  #sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:18px 60px}
  #sheet{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);max-height:none;border-radius:0;z-index:60;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  #sheet.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  #sheetBtn{display:inline-block}
  .mini{display:flex}
  .brand small{display:none}
  .choice{flex-direction:column;align-items:flex-start}
  .choice .tag{text-align:left;white-space:normal}
  .rules dl{grid-template-columns:1fr}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

function armorInfo(inv,cls,grip){
  let def=0,rd=0,heavy=false,nonprof=false;const names=[];const p=PROF[cls]||{};
  inv.forEach(i=>{const it=ITEMS[i.id];if(it.kind!=='protecao')return;

function wStats(w,mode='normal'){
  const it=w.it,m=w.inst.mods,coron=mode==='coronhada',o={};
  o.name=coron?`Coronhada (${it.name})`:it.name;
  o.ranged=!coron&&!!it.ranged;
  o.skill=o.ranged?'Pontaria':'Luta';
  o.attr=o.ranged?'AGI':(it.agil&&!coron?'AGI':'FOR');
  let base=coron?(it.grip==='duas'?'1d6':'1d4'):it.dmg;
  if(!coron&&it.dmg2&&!S.inv.some(i=>i.id==='escudo'))base=it.dmg2;
  const mm=/(\d+)d(\d+)/.exec(base);o.n=+mm[1];o.s=+mm[2];
  o.margin=coron?20:it.crit[0]-((m.includes('perigosa')||m.includes('laser'))?2:0);
  o.mult=coron?2:it.crit[1];
  o.atk=(!coron&&(m.includes('certeira')||m.includes('alongada')))?2:0;
  o.dmgB=(!coron&&m.includes('cruel')?2:0)+(it.unarmed&&hasItem('soqueira')?1:0);
  o.extraDice=(!coron&&m.includes('calibre')?1:0)+(S.cls==='combatente'?S.power:0);
  o.addAttr=o.ranged?(it.forDmg?'FOR':null):o.attr;
  o.auto=!coron&&(!!it.auto||m.includes('ferrolho'));
  o.comp=m.includes('compensador');
  const p=PROF[S.cls]||{};
  o.prof=coron||it.prof!=='tatica'||!!p.tatica;
  o.chainsaw=!!it.chainsaw&&!coron;
  o.diceMod=(o.prof?0:-2)+(o.chainsaw?-1:0)+(curArmor().nonprof?-1:0);
  o.ammo=coron?null:(it.ammo||null);

}
function gearBonus(sk,ctx=[]){
  const inv=S.inv||[],parts=[];let b=0;
  if(sk==='Atletismo'){b+=2;parts.push('braço mecânico +2')}
  if(KIT_SKILLS.includes(sk)&&!inv.some(i=>i.kitSkill===sk&&(i.id==='kit'||i.mods.includes('instrumental')))){b-=5;parts.push('sem kit −5')}
  let vest=0;
  inv.forEach(i=>{const it=ITEMS[i.id];if(it.kind!=='acessorio')return;
    if(it.vest){vest++;if(vest>2)return}
    if(it.pick==='skill'&&i.skill===sk){const v=i.mods.includes('aprimorado')?5:2;b+=v;parts.push(`${it.name} +${v}`)}
    if(i.mods.includes('funcao')&&i.skill2===sk){b+=2;parts.push(`${it.name} +2`)}});
  const CTX={escuro:['lanterna','Percepção',2],distante:['binoculos','Percepção',5],escalar:['corda','Atletismo',5],mato:['sobrev','Sobrevivência',5],porta:['pecabra','Atletismo',5],respirar:['mascara','Fortitude',10],ambiente:['hazmat','Fortitude',5]};
  ctx.forEach(c=>{const [id,s,v]=CTX[c];if(s===sk&&inv.some(i=>i.id===id)){b+=v;parts.push(`${ITEMS[id].name} +${v}`)}});
  if(LOAD.has(sk)&&S.cls){const ar=curArmor();if(ar.heavy){b-=5;parts.push('carga −5')}if(ar.nonprof){b-=5;parts.push('proteção sem proficiência −5')}}
  return {b,parts};
}

/* ================= DADOS / ROLAGENS ================= */
const d=n=>1+Math.floor(Math.random()*n);
function rollExpr(expr,mult=1,extraDice=0){
  const m=/^(\d+)d(\d+)([+-]\d+)?$/.exec(expr.replace(/\s/g,''));
  const n=(+m[1]+extraDice)*mult, s=+m[2], mod=m[3]?+m[3]:0;
  const rolls=Array.from({length:n},()=>d(s));
  return {total:Math.max(1,rolls.reduce((a,b)=>a+b,0)+mod),rolls,expr:`${n}d${s}${mod?(mod>0?'+':'')+mod:''}`};
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTrained=sk=>S.trained.includes(sk);
function diceFor(sk,mod=0,attr){const a=S.attr[attr||SKILLS[sk]]+mod;return a>0?`${a}d20`:`${2-a}d20↓`}
function testLabel(sk,dt,extra=0,ctx=[],mod=0,attr){
  if(locked(sk))return `${sk}* · <b>somente treinada</b>`;
  const b=(isTrained(sk)?5:0)+gearBonus(sk,ctx).b+extra;
  return `${sk} · ${diceFor(sk,mod,attr)}${b>0?'+'+b:b<0?b:''}${dt!=null?` · <b>DT ${dt}</b>`:''}`;
}

function log(t){S.log=S.log||[];S.log.unshift(t);if(S.log.length>40)S.log.pop()}

async function showRoll(r){
  const tray=document.getElementById('tray');tray.hidden=false;
  const diceHtml=r.dice.map((v,i)=>`<span class="die spin${r.enemy?' en':''}" data-i="${i}">?</span>`).join('');
  tray.innerHTML=`<div class="tr-label">${r.label}</div>
    <div class="stamp none" id="stamp"></div>
    <div class="tr-dice">${diceHtml}<span class="tr-sum" id="trsum"></span></div>
    <div class="tr-parts" id="trparts"></div>`;
  const els=[...tray.querySelectorAll('.die')];
  try{tray.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'})}catch(e){}
  if(!reduced()){
    const t0=Date.now();
    while(Date.now()-t0<650){els.forEach(e=>e.textContent=d(20));await wait(60)}
  }
  let keptShown=false;
  els.forEach((e,i)=>{e.classList.remove('spin');e.textContent=r.dice[i];
    const isKept=!keptShown&&r.dice[i]===r.kept; if(isKept)keptShown=true;
    if(!isKept)e.classList.add('drop'); else if(!r.enemy){if(r.kept===20)e.classList.add('n20');if(r.kept===1)e.classList.add('n1')}});
  document.getElementById('trsum').innerHTML=`${r.bonus?(r.bonus>0?` + ${r.bonus}`:` − ${-r.bonus}`):''} = <b>${r.total}</b>${r.dt!=null?` <span>vs ${r.enemy?'Defesa':'DT'} ${r.dt}</span>`:''}`;
  if(r.parts&&r.parts.length)document.getElementById('trparts').textContent=r.parts.join(' · ');
  const st=document.getElementById('stamp');
  if(r.ok!=null){
    if(r.enemy){st.className='stamp '+(r.ok?'fail':'ok');st.textContent=r.ok?'ACERTOU':'ERROU'}
    else if(r.crit&&r.ok){st.className='stamp crit';st.textContent='CRÍTICO'}
    else{st.className='stamp '+(r.ok?'ok':'fail');st.textContent=r.ok?'SUCESSO':'FALHA'}
  }
  await wait(reduced()?120:520);
}

async function test(sk,dt,o={}){
  const ak=o.attr||SKILLS[sk];const a=S.attr[ak]??1;
  const n=a+(o.diceMod||0),low=n<=0,count=low?2-n:n;
  const dice=Array.from({length:count},()=>d(20));
  const kept=low?Math.min(...dice):Math.max(...dice);
  let bonus=0;const parts=[`${sk} (${ak} ${a}${o.diceMod?`, ${o.diceMod}d20`:''})`];
  (o.notes||[]).forEach(x=>parts.push(x));
  if(isTrained(sk)){bonus+=5;parts.push('treinado +5')}
  const g=gearBonus(sk,o.ctx||[]);bonus+=g.b;parts.push(...g.parts);
  if(o.bonus){bonus+=o.bonus;parts.push(`${o.bonusLabel||'bônus'} ${o.bonus>0?'+':''}${o.bonus}`)}
  if(S.nextBonus){bonus+=S.nextBonus;parts.push(`preparo +${S.nextBonus}`);S.nextBonus=0}
  if(S.peritoArmed&&isTrained(sk)&&S.pe>=2&&S.cls==='especialista'){
    S.pe-=2;const p=rollExpr(S.power>0?'1d8':'1d6').total;bonus+=p;parts.push(`Perito +${p} (−2 PE)`);S.peritoArmed=false;
  }
  const total=kept+bonus, ok=dt==null?null:total>=dt, crit=o.crit?kept>=o.crit:false;
  await showRoll({label:o.label||`Teste de ${sk}`,dice,kept,low,bonus,total,dt,ok,crit,parts});
  log(`${o.label||sk}: [${dice.join(', ')}]${bonus?(bonus>0?'+':'')+bonus:''} = ${total}${dt!=null?` vs ${dt} → ${ok?'sucesso':'falha'}`:''}`);
  renderSheet();
  return {total,ok,crit,kept};
}

function addClue(id){if(!S.clues.includes(id)){S.clues.push(id);return `<p class="gain">✦ Pista obtida: ${CLUES[id].t}</p>`}return ''}
function loseSan(expr,src){const r=rollExpr(expr);S.san=Math.max(0,S.san-r.total);log(`${src}: −${r.total} SAN (${r.expr})`);return `<p class="loss">− ${r.total} Sanidade (${src})</p>`}
function losePv(expr,src){const r=rollExpr(expr);S.pv=Math.max(0,S.pv-r.total);log(`${src}: −${r.total} PV`);return `<p class="loss">− ${r.total} PV (${src})</p>`}
function healPv(n){const b=S.pv;S.pv=Math.min(S.pvMax,S.pv+n);return S.pv-b}
function defense(){return 10+S.attr.AGI+curArmor().def}
function ritualDT(){return 10+S.attr.PRE+(isTrained('Ocultismo')?5:0)}
const fl=k=>!!S.flags[k];

function recalcMax(){
  const c=CLASSES[S.cls], st=(S.nex-5)/5;
  S.pvMax=c.pv[0]+S.attr.VIG+st*(c.pv[1]+S.attr.VIG);
  S.peMax=c.pe[0]+S.attr.PRE+st*(c.pe[1]+S.attr.PRE);

}

function calm(n){const b=S.san;S.san=Math.min(S.sanMax,S.san+n);return S.san>b?`<p class="gain">+${S.san-b} Sanidade</p>`:''}
function bond(k,n=1){S.bond[k]=(S.bond[k]||0)+n;return `<p class="gain">◆ Vínculo com ${BOND_NAME[k]} ${n>0?'+':''}${n}</p>`}
function susp(who,why){if(S.susp[who])return '';S.susp[who]=why||true;return `<p class="loss">▲ Suspeita anotada: ${TEAM[who].name}</p>`}
function hintTraitor(){
  const t=S.team.filter(x=>TEAM[x]&&ALLIES[x].traitor&&!S.susp[x]);
  if(!t.length)return P('Você observa cada um. Nada fora do lugar. Ou todo mundo aqui é muito bom em esconder.');
  const who=t[d(t.length)-1];const h=TRAITOR_HINTS[who];
  return P(h[d(h.length)-1])+susp(who);
}
function addLoot(id){
  const it=ITEMS[id];const cap=capacity(S.attr.FOR,S.inv),used=spacesUsed(S.inv);
  if(used+it.sp>cap)return `<p class="loss">Sem espaço na mochila para ${it.name}. Você deixa para trás.</p>`;
  S.inv.push(newInst(id));return `<p class="gain">+ ${it.name} na mochila</p>`;
}

RADIO:TELEFONE · JUDITE|"Eros Wezen? Sim. Agente em atividade." Um silêncio longo. "Quem está perguntando?"`),
  choices:()=>[
    {once:'judite',label:'Pressionar Judite por mais informações',test:{sk:'Diplomacia',dt:13},
      ok:()=>({text:P(`"Ele não fala de família. Só uma vez, bêbado, falou de uma irmã que morreu por culpa dele." Ela anota seu nome. "Venha até o bar. Rua da Alfândega, 212. Sozinha."`)+addClue('eros_vivo')}),
      fail:()=>({text:P(`"Isso não é assunto para telefone." Ela te dá um endereço, Rua da Alfândega, 212, e desliga.`)+addClue('eros_vivo')})},
    {label:'Ir até o endereço agora',main:true,run:()=>{addClue('eros_vivo');return {go:'c1_bar'}}}
  ]},

c1_bar:{act:A1+'Cap. 1 · A Ordem',title:'O bar',
  text:()=>P(`Um bar de esquina com cadeiras em cima das mesas. Judite, cinquenta e poucos anos, cabelo preso num lápis, te olha como quem mede um caixão. Ela empurra a estante de vinhos. Atrás dela, uma escada de concreto desce para uma luz branca.

"Só eu abro isso por cima", diz. "Lembre disso."

Lá embaixo, a Base da Ordo Realitas: corredores de azulejo, cheiro de café velho e pólvora. E a notícia, dada sem cerimônia por um homem de dreads chamado Mada: a Equipe Bob, a equipe do seu irmão, sumiu há um mês. Última localização: o hospital abandonado da zona norte.`),
  choices:()=>[{label:'Seguir Mada até a sala de reunião',main:true,run:()=>({go:'c1_base'})}]},

c1_base:{act:A1+'Cap. 1 · A Ordem',title:'Sala de reunião',
  text:()=>P(`Roger, o líder, ex-militar, fala rápido e não pisca. Ao lado dele, Thomas, o irmão mais velho do Mada, de braços cruzados. Encostado na parede, um garoto de dezesseis anos com cara de sono: Derick.

"Você não é agente", diz Roger. "Se morrer lá dentro, o problema é seu." Mada olha para você por um tempo longo. "Eu não posso sair da Base agora. Mas posso te dar uma equipe. Três agentes. Você escolhe."`),
  choices:()=>[
    {once:'b_mada',label:'Perguntar a Mada sobre Eros',
      run:()=>({text:P(`"Bom agente. Quieto. Chegou do nada há uns anos, sabia mais de ritual que muito veterano." Ele hesita. "Nunca falou de família. Nenhuma vez." A frase dói mais do que devia.`)+bond('mada')})},
    {once:'b_thomas',label:'Sustentar o olhar de Thomas, que te mede de cima a baixo',test:{sk:'Intimidação',dt:14},
      ok:()=>({text:P(`Thomas sorri de canto. "Pelo menos essa não abaixa a cabeça." É quase um elogio.`)+bond('thomas')}),
      fail:()=>({text:P(`Thomas ri pelo nariz e volta a olhar o mapa. Você sente o rosto quente.`)})},
    {label:'Escolher a equipe de resgate',main:true,run:()=>({team:true})}
  ]},

c1_arsenal:{act:A1+'Cap. 1 · A Ordem',title:'O arsenal',
  text:()=>P(`Derick te leva até o arsenal, uma sala de grades com cheiro de óleo de máquina. "Regra da casa: recruta leva no máximo duas coisas de categoria I. O resto, o que couber na mochila."

Ele pega uma lança da parede e te olha, desconfiado. "Quem escolhe lança em pleno século XXI?" Depois sorri. "Combina com você. Mas leva a pistola também."

Equipe: ${teamNames().join(', ')}.`),
  choices:()=>[{label:'Abrir o arsenal',main:true,run:()=>({arsenal:{next:'c1_saida',patente:'recruta',suggest:'koranna'}})}]},

c1_saida:{act:A1+'Cap. 1 · A Ordem',title:'A caminho do hospital',
  text:()=>{
    const lines=[];
    if(tm('lipe')&&tm('jade'))lines.push('No banco de trás, Lipe e Jade dividem um fone de ouvido e seguram a mão um do outro sem perceber.');
    else if(tm('lipe'))lines.push('Lipe conta piadas ruins para quebrar o gelo. Ninguém ri. Ele conta outra.');
    else if(tm('jade'))lines.push('Jade desenha símbolos no vidro embaçado e apaga cada um com a manga.');
    if(tm('leon'))lines.push('Leon dirige rápido demais e não tira o olho do retrovisor.');
    if(tm('jon'))lines.push('Jon confere o fuzil três vezes. Não diz uma palavra a viagem toda.');
    if(tm('rjr'))lines.push('Roger Jr abre a planta do bairro no colo e divide a equipe em formação antes mesmo de chegar.');
    return P(lines.join(' ')+`

RADIO:RÁDIO · MADA|"Koranna. Cuidado lá dentro. Se ficar feio, me chama. Eu vou."

O hospital aparece no fim da rua: seis andares de janelas quebradas e uma cruz vermelha apagada.`)},
  choices:()=>[
    {once:'obs1',label:'Observar o grupo em silêncio durante a viagem',test:{sk:'Intuição',dt:14},
      ok:()=>({text:hintTraitor()}),
      fail:()=>({text:P(`Você tenta ler cada um, mas só consegue pensar no seu irmão.`)})},
    {label:'Entrar no hospital',main:true,run:()=>({go:'h1_hall'})}
  ]},

/* ---------------- CAP 2 · HOSPITAL ---------------- */
h1_hall:{act:A1+'Cap. 2 · O hospital',title:'Primeiro andar',checkpoint:true,
  text:()=>P(`O saguão fede a formol e ferrugem. Macas viradas, papel de parede descascando em línguas. Quatro portas: a recepção, a farmácia, o necrotério e, no fim do corredor, o escritório do médico-chefe, com a porta entreaberta e uma luz que não devia estar acesa.`)+
    (S.done.parasita?P(`A escada para o segundo andar está livre.`):''),
  choices:()=>[
    {once:'recepcao',label:'Revirar a recepção',test:{sk:'Investigação',dt:12},
      ok:()=>({text:P(`O livro de visitas ainda está no balcão. Você passa o dedo pelas assinaturas e para.`)+addClue('registro')+loseSan('1d2','a letra dele')}),
      fail:()=>({text:P(`Fichas mofadas, nada legível. Algo se mexe atrás do balcão, mas é só um rato.`)})},
    {once:'farmacia',label:'Procurar suprimentos na farmácia',test:{sk:'Percepção',dt:13},
      ok:()=>({text:P(`Atrás de um armário tombado, uma caixa lacrada, com validade em dia. Alguém esteve aqui recentemente.`)+addLoot('cicatrizante')}),
      fail:()=>({text:P(`Você derruba uma prateleira. O barulho ecoa. Algo responde lá do fundo.`),combat:{id:'zumbi',after:'h1_hall',allies:S.team,enemyFirst:true,winText:'O zumbi desaba sobre os frascos quebrados.'}})},
    {once:'necroterio',label:'Descer ao necrotério',
      run:()=>({text:P(`As gavetas estão abertas. Todas. Uma delas ainda tem alguém dentro, e esse alguém está se sentando.`),combat:{id:'zumbi',after:'h1_necro',allies:S.team}})},
    {once:'parasita',label:'Entrar no escritório do médico',main:!S.done.parasita,run:()=>({go:'h1_escritorio'})},
    {cond:()=>!!S.done.parasita,label:'Subir ao segundo andar',main:true,run:()=>({go:'h2_andar'})}
  ]},

h1_necro:{act:A1+'Cap. 2 · O hospital',title:'Necrotério',
  text:()=>P(`Nas outras gavetas, corpos secos como papel, sem uma gota de sangue. Todos com a mesma marca no pescoço: dois furos, lado a lado. Não é mordida de gente.`),
  choices:()=>[{label:'Voltar ao corredor',main:true,run:()=>({go:'h1_hall',text:loseSan('1d2','o necrotério')})}]},

h1_escritorio:{act:A1+'Cap. 2 · O hospital',title:'O escritório do médico',
  text:()=>P(`A sala é estreita. Só dá para entrar em fila. Você vai no meio, como Derick ensinou. ${S.team.map(i=>TEAM[i].name.split(' ')[0]).join(', ')}: alguém vai ter que entrar por último e fechar a retaguarda.

Um aviso que você só vai entender tarde demais: o que vive nesta sala sempre escolhe o último a entrar.`),
  choices:()=>S.team.map(id=>({label:`${TEAM[id].name} entra por último`,run:()=>{S.host=id;return {go:'h1_sonho'}}}))},

h1_sonho:{act:A1+'Cap. 2 · O hospital',title:'O sonho compartilhado',
  text:()=>P(`A porta bate atrás de vocês. A lâmpada estoura. E, de repente, vocês quatro estão em outro lugar, todos ao mesmo tempo, vendo a mesma coisa.

${GUILT[S.host]}

Você acorda de joelhos no chão do escritório. Todos acordam. Alguém entre vocês está respirando errado. Você tem segundos.`),
  choices:()=>[
    {label:'Procurar os sinais no rosto de cada um',test:{sk:'Percepção',dt:15},
      ok:()=>({text:P(`As pupilas de ${TEAM[S.host].name} estão do tamanho de uma moeda. "É ${TEAM[S.host].name.split(' ')[0]}!" O Parasita arranca-se das costas dele antes de tomar o controle, e fica exposto no meio da sala.`)+(ALLIES[S.host].traitor?susp(S.host,'o sonho'):'')+bond('derick'),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),weak:true,winText:'O Parasita se desfaz em cinza morna.'}}),
      fail:()=>({go:'h1_descontrole'})},
    {label:'Confiar no instinto',test:{sk:'Intuição',dt:14},
      ok:()=>({text:P(`Você não sabe explicar, mas sabe: ${TEAM[S.host].name}. Você grita o nome dele e o Parasita, descoberto, se solta do hospedeiro.`)+(ALLIES[S.host].traitor?susp(S.host,'o sonho'):''),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),weak:true,winText:'O Parasita se desfaz em cinza morna.'}}),
      fail:()=>({go:'h1_descontrole'})}
  ]},

h1_descontrole:{act:A1+'Cap. 2 · O hospital',title:'Descontrole',
  text:()=>P(`Tarde demais. ${TEAM[S.host].name} se levanta com os olhos virados e ataca quem estiver mais perto. Ninguém quer atirar num colega. Alguém precisa segurá-lo.`)+(ALLIES[S.host].traitor?P(`E a imagem do sonho não sai da sua cabeça.`)+susp(S.host,'o sonho'):''),
  choices:()=>[
    {label:`Abraçar ${TEAM[S.host].name.split(' ')[0]} com toda a força`,test:{sk:'Vontade',dt:14},
      ok:()=>({text:P(`Você o prende com o braço mecânico e não solta, nem quando ele morde seu ombro. Aos poucos, ele volta. O Parasita escorre das costas dele como óleo.`)+losePv('1d4','mordida'),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:'O Parasita se desfaz em cinza morna.'}}),
      fail:()=>({text:P(`Ele te joga contra a parede antes de você fechar o abraço. Outro agente consegue segurá-lo, e sai com o rosto aberto.`)+losePv('2d6','o golpe'),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:'O Parasita se desfaz em cinza morna.'}})},
    {label:'Deixar outro agente tentar',
      run:()=>{S.flags.host_ferido=true;return {text:P(`Você hesita. ${S.team.filter(x=>x!==S.host).map(x=>TEAM[x].name.split(' ')[0])[0]} se joga e segura, levando um golpe feio no processo.`)+loseSan('1d4','a hesitação'),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:'O Parasita se desfaz em cinza morna.'}}}}
  ]},

h1_depois:{act:A1+'Cap. 2 · O hospital',title:'Depois do sonho',
  text:()=>P(`${TEAM[S.host].name} fica sentado no chão por um minuto, sem olhar para ninguém. Todos viram o que ele viu. Ninguém comenta.`)+(ALLIES[S.host].traitor?P(`Você comenta menos ainda. Mas guarda.`):P(`Você põe a mão no ombro dele. Todo mundo tem um lago escuro em algum lugar.`)),
  choices:()=>[{label:'Voltar ao corredor',main:true,run:()=>({go:'h1_hall'})}]},

h2_andar:{act:A1+'Cap. 2 · O hospital',title:'Segundo andar',
  text:()=>P(`O segundo andar está pior: marcas de garra no teto, e um rastro de sangue antigo que vai direto até uma porta com a placa "ARQUIVO". À esquerda, a ala pediátrica, com bichinhos de pelúcia pendurados pelo pescoço no corrimão.`),
  choices:()=>[
    {once:'pediatria',label:'Explorar a ala pediátrica',test:{sk:'Vontade',dt:12},
      ok:()=>({text:P(`Você entra e não desvia o olhar. Nas paredes, desenhos novos, de giz de cera.`)+addClue('desenho')}),
      fail:()=>({text:P(`Um carrinho de brinquedo começa a andar sozinho na sua direção. Você sai de lá sem respirar, mas não antes de ver os desenhos.`)+addClue('desenho')+loseSan('1d4','a ala pediátrica')})},
    {once:'obs2',label:'Observar os colegas enquanto andam',test:{sk:'Intuição',dt:14},
      ok:()=>({text:hintTraitor()}),
      fail:()=>({text:P(`Todo mundo parece tenso. Isso não quer dizer nada. Ou quer.`)})},
    {label:'Seguir o rastro até o arquivo',main:true,run:()=>({go:'h2_arquivo'})}
  ]},

h2_arquivo:{act:A1+'Cap. 2 · O hospital',title:'Sala de arquivos',
  text:()=>P(`Arquivos de aço até o teto. Na mesa, alguém deixou a planta do hospital aberta, presa por um bisturi. Como se fosse para vocês acharem.`)+addClue('planta'),
  choices:()=>[
    {once:'dono',label:'Procurar quem é o dono do prédio',test:{sk:'Investigação',dt:14},
      ok:()=>({text:P(`Uma pasta de escrituras. Você lê o nome da empresa três vezes antes de acreditar.`)+addClue('dono')+loseSan('1d3','o nome do seu pai')}),
      fail:()=>({text:P(`Escrituras, alvarás, papelada. Nada que ajude agora.`)})},
    {label:'Ir até a parede leste',main:true,run:()=>({go:'h2_parede'})}
  ]},

h2_parede:{act:A1+'Cap. 2 · O hospital',title:'A parede manchada',
  text:()=>P(`A parede leste do corredor está coberta de manchas de sangue secas. Não são aleatórias: alguém pressionou a mão em pontos específicos, muitas vezes. Uma delas abre a passagem. As outras, você não quer descobrir.

Tentativas restantes: ${3-(S.flags.tries||0)}.`)+(S.flags.dica?P(`Com a planta nas mãos, você tem certeza: o cômodo fantasma fica alinhado ao poço da escada.`):''),
  choices:()=>{
    const spot=(label,right)=>({label,run:()=>{
      if(right){S.flags.alarme=false;return {text:P(`Você encosta a mão. Um estalo seco. A parede gira para dentro sem um ruído.`),go:'h3_subsolo'}}
      S.flags.tries=(S.flags.tries||0)+1;
      if(S.flags.tries>=3){S.flags.alarme=true;return {text:P(`A terceira mancha afunda. A parede se abre, e junto com ela uma sirene antiga começa a uivar lá embaixo. Quem estiver no subsolo sabe que vocês chegaram.`),go:'h3_subsolo'}}
      return {text:P(`Nada. Só o gesso frio e um cheiro de ferro que fica na sua mão.`)}}});
    return [
      {once:'dica',label:'Comparar as manchas com a planta',test:{sk:'Investigação',dt:13},
        ok:()=>{S.flags.dica=true;return {text:P(`A planta resolve: o cômodo sem porta está exatamente atrás do poço da escada.`)}},
        fail:()=>({text:P(`As linhas da planta dançam na luz da lanterna. Você não consegue alinhar nada.`)})},
      spot('A mancha em arco, perto da janela quebrada',false),
      spot('A mão aberta embaixo do extintor',false),
      spot('A mancha junto ao poço da escada, na altura do peito',true),
      spot('O borrão no rodapé, perto da porta do arquivo',false),
      spot('A marca de dedos no alto, quase no teto',false)
    ]}},

h3_subsolo:{act:A1+'Cap. 2 · O hospital',title:'O subsolo',
  text:()=>P(`Uma escada em caracol, depois um corredor de celas. Na última, três vultos magros: Bob, Luna, Ryan. Vivos.

E, no fim do corredor, saindo por outra porta: Luck, de nunchaku no ombro. Formiga, arrastando os pés. E entre os dois, de costas, um homem com um tapa-olho improvisado.

Você conhece aquele andar. Você conhece aqueles ombros. É o Eros.

Ele não te vê. A porta se fecha atrás deles. No lugar dela, uma mulher com cortes no rosto desembainha uma espada.`)+(S.flags.alarme?P(`Ela estava esperando. A sirene ainda uiva.`):''),
  choices:()=>[
    {label:'Gritar o nome dele',
      run:()=>({text:P(`"EROS!" O grito ecoa, mas a porta já está fechada. Aline sorri. "Ele não vai voltar por você."`)+loseSan('1d4','a porta fechada'),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:'Aline cai de joelhos, desarmada. Vocês a imobilizam.'}})},
    {label:'Correr atrás dele',test:{sk:'Atletismo',dt:16},
      ok:()=>({text:P(`Você chega a tocar a maçaneta. Trancada. Quando se vira, a espada de Aline já está vindo, e você desvia por reflexo.`),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,winText:'Aline cai de joelhos, desarmada. Vocês a imobilizam.'}}),
      fail:()=>({text:P(`Aline corta seu caminho, literalmente.`)+losePv('1d6','a espada'),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:'Aline cai de joelhos, desarmada. Vocês a imobilizam.'}})},
    {label:'Engolir o grito e atacar primeiro',test:{sk:'Vontade',dt:13},
      ok:()=>({text:P(`Você morde a língua até sentir gosto de sangue, e avança antes que ela termine de se posicionar.`),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,surprise:!S.flags.alarme,winText:'Aline cai de joelhos, desarmada. Vocês a imobilizam.'}}),
      fail:()=>({text:P(`Seu corpo não obedece. Você fica parada olhando a porta.`),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:'Aline cai de joelhos, desarmada. Vocês a imobilizam.'}})}
  ]},

h3_resgate:{act:A1+'Cap. 2 · O hospital',title:'Resgate',
  text:()=>P(`Aline está algemada no chão, rindo baixo. Vocês arrombam a cela. Bob, o mais novo dos Zart, mal consegue ficar de pé. Luna chora sem som. Ryan olha para você com ódio assim que ouve seu sobrenome.

"Wezen", Bob repete, devagar. "Você é a irmã." Não é uma pergunta.`)+(S.team.some(x=>ALLIES[x].traitor)&&S.flags.aline_hint?P(`E você não consegue parar de pensar em como alguns tiros passaram tão perto dela. E tão longe.`):''),
  choices:()=>[
    {once:'pensar',cond:()=>S.team.some(x=>ALLIES[x].traitor),label:'Repassar a luta na cabeça',test:{sk:'Intuição',dt:13},
      ok:()=>{const t=S.team.filter(x=>ALLIES[x].traitor);return {text:P(`Você lembra de cada golpe. ${t.map(x=>TEAM[x].name.split(' ')[0]).join(' e ')} não acertou${t.length>1?'am':''} Aline nenhuma vez que importasse.`)+t.map(x=>susp(x,'a luta')).join('')}},
      fail:()=>({text:P(`Foi tudo rápido demais. Você só lembra da espada.`)})},
    {label:'Levar todos de volta à Base',main:true,run:()=>({levelup:'b1_ala'})}
  ]},
};
Object.assign(SCENES,{
/* ---------------- CAP 3 · A BASE ---------------- */
b1_ala:{act:A1+'Cap. 3 · A Base',title:'Ala médica',checkpoint:true,
  text:()=>P(`Um dia inteiro de repouso obrigatório. A Equipe Bob dorme sob soro. Aline está trancada na cela do fundo, e a porta só abre na hora oficial do interrogatório.

Pela primeira vez em seis anos, você tem tempo para pensar. É pior do que correr.`),
  choices:()=>[
    {once:'c_mada',label:'Conversar com Mada',
      run:()=>({text:P(`Ele fala olhando para a katana no colo. "Zumbis de sangue. Eu tinha quinze anos. Meus pais eram dublês, eu também queria ser. Cheguei em casa e..." Ele para. "Desde então, proteger é a única coisa que eu sei fazer direito."`)+bond('mada')+calm(2)})},
    {once:'c_derick',label:'Conversar com Derick',
      run:()=>({text:P(`"Sério, uma lança?" Ele ri pela primeira vez. Depois conta, sem drama, que o próprio pai tentou usar o sangue dele num ritual aos doze anos. "Mada chegou antes. Matou ele na minha frente." Pausa. "Eu devo tudo a ele. Tudo."`)+bond('derick')+calm(2)})},
    {once:'c_thomas',label:'Conversar com Thomas',
      run:()=>({text:P(`"Roger está velho. Quando ele sair, alguém tem que segurar isso aqui." Thomas não diz quem, mas nem precisa. "E esse alguém não vai ser o filho dele. Aquele garoto não escolheu nada na vida. Isso é perigoso."`)+bond('thomas')})},
    {label:'Ir à reunião geral',main:true,run:()=>({go:'b2_reuniao'})}
  ]},

b2_reuniao:{act:A1+'Cap. 3 · A Base',title:'Reunião geral',
  text:()=>P(`Bob fala com a voz rouca. Eros os levou até o subsolo. Na hora, virou a arma contra a própria equipe. Aline, Luck e Formiga já esperavam lá. Um mês preso, sem saber por quê.

Roger nem pestaneja. "Mada, Derick. Interroguem a Aline. Do jeito que for preciso." Thomas se levanta: "Isso é tortura, Roger." "Isso é guerra."

Você dá um passo à frente. "Eu vou junto." Mada balança a cabeça. "Não."`),
  choices:()=>[
    {label:'Aceitar em silêncio',run:()=>{S.flags.resignada=true;return {text:P(`Você recua. Mada percebe, e aperta seu ombro ao passar. "Obrigado."`)+bond('mada'),go:'b3_espera'}}},
    {label:'Insistir',test:{sk:'Diplomacia',dt:16},
      ok:()=>({text:P(`"É o meu irmão." Mada para. "Por isso mesmo você não vai." A voz dele não é dura. É cuidadosa. Você entende.`)+bond('mada'),go:'b3_espera'}),
      fail:()=>{S.flags.raiva=true;return {text:P(`"Não." E a porta fecha na sua cara. Você fica com a raiva presa na garganta.`),go:'b3_espera'}}}
  ]},

b3_espera:{act:A1+'Cap. 3 · A Base',title:'A espera',
  text:()=>P(`Enquanto o interrogatório acontece, a Base fica em silêncio. Thomas chama Roger para uma sala e fecha a porta. A Equipe Bob está acordada na ala médica.`),
  choices:()=>[
    {once:'ouvir_thomas',label:'Passar perto da porta de Thomas e Roger',test:{sk:'Furtividade',dt:14},
      ok:()=>({text:P(`Só um pedaço, abafado: "...o seu filho, Roger. Olha pra ele. Olha de verdade." Roger não responde.`)+susp('rjr','a conversa de Thomas')}),
      fail:()=>({text:P(`Roger abre a porta de repente. "Algum problema, Wezen?" Você inventa que procurava o banheiro.`)})},
    {once:'ryan',label:'Falar com Ryan sobre Eros',
      run:()=>({text:P(`"Seu irmão sorria pra gente todo dia. Todo dia. E aí virou a arma." Ryan cospe no chão. "Se eu achar ele primeiro, não sobra nada pra você enterrar."`)+loseSan('1d2','o ódio de Ryan')})},
    {once:'luna',label:'Falar com Luna sobre Eros',
      run:()=>({text:P(`Luna segura sua mão. "Ele era bom. Ingênuo. Fazia café pra todo mundo. Quando virou a arma, estava chorando." Ela hesita. "Ele disse: desculpa, eu preciso trazer ela de volta."`)+bond('bob')})},
    {once:'bob',label:'Falar com Bob',
      run:()=>({text:P(`Bob desvia o olhar toda vez que você fala o nome do Eros. "Descansa, Wezen." É tudo que ele diz.`)})},
    {label:'Esperar o fim do interrogatório',main:true,run:()=>({go:'b4_resultado'})}
  ]},

b4_resultado:{act:A1+'Cap. 3 · A Base',title:'O que Aline disse',
  text:()=>P(`Mada sai com as mãos lavadas e o rosto fechado. Derick nem sai. "Nada", diz Mada. "Só uma frase. De novo e de novo."

"Luck e Formiga vão acabar com vocês."

Ryan chuta uma cadeira. "Então a gente acaba com eles primeiro. E com o Eros." Todos olham para você.`),
  choices:()=>[
    {label:'Defender o seu irmão',test:{sk:'Diplomacia',dt:14},
      ok:()=>({text:P(`"Ninguém toca no meu irmão antes de eu ouvir da boca dele." Ryan te encara, mas é o primeiro a desviar.`),go:'b5_alarme'}),
      fail:()=>({text:P(`Ryan te empurra contra a parede. Bob o segura. Ninguém te defende.`)+loseSan('1d2','a humilhação'),go:'b5_alarme'})},
    {label:'Ficar calada',run:()=>({text:P(`Você fica calada. Roger Jr quebra o silêncio, sem levantar a voz: "Se ela está tão confiante, é porque a Base já está comprometida."`),go:'b5_alarme'})}
  ]},

b5_alarme:{act:A1+'Cap. 3 · A Base',title:'Alarme',
  text:()=>P(`No segundo em que Roger Jr termina a frase, as luzes ficam vermelhas e a sirene da Base dispara. Todo mundo corre para um lado.

Dez minutos de busca. Nada. Nenhuma porta arrombada, nenhuma câmera com imagem.

Quando se reúnem de novo, Derick fica pálido. "A Aline."`),
  choices:()=>[
    {label:'Correr até a cela',main:true,run:()=>({go:'b6_cela'})}
  ]},

b6_cela:{act:A1+'Cap. 3 · A Base',title:'Cela vazia',
  text:()=>P(`A cela está vazia. As algemas estão abertas, não quebradas. Alguém tinha a chave.

Roger Jr sobe correndo até o bar, sozinho. Volta branco. "A Judite."

Ela está atrás do balcão, sentada, as mãos no colo. A pele toda cinza, como cimento. Os olhos abertos. Só ela abria a passagem por cima.`),
  choices:()=>[
    {label:'Olhar para o corpo',test:{sk:'Vontade',dt:14},
      ok:()=>({text:P(`Você se obriga a olhar. Nenhum ferimento. Só símbolos pequenos, desenhados a unha na palma das mãos. Ritual.`)+(S.susp.rjr?P(`E Roger Jr foi o único que subiu. Sozinho.`):''),go:'b7_divisao'}),
      fail:()=>({text:P(`Você vira o rosto e vomita no chão do bar.`)+loseSan('1d4','Judite'),go:'b7_divisao'})}
  ]},

b7_divisao:{act:A1+'Cap. 3 · A Base',title:'Três caminhos',
  text:()=>P(`Roger decide em trinta segundos. Equipe Thomas protege a Base. Equipe Bob volta ao hospital para investigar a outra saída do subsolo. E a Equipe Mada, com você, segue o rastreador que Derick escondeu na roupa de Aline durante o interrogatório.

O ponto no mapa para de se mexer. Derick amplia. Você reconhece a rua antes dele.

"Isso é..." "A minha casa", você diz. "A Mansão Wezen."`),
  choices:()=>[{label:'Partir com Mada, Derick, Leon e Jon',main:true,run:()=>({go:'m1_vigia'})}]},

/* ---------------- CAP 4 · MANSÃO ---------------- */
m1_vigia:{act:A1+'Cap. 4 · Mansão Wezen',title:'A casa',checkpoint:true,
  text:()=>P(`Seis anos. O portão ainda tem a fita amarela da polícia, desbotada até ficar branca. A cozinha, onde a sua mãe fazia o macarrão de domingo, está às escuras. Você conhece cada janela. Cada rangido.

Vocês vigiam por uma hora. Leon e Jon, os dois ex-militares de Roger, cobrem os flancos sem que ninguém peça.`),
  choices:()=>[
    {once:'vigiar',label:'Vigiar as janelas com atenção',test:{sk:'Percepção',dt:14,ctx:['distante']},
      ok:()=>({text:P(`No segundo andar, no escritório do seu pai, uma luz se acende e se apaga. E você jura ter visto algo passar na frente dela. Algo grande, andando de quatro.`)}),
      fail:()=>({text:P(`Uma hora de janelas escuras. Nada se mexe. Isso é o que mais te assusta.`)})},
    {once:'obs_m',label:'Observar Leon e Jon',test:{sk:'Intuição',dt:15},
      ok:()=>({text:P(`Leon olha mais para Mada do que para a casa. Jon ajusta a mira do fuzil, e a mira passa pelas costas de Mada antes de voltar para a janela.`)+susp('leon','a vigia')+susp('jon','a vigia')}),
      fail:()=>({text:P(`Dois profissionais fazendo o trabalho. Nada mais.`)})},
    {label:'Entrar pela porta da frente',main:true,run:()=>({text:P(`A porta está destrancada. Leon entra primeiro, como sempre. Do teto do hall, algo despenca em cima dele.`),combat:{id:'besta_sangue',after:'m2_revelacao',allies:['mada','derick','leon','jon'],winText:'A Besta tomba no meio do hall, sobre o tapete da sua mãe.'}})}
  ]},

m2_revelacao:{act:A1+'Cap. 4 · Mansão Wezen',title:'O que caiu do bolso',
  text:()=>P(`Do que restou do roupão, cai um porta-retratos pequeno. Vidro rachado. Uma foto de família: seu pai, sua mãe, Eros, você.

O roupão de seda era o do seu pai. A aliança no que sobrou da mão também.

A Besta de Sangue era Frederick Wezen.`),
  choices:()=>[
    {label:'Fechar os olhos do seu pai',test:{sk:'Vontade',dt:15},
      ok:()=>({text:P(`Suas mãos tremem, mas você faz. Mada fica de pé ao seu lado sem dizer nada, e isso é tudo o que você precisava.`)+bond('mada')+loseSan('1d3','seu pai'),go:'m2b_casa'}),
      fail:()=>({text:P(`Você não consegue chegar perto. Senta no degrau da escada com a foto no colo e não chora. Não aqui. Não na frente deles.`)+loseSan('1d6','seu pai'),go:'m2b_casa'})}
  ]},

m2b_casa:{act:A1+'Cap. 4 · Mansão Wezen',title:'Os parentes',
  text:()=>P(`Pelos corredores, zumbis de sangue menores. Derick e Mada cuidam deles rápido, quase em silêncio. Cada um carrega no peito, cravado na carne, o brasão da família Wezen. Tios. Primos. A sua avó.

Você pega um dos brasões do chão. Não sabe por quê. Guarda no bolso.`)+addClue('brasao'),
  choices:()=>[{label:'Subir ao escritório do seu pai',main:true,run:()=>({go:'m3_escritorio'})}]},

m3_escritorio:{act:A1+'Cap. 4 · Mansão Wezen',title:'O escritório',
  text:()=>P(`O armário de livros está destruído, e atrás dele há uma porta de aço com um teclado. Em cima do teclado, alguém prendeu uma foto com fita.`)+addClue('foto')+P(`No visor: "SENHA: O TERCEIRO".`)+
    (S.flags.senha_erros?P(`Tentativas erradas: ${S.flags.senha_erros}/3.`):''),
  choices:()=>[
    {input:{placeholder:'Senha'},label:'Digitar',
      run:v=>{const ok=(v||'').trim().toUpperCase()==='SKART';
        if(ok)return {text:P(`"Skart." A porta destrava. Por um segundo você tem sete anos de novo, com o gato no colo e o braço inteiro.`)+bond('derick'),go:'m4_tunel'};
        S.flags.senha_erros=(S.flags.senha_erros||0)+1;
        if(S.flags.senha_erros>=3)return {text:P(`O teclado trava. Derick suspira, corta a palma e desenha um símbolo na porta. O aço estala e cede, com um estrondo que acorda a casa inteira.`)+losePv('1d4','os estilhaços'),go:'m4_tunel'};
        return {text:P(`O visor pisca vermelho.`)}}},
  ]},

m4_tunel:{act:A1+'Cap. 4 · Mansão Wezen',title:'O túnel',
  text:()=>P(`Um túnel de concreto, largo o bastante para um carro, sai do porão da mansão em linha reta. Vocês andam dez minutos no escuro até a lanterna de Derick encontrar o primeiro corpo.

Luna, sentada contra a parede, com a pele toda cinza. Ryan, alguns metros à frente, cheio de facadas e com o rosto afundado. E Bob. Três cortes paralelos, do ombro ao quadril.

Mada se ajoelha ao lado do irmão mais novo. Não faz barulho nenhum.`),
  choices:()=>[
    {once:'luto',label:'Ficar ao lado de Mada',test:{sk:'Vontade',dt:16},
      ok:()=>({text:P(`Você se ajoelha também. Não fala nada. Depois de um minuto, ele encosta o ombro no seu.`)+bond('mada')+loseSan('1d3','a Equipe Bob')}),
      fail:()=>({text:P(`Você tenta, mas a imagem de Luna segurando sua mão ontem não sai da sua cabeça.`)+loseSan('1d6','a Equipe Bob')})},
    {once:'exame',label:'Examinar os ferimentos',test:{sk:'Medicina',dt:13},
      ok:()=>({text:P(`Facadas e golpes de nunchaku em Ryan: Luck. A pele cinza em Luna: o mesmo ritual de Judite. E Bob...`)+addClue('ferimentos')}),
      fail:()=>({text:P(`Você não consegue olhar por tempo suficiente.`)+loseSan('1d3','os corpos')})},
    {label:'"A gente precisa ir", diz Derick',main:true,run:()=>({go:'m5_hospital'})}
  ]},

m5_hospital:{act:A1+'Cap. 4 · Mansão Wezen',title:'De volta ao começo',
  text:()=>P(`O túnel termina numa escada. Vocês sobem e saem no subsolo do hospital. As celas estão abertas. Vazias. Nem sinal de Aline, Luck, Formiga. Nem do seu irmão.

Jon coça o queixo. "Mansão, hospital, túnel. Eles estão brincando com a gente enquanto o alvo de verdade é outro." Uma pausa longa demais. "A Base."`),
  choices:()=>[{label:'Sair do hospital',main:true,run:()=>({go:'m6_traicao'})}]},

m6_traicao:{act:A1+'Cap. 4 · Mansão Wezen',title:'O estacionamento',
  text:()=>P(`O estacionamento está vazio, exceto pelo carro do Bob. Mada vai na frente. Jon fica três passos atrás dele. Leon, ao seu lado.

Você ouve o clique de uma trava de segurança.`),
  choices:()=>{
    const warned=S.susp.jon||S.susp.leon;
    const arr=[];
    if(warned)arr.push({label:'Gritar "MADA!" antes do tiro',run:()=>{S.flags.avisou=true;return {text:P(`Mada já está girando antes do seu grito terminar. A katana sobe e a bala de Jon ricocheteia no aço com uma faísca. Ele te olha por um instante: você sabia. Ele também.`)+bond('mada',2),go:'m6b_traicao'}}});
    arr.push({label:'Virar para olhar',run:()=>({text:P(`O tiro de Jon sai. Mada, que já desconfiava, gira e rebate a bala com a katana. A faísca ilumina o rosto de Jon. Ele nem parece surpreso.`),go:'m6b_traicao'})});
    return arr;
  }},

m6b_traicao:{act:A1+'Cap. 4 · Mansão Wezen',title:'Traição',
  text:()=>P(`Leon saca a pistola e aponta para Derick. "Nada pessoal, garoto."

Mada fica entre os dois e os agentes. A voz dele não sobe nem um tom. "Derick. Pega a Koranna e leva ela no carro do Bob. Agora."

"Mada..." "AGORA."`),
  choices:()=>[
    {once:'ficar',label:'"Eu fico e luto com você"',
      run:()=>({text:P(`"Você ainda não sabe lutar", ele diz, sem tirar os olhos de Jon. "Vai. Se eu não voltar, cuida dele."`)+bond('mada')})},
    {label:'Correr para o carro',main:true,test:{sk:'Atletismo',dt:12},
      ok:()=>({text:P(`Você corre abaixada. Derick já está com o motor ligado.`),go:'m7_fuga'}),
      fail:()=>({text:P(`Leon atira na sua direção. A bala abre sua coxa de raspão.`)+losePv('1d8','o tiro de Leon'),go:'m7_fuga'})}
  ]},

m7_fuga:{act:A1+'Cap. 4 · Mansão Wezen',title:'Fuga',
  text:()=>P(`Derick dirige com as duas mãos cravadas no volante. No retrovisor, os disparos no estacionamento ficam pequenos até sumir. Ele não fala. Os dedos dele estão brancos.`),
  choices:()=>[
    {label:'Conversar com Derick',run:()=>{S.flags.sabe_traidor=true;return {text:P(`"Ele vai voltar", você diz. "Ele sempre volta", Derick responde rápido demais. Depois, mais baixo: "Eu não sei fazer nada sem ele. Nada." Vocês ficam em silêncio. Então ele franze a testa. "Jon e Leon foram recrutados pelo Roger. Pessoalmente. Koranna... se tinha dois lá fora, pode ter mais lá dentro."`)+bond('derick'),go:'m8_base'}}},
    {label:'Ficar em silêncio',run:()=>({text:P(`Você olha pela janela. A cidade passa em borrões de luz amarela.`),go:'m8_base'})}
  ]},

m8_base:{act:A1+'Cap. 4 · Mansão Wezen',title:'A Base',
  text:()=>P(`A estante de vinhos está afastada. A passagem, aberta.

Lá embaixo, o silêncio tem cheiro. Thomas, caído no corredor, ainda segurando a pistola. Roger, na própria cadeira. Jade e Lipe, juntos, um por cima do outro. A ala médica inteira. A prisão inteira.

E no fim do corredor, de luvas, arrastando um corpo para dentro de uma sala, organizado como sempre: Roger Jr.`)+((S.flags.sabe_traidor||S.susp.rjr)?P(`Você entende antes do Derick. Você já esperava. Sua mão já está na arma.`):''),
  choices:()=>[
    {label:'Ver os corpos',test:{sk:'Vontade',dt:16},
      ok:()=>({text:loseSan('1d4','a Base'),go:'m8b_rjr'}),
      fail:()=>({text:loseSan('2d4','a Base'),go:'m8b_rjr'})}
  ]},

m8b_rjr:{act:A1+'Cap. 4 · Mansão Wezen',title:'Roger Jr',
  text:()=>P(`Ele larga o corpo e ajeita as luvas. "Eu nunca escolhi nada nessa vida. Nem o nome." Um sorriso educado. "Agora escolhi."

Derick fica na sua frente, com as mãos já sangrando para o ritual. Você sabe que não tem chance. Mas se cair, o Derick cai junto.`),
  choices:()=>[{label:'Lutar',main:true,run:()=>({combat:{id:'roger_jr',after:'m9_van',allies:['derick'],script:'rogerjr',noDeath:true,surprise:!!(S.flags.sabe_traidor||S.susp.rjr)}})}]},

m9_van:{act:A1+'Cap. 4 · Mansão Wezen',title:'A van',
  text:()=>P(`Mada e Derick costuram um ao outro na ala médica vazia. Depois, cuidam de você. Depois, um por um, garantem que nenhum corpo da Base vá se levantar. Mada tira o relógio do pulso de Thomas e coloca no próprio.

Três pessoas saem de uma Base que tinha quarenta. Uma van sem placa. Nenhum destino.

Na estrada, Derick pergunta como ele venceu Jon e Leon. Mada demora para responder. "Eu duvidei. Achei que ia morrer." Ele olha para Derick pelo retrovisor. "Mas não daquele jeito. E não ia te deixar sozinho." Derick começa a chorar.`),
  choices:()=>[
    {label:'Segurar a mão de Derick',run:()=>({text:P(`Ele aperta de volta, forte, e não solta até dormir.`)+bond('derick')+calm(2),levelup:'a5_apto'})},
    {label:'Olhar pela janela e deixar ele chorar',run:()=>({text:P(`Você aprendeu cedo que certas coisas não se interrompem.`),levelup:'a5_apto'})}
  ]},

/* ---------------- ATO II · CAP 5 ---------------- */
a5_apto:{act:A2+'Cap. 5 · Meses depois',title:'O apartamento',checkpoint:true,
  text:()=>P(`Meses. Um apartamento num prédio abandonado, emprestado por alguém do passado do Mada. Colchões no chão, um mapa na parede cheio de alfinetes que não levam a lugar nenhum. A nova Equipe Mada: três pessoas.

Toda manhã, treino. Lança, pistola, queda, levantar. Mada não pega leve. Hoje ele está de bom humor, o que é pior.`),
  choices:()=>[
    {once:'treino_l',label:'Treino de lança contra a katana de madeira',test:{sk:'Luta',dt:15},
      ok:()=>({text:P(`Você finta, gira e encosta a ponta no pescoço dele. Ele sorri. "Finalmente."`)+bond('mada')}),
      fail:()=>({text:P(`Você acaba no chão pela sexta vez. "De novo", ele diz, estendendo a mão.`)})},
    {once:'treino_p',label:'Treino de tiro no terraço',test:{sk:'Pontaria',dt:14},
      ok:()=>({text:P(`Cinco latas, cinco tiros. Derick aplaude do parapeito, de pijama.`)+bond('derick')}),
      fail:()=>({text:P(`O vento leva metade dos tiros. Derick finge que não viu.`)})},
    {label:'"VT e Kavyur responderam", grita Derick do corredor',main:true,run:()=>({go:'a5_aeroporto'})}
  ]},

a5_aeroporto:{act:A2+'Cap. 5 · Meses depois',title:'Sob o aeroporto',
  text:()=>P(`Um hangar desativado, um elevador de carga, e sessenta metros para baixo: uma base maior do que a antiga Base da Ordem inteira. VT, loiro, de bermuda e fuzil M4 no ombro, abraça Mada como um irmão. Kavyur, moreno, fica mais atrás, observando você sem piscar.

Café, pão de queijo, e histórias: VT treinou os três irmãos Zart antes da Ordem. Eles escolheram a Ordem em vez dele. Ele ainda finge que não se importa.

"Pega o que precisar no arsenal", diz VT. "Aqui a regra é outra."`),
  choices:()=>[{label:'Abrir o arsenal de VT',main:true,run:()=>({arsenal:{next:'a5_revelacao',patente:'operador'}})}]},

a5_revelacao:{act:A2+'Cap. 5 · Meses depois',title:'Conversas reservadas',
  text:()=>P(`VT chama Mada para uma sala e fecha a porta. Kavyur fica com você e com Derick. Mada pediu para ele manter a pistola apontada para você a conversa toda. "Nada pessoal", diz Kavyur. "Ele confia pouco. Eu confio menos."`),
  choices:()=>[
    {once:'ouvir_vt',label:'Tentar ouvir a conversa de VT e Mada',test:{sk:'Furtividade',dt:15},
      ok:()=>{S.flags.ouviu_vt=true;return {text:P(`"...o Eros não sabia que ela estava viva, Mada. Ele achava que tinha deixado a irmã morrer. Procurou aqueles três para trazer ela de volta com ritual. Eles usaram isso." Você cobre a boca com a mão.`)+loseSan('1d4','a verdade')}},
      fail:()=>({text:P(`Kavyur estala a língua e balança a pistola. "Senta."`)})},
    {once:'kavyur',label:'Conversar com Kavyur',
      run:()=>({text:P(`Ele conta sem rodeio: estudava o paranormal, se meteu com um grupo que queria criar uma criatura. Todos morreram. Os Zart chegaram no último segundo. Você conta a sua história em troca. Quando termina, ele abaixa a pistola. Só um pouco.`)+bond('kavyur')+calm(2)})},
    {label:'Ir embora com Mada e Derick',main:true,run:()=>({go:'a5_volta'})}
  ]},

a5_volta:{act:A2+'Cap. 5 · Meses depois',title:'A estrada',
  text:()=>P(`No carro, Mada conta tudo. Eros não sabia que você estava viva. Ele tentou te trazer de volta. Foi manipulado. Jon, Leon e Roger Jr agiam por ambição, querendo tomar a Ordem. E Eros sumiu do próprio grupo que o usava, sem deixar rastro.${S.flags.ouviu_vt?' Você já sabia, mas ouvir de novo não dói menos.':''}

Você chora. Na frente deles. Derick passa para o banco de trás e te abraça sem dizer nada. Mada dirige em silêncio.

Meia hora depois, ele para num posto. "Janta. Você escolhe."`),
  choices:()=>[
    {label:'Pizza',run:()=>({text:P(`Pizza de calabresa no capô da van, às onze da noite. Derick diz que era exatamente o que ele ia escolher.`)+calm(3),go:'a5_noite'})},
    {label:'Hambúrguer',run:()=>({text:P(`Hambúrguer de posto, gordura escorrendo até o cotovelo. Derick diz que era exatamente o que ele ia escolher.`)+calm(3),go:'a5_noite'})}
  ]},

a5_noite:{act:A2+'Cap. 5 · Meses depois',title:'Madrugada',
  text:()=>P(`Você deita. Pela porta entreaberta, a luz da cozinha. Mada e Derick conversam baixo.`),
  choices:()=>[
    {label:'Dormir',run:()=>{const b=S.san;S.san=Math.min(S.sanMax,S.san+d(4));return {text:P(`Pela primeira vez em meses, você dorme sem sonhar.`)+`<p class="gain">+${S.san-b} Sanidade</p>`,levelup:'a6_tunel'}}},
    {label:'Ficar escutando',test:{sk:'Furtividade',dt:12},
      ok:()=>{S.flags.noite=true;return {text:P(`"Eu desconfiava do Thomas", diz Mada. "Do meu irmão. Enquanto os três traidores estavam do meu lado." Derick: "Você não tinha como saber. Foca no agora." E depois: "O Eros sumir vivo do grupo? Duvido. Eles usaram o Luck de cobaia. Podem ter usado ele." Silêncio. "Amanhã a gente volta pro túnel."`)+loseSan('1d3','a dúvida'),levelup:'a6_tunel'}},
      fail:()=>({text:P(`O piso range. A conversa para. Você finge dormir até dormir de verdade.`),levelup:'a6_tunel'})}
  ]},

/* ---------------- CAP 6 · O TÚNEL ---------------- */
a6_tunel:{act:A2+'Cap. 6 · O túnel',title:'De volta ao escuro',checkpoint:true,
  text:()=>P(`Vocês descem direto pelo escritório do seu pai. O túnel está mais frio do que você lembrava. Os corpos da Equipe Bob já não estão lá.

Três vozes à frente. Uma fogueira. Aline, afiando a espada. Luck, girando o nunchaku. Formiga, desenhando no chão com o dedo.

Luck vê vocês primeiro e abre um sorriso enorme. "Voltaram pro lugar onde o irmãozinho morreu, Mada?"

Mada vai em Luck. Derick vai em Formiga. E Aline vem em você.`),
  choices:()=>[{label:'Enfrentar Aline',main:true,run:()=>({combat:{id:'aline2',after:'a6_enpap',script:'aline2',noDeath:true}})}]},

a6_enpap:{act:A2+'Cap. 6 · O túnel',title:'Enpap-X',

a6_frasco:{act:A2+'Cap. 6 · O túnel',title:'O frasco',

a6_celular:{act:A2+'Cap. 6 · O túnel',title:'O celular',

/* ---------------- CAP 7 · A FÁBRICA ---------------- */
a7_caminho:{act:A2+'Cap. 7 · A fábrica',title:'Zona industrial',checkpoint:true,

a7_fabrica:{act:A2+'Cap. 7 · A fábrica',title:'A fábrica abandonada',
  text:()=>P(`Chaminés apagadas, telhado de amianto. Mada vai sozinho pela direita. Você e Derick, pela esquerda. A primeira barreira: uma escada de ferro enferrujada até uma passarela.`),

a7_tabuas:{act:A2+'Cap. 7 · A fábrica',title:'A janela',
  text:()=>P(`No fim da passarela, uma janela pregada com tábuas. Por uma fresta, você vê uma sala cheia de figuras de pé, imóveis, feitas de ossos cobertos de uma gosma preta. Esqueletos de Lodo. Dezenas.`),

a7_aranha_pre:{act:A2+'Cap. 7 · A fábrica',title:'Oito patas',

a7_tiros:{act:A2+'Cap. 7 · A fábrica',title:'Tiros',

a7_docs:{act:A2+'Cap. 7 · A fábrica',title:'O subsolo',

a7_confronto:{act:A2+'Cap. 7 · A fábrica',title:'A cápsula',
  text:()=>P(`Uma sala enorme, com o teto a vinte metros. No centro, uma cápsula de vidro cheia de Lodo. Dentro dela, desacordado, magro, o olho esquerdo branco: Eros.

Formiga mexe num painel ao lado dela. Na frente dele, uma criatura magra de Lodo, com um crânio humano apodrecido por dentro: um Carniçal. E contra ela, Mada, VT e Kavyur. Kavyur está no chão, sangrando muito.

    {label:'"Solta o meu irmão, Formiga"',

a7_carnicais:{act:A2+'Cap. 7 · A fábrica',title:'Três',

Três. VT grita para recuar. Mada olha para você. Derick olha para você.

Atrás de Formiga, o Lodo começa a borbulhar dentro da cápsula do Eros.`),
  choices:()=>[
    {label:'"Eu não vou abandonar ele de novo."',main:true,

a7_formiga:{act:A2+'Cap. 7 · A fábrica',title:'Felipe',

a7_felipe:{act:A2+'Cap. 7 · A fábrica',title:'Sem propósito',

      fail:()=>({text:P(`Ele sorri e aperta um último botão. Você golpeia. Tarde demais.`),go:'a7_eros'})}
  ]},

a7_eros:{act:A2+'Cap. 7 · A fábrica',title:'Corre',
  text:()=>P(`A cápsula libera o Lodo de uma vez. Eros abre os olhos. O olho bom encontra o seu através do vidro.

Ele te reconhece. Você vê isso acontecer no rosto dele: seis anos achando que você estava morta, desmoronando num segundo.

"Ko... ranna?" As lágrimas descem pretas. "Corre."

O vidro explode. O corpo dele se abre em Lodo. Os três Carniçais correm até ele, e se fundem. Leon, Jon, Roger Jr. E, no centro, o seu irmão.`),
  choices:()=>[{label:'Não correr',main:true,run:()=>({combat:{id:'besta_carnical',after:'e_semana',allies:['mada','derick','vt','kavyur'],allyRate:.55,script:'besta'}})}]},

e_ordem:{act:'Epílogo',title:'A nova Ordem',

Tuninho Jr Silva, vinte e um anos, de Xique-Xique, óculos tortos e cabelo avermelhado. Já foi do grupo de Formiga. Ficou preso na base de VT até pedir, ele mesmo, para mudar de lado. E Maitê Lima, alta, casaco branco de gola alta, retocando o batom vinho, historiadora que nunca chegou a ser.

/* ================= RENDER ================= */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const $=id=>document.getElementById(id);

function applyInsanity(){
  const v=S&&S.cls&&S.sanMax?Math.max(0,1-S.san/S.sanMax):0;
  document.documentElement.style.setProperty('--insan',(v*v).toFixed(3));
}
function whispers(html){
  if(!S.cls||S.san/S.sanMax>.3)return html;
  const w=['VOCÊ SAIU DE CASA','ELE TE DEIXOU','OITO PATAS','A CULPA É SUA','SKART'];
  return html.replace(/<\/p>/,`</p><span class="whisper">${w[d(w.length)-1]}</span>`);
}

function renderMini(){
  const m=$('mini');
  if(!S||!S.cls){m.innerHTML='';return}
  m.innerHTML=`<span style="color:var(--pv)">PV <b>${S.pv}</b></span><span style="color:var(--pe)">PE <b>${S.pe}</b></span><span style="color:var(--san)">SAN <b>${S.san}</b></span>`;
}
function meter(cls,l,v,max){return `<div class="meter ${cls}"><span class="l">${l}</span><span class="bar"><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></span><span class="v">${v}/${max}</span></div>`}

function renderSheet(){
  renderMini();applyInsanity();
  const sh=$('sheet');
  const inGame=S&&S.cls&&S.inv&&!['title','create'].includes(S.screen);
  $('layout').classList.toggle('nosheet',!inGame);
  if(!inGame){sh.innerHTML='';return}
  const c=CLASSES[S.cls],w=equipped(),st=wStats(w),ar=curArmor();
  const inCombat=S.screen==='combat';
  const canAct=!busy&&!inCombat&&S.screen==='game';
  const cap=capacity(S.attr.FOR,S.inv),used=spacesUsed(S.inv);
  const add=st.addAttr&&S.attr[st.addAttr]?'+'+S.attr[st.addAttr]:'';
  sh.innerHTML=`
  <h2 class="sh-name">${esc(S.name)}</h2>
  <div class="sh-sub">${c.name} · ${ORIGINS[S.origin]?.name??S.origin}</div>
  <div class="nex">NEX <b>${S.nex}%</b> · ${PATENTE.name}</div>
  <div class="meters">${meter('pv','PV',S.pv,S.pvMax)}${meter('pe','PE',S.pe,S.peMax)}${meter('san','SAN',S.san,S.sanMax)}</div>
  <div class="attrs">${ATTRS.map(a=>`<div class="attr" title="${ATTR_INFO[a][0]}"><b>${S.attr[a]}</b><span>${a}</span></div>`).join('')}</div>
  <div class="kv"><span>Defesa</span><span>${defense()}${S.combat&&S.combat.defBuff?` (+${S.combat.defBuff})`:''}</span></div>
  ${ar.rd?`<div class="kv"><span>Resistência a dano</span><span>RD ${ar.rd}</span></div>`:''}
  <div class="kv"><span>Deslocamento</span><span>9 m</span></div>
  <div class="kv"><span>Carga</span><span>${used}/${cap} espaços</span></div>
  <div class="kv"><span>DT rituais · itens</span><span>${ritualDT()} · ${itemDT()}</span></div>
  <div class="sh-h"><span>Empunhando</span></div>
  <div class="kv"><span>${esc(st.name)}</span><span>${st.skill} · ${st.n+st.extraDice}d${st.s}${add}${st.dmgB?'+'+st.dmgB:''} · ${critStr([st.margin,st.mult])}${st.prof?'':' · sem prof.'}</span></div>
  ${ar.names.length?`<div class="kv"><span>${ar.names.join(' + ')}</span><span>+${ar.def} Def${ar.heavy?' · carga −5':''}${ar.nonprof?' · sem prof.':''}</span></div>`:''}
  <div class="sh-h"><span>Poder de classe</span></div>
  <div style="font-size:13.5px"><b>${c.power}${S.power?' +'+S.power:''}.</b> <span style="color:var(--muted)">${c.powerDesc}</span></div>
  <div class="sh-h"><span>Inventário</span><span>${used}/${cap} esp.</span></div>
  <div class="item"><span>Primeiros socorros <small class="dim">Medicina DT 15</small></span><button class="sbtn" data-a="treat" ${!canAct||!S.treatReady||S.pv>=S.pvMax?'disabled':''}>${S.treatReady?'Tratar':'Após luta'}</button></div>
  ${S.inv.map(i=>{const it=ITEMS[i.id];const isW=!!it.dmg;const eq=S.equip===i.uid;
    const tags=[];if(i.mods.length)tags.push(i.mods.map(m=>MODS[m].name).join(', '));
    if(i.cenas!=null&&it.cenas<99)tags.push(`${i.cenas} cena${i.cenas>1?'s':''}`);if(i.charges!=null)tags.push(`×${i.charges}`);
    if(it.pick==='skill')tags.push(`+${i.mods.includes('aprimorado')?5:2} ${i.skill}`);if(i.kitSkill)tags.push(`kit ${i.kitSkill}`);if(i.skill2)tags.push(`+2 ${i.skill2}`);
    return `<div class="item"><span>${it.name} <small class="dim">${CAT[itemCat(i)]}${tags.length?' · '+tags.join(' · '):''}</small></span>
      ${isW?`<button class="sbtn" data-a="equip" data-id="${i.uid}" ${eq||!canAct?'disabled':''}>${eq?'Em mãos':'Empunhar'}</button>`:''}
      ${i.id==='cicatrizante'?`<button class="sbtn" data-a="use-out" data-id="${i.uid}" ${!canAct||S.pv>=S.pvMax?'disabled':''}>Usar</button>`:''}</div>`}).join('')||'<div class="empty">Mochila vazia.</div>'}
  ${S.equip!=='_desarmado'&&canAct?`<div class="item"><span class="dim">Desarmado</span><button class="sbtn" data-a="equip" data-id="_desarmado">Guardar arma</button></div>`:''}
  <div class="sh-h"><span>Rituais</span><span>${S.rituals.length}</span></div>
  ${S.rituals.length?S.rituals.map(id=>{const r=RITUALS[id];const usable=['heal','buff'].includes(r.type);
    return `<div class="item"><span>${r.name} <span class="el ${r.el}">${EL_NAME[r.el]}</span></span>${usable?`<button class="sbtn" data-a="castout" data-id="${id}" ${!canAct||S.pe<r.cost?'disabled':''}>${r.cost} PE</button>`:''}</div>`}).join(''):'<div class="empty">Nenhum ritual conhecido.</div>'}
  ${S.cls!=='ocultista'&&S.rituals.length?'<div class="empty">Sem o poder do Ocultista, cada conjuração custa 2 SAN.</div>':''}
  <div class="sh-h"><span>Pistas</span><span>${S.clues.length}/${Object.keys(CLUES).length}</span></div>
  <div class="clues">${S.clues.length?S.clues.map(id=>`<details class="clue"><summary>${CLUES[id].t}</summary><p>${CLUES[id].x}</p></details>`).join(''):'<div class="empty">Nenhuma pista ainda.</div>'}</div>
  <div class="sh-h"><span>Vínculos</span></div>
  ${Object.entries(BOND_NAME).map(([k,n])=>`<div class="kv"><span>${n}</span><span class="bondv">${'◆'.repeat(S.bond[k]||0)||'—'}</span></div>`).join('')}
  ${S.team&&S.team.length?`<div class="sh-h"><span>Equipe do hospital</span></div><div style="font-size:13.5px;color:var(--muted)">${S.team.map(k=>TEAM[k].name).join(', ')}</div>`:''}
  ${Object.keys(S.susp||{}).length?`<div class="sh-h"><span>Suspeitas</span></div>${Object.keys(S.susp).map(k=>`<div class="kv"><span>${TEAM[k].name}</span><span>${typeof S.susp[k]==='string'?S.susp[k]:'comportamento'}</span></div>`).join('')}`:''}

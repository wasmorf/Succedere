  else if(kind==='kav'){const r=await test('Atletismo',15,{label:L('Puxar Kavyur','Pull Kavyur','Sacar a Kavyur')});if(r.ok){S.flags.kavyur_salvo=true;C.kav=true;cline(L('Você agarra Kavyur pela gola e arrasta ele para trás de uma coluna. Ele xinga você de tudo. Mas está longe do fogo.','You grab Kavyur by the collar and drag him behind a pillar. He curses you out. But he\'s away from the fire.','Agarras a Kavyur del cuello de la ropa y lo arrastras detrás de una columna. Te insulta de todo. Pero está lejos del fuego.'),'good')}else cline(L('Kavyur se solta de você, cego de ódio, e volta para a Besta.','Kavyur tears free of you, blind with hatred, and goes back at the Beast.','Kavyur se te suelta, ciego de odio, y vuelve contra la Bestia.'))}

    else cline(strip(loseSan('1d4',L('a hesitação','hesitation','la duda')))+L('. Você vê o rosto dele no Lodo e o golpe para no ar.','. You see his face in the Sludge and the blow stops midair.','. Ves su rostro en el Lodo y el golpe se detiene en el aire.'),'hit');
  }

function switchWeapon(uid){
  if(busy||!S.combat)return;
  const target=weaponList().find(x=>x.inst.uid===uid);if(!target)return;
  const free=hasItem('bandoleira')||target.inst.mods.includes('tatica_m')||target.inst.mods.includes('tatica_f')||uid==='_desarmado';
  if(free){S.equip=uid;cline(L(`Você saca ${target.it.name} sem perder o ritmo.`,`You draw ${target.it.name} without missing a beat.`,`Desenfundas ${target.it.name} sin perder el ritmo.`),'good');save();return}
  playerAction('switch',uid);
}
async function allyTurn(){
  const C=S.combat,e=C.e;
  for(const id of C.allies){
    if(e.pv<=0)return 'dead';
    const a=ALLIES[id];
    if(id==='derick'&&e.immune&&!(C.cond.exposed>0)){
      if(d(20)+6>=12){const dm=hurt(rollExpr('2d6').total,'fogo');cline(L(`Derick conjura fogo de sangue. O Lodo ferve e a Aracnasita guincha (${dm} de dano). Ela está exposta!`,`Derick conjures blood fire. The Sludge boils and the Arachnasite shrieks (${dm} damage). It's exposed!`,`Derick conjura fuego de sangre. El Lodo hierve y la Aracnásita chilla (${dm} de daño). ¡Está expuesta!`),'good')}
      else cline(L('Derick tenta o ritual de fogo, mas a chama morre na mão dele.','Derick tries the fire ritual, but the flame dies in his hand.','Derick intenta el ritual de fuego, pero la llama se apaga en su mano.'));
      continue;
    }
    if(Math.random()>C.allyRate)continue;
    const roll=d(20)+a.atk;
    if(roll>=effDef()){
      if(C.traitorsHold&&a.traitor&&Math.random()<.6){S.flags.aline_hint=true;cline(`${a.name} ${a.miss}.`,'hint');continue}
      const dm=hurt(rollExpr(a.dmg).total,a.type||'fisico');
      cline(`${a.name} ${a.verb}: ${dm} ${L('de dano','damage','de daño')}${absorbed(dm)}.`,'good');
    }else cline(L(`${a.name} ataca e erra.`,`${a.name} attacks and misses.`,`${a.name} ataca y falla.`));
  }
  renderSheet();
  if(e.pv<=0)return 'dead';
}
async function enemyTurn(){
  const C=S.combat,e=C.e,cd=C.cond;
  const tick=()=>{if(cd.cego>0)cd.cego--;if(cd.fumaca>0)cd.fumaca--;if(cd.bloq>0)cd.bloq--;if(cd.exposed>0)cd.exposed--;C.defBuff=0;renderSheet()};
  const shake=()=>{const sc=$('screen');sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')};
  if(cd.chamas>0){const x=hurt(d(6),'fogo');cd.chamas--;cline(L(`${e.name} queima: −${x} PV.`,`${e.name} burns: −${x} HP.`,`${e.name} arde: −${x} PV.`),'good');if(e.pv<=0){tick();return 'dead'}}
  if(cd.atord>0){cd.atord--;cline(L(`${e.name} está atordoado e não age.`,`${e.name} is stunned and doesn't act.`,`${e.name} está aturdido y no actúa.`),'good');tick();return}
  C.defBuff=(C.guard?5:0)+(C.veu>0?5:0);
  const sp=e.special;const due=sp&&C.round%sp.every===0&&cd.bloq<=0;
  if(due&&sp.kind==='hex'){cline(`${sp.name}! ${sp.text} (−1d20)`,'hit');C.hex=1}
  else if(due&&sp.kind==='atk'){
    cline(`${sp.name}! ${sp.text}`,'hit');
    const roll=d(20),tot=roll+e.atk+2,def=defense()+C.defBuff;const hit=roll===20||tot>=def;
    await showRoll({label:sp.name,dice:[roll],kept:roll,bonus:e.atk+2,total:tot,dt:def,ok:hit,enemy:true});
    if(hit){const dmg=Math.max(0,rollExpr(sp.dmg).total-curArmor().rd);S.pv=Math.max(0,S.pv-dmg);cline(L(`Você é atingida em cheio: −${dmg} PV.`,`You take it full on: −${dmg} HP.`,`Recibes el golpe de lleno: −${dmg} PV.`),'hit');shake()}
    else cline(L('Você se joga para o lado no último instante.','You throw yourself aside at the last instant.','Te lanzas a un lado en el último instante.'),'good');
  }else if(due){
    cline(`${sp.name}! ${sp.text}`,'hit');
    const r=await test(sp.skill,sp.dt,{label:sp.name});
    if(r.ok)cline(L('Você aguenta firme.','You hold firm.','Aguantas firme.'),'good');
    else cline(strip(loseSan(sp.san,sp.name)),'hit');
  }else{
    if((cd.fumaca>0||cd.cego>0)&&Math.random()<.5){cline(L(`${e.name} ataca às cegas e erra.`,`${e.name} attacks blindly and misses.`,`${e.name} ataca a ciegas y falla.`),'good');tick();return}
    if(C.allies.length&&Math.random()<.35){const a=ALLIES[C.allies[d(C.allies.length)-1]];const hitA=d(20)+e.atk>=15;cline(hitA?L(`${e.name} acerta ${a.name}, que recua ferido.`,`${e.name} hits ${a.name}, who staggers back wounded.`,`${e.name} golpea a ${a.name}, que retrocede herido.`):L(`${e.name} ataca ${a.name}, que desvia.`,`${e.name} attacks ${a.name}, who dodges.`,`${e.name} ataca a ${a.name}, que esquiva.`),hitA?'hit':'');tick();return}
    const pen=cd.ofusc>0?5:0;if(cd.ofusc>0)cd.ofusc--;
    const roll=d(20),tot=roll+e.atk-pen,def=defense()+C.defBuff;
    const hit=roll===20||tot>=def;
    await showRoll({label:`${e.name} ${L('ataca','attacks','ataca')}${pen?' (−5)':''}`,dice:[roll],kept:roll,bonus:e.atk-pen,total:tot,dt:def,ok:hit,enemy:true});
    if(hit){
      const dr=rollExpr(e.dmg,roll===20?2:1);const rd=curArmor().rd;const dmg=Math.max(0,dr.total-rd);
      S.pv=Math.max(0,S.pv-dmg);
      cline(`${roll===20?L('Crítico! ','Critical! ','¡Crítico! '):''}${L(`${e.name} te acerta: −${dmg} PV`,`${e.name} hits you: −${dmg} HP`,`${e.name} te golpea: −${dmg} PV`)}${rd?` (${L('RD','DR','RD')} ${rd})`:''}.`,'hit');log(`${e.name}: −${dmg}`);shake();
    }else cline(L(`${e.name} ataca e erra.`,`${e.name} attacks and misses.`,`${e.name} ataca y falla.`));
  }
  tick();
}
function winCombat(custom){
  const C=S.combat;const after=C.after;
  let txt=custom||C.winText||L('O inimigo cai.','The enemy falls.','El enemigo cae.');
  if(C.ko&&!custom)txt=L('O inimigo está fora de combate.','The enemy is out of the fight.','El enemigo está fuera de combate.');
  S.combat=null;S.treatReady=true;
  S.screen='game';S.scene=after;S.outcome=`<p>${txt}</p>`;S.outcomeCls='ok';
  if(SCENES[after]&&SCENES[after].checkpoint)setCheckpoint();
  save();render();window.scrollTo(0,0);
}
async function combatEnd(dead){
  const C=S.combat;if(!C)return true;
  if(C.noDeath&&S.pv<=0){S.pv=1;const r=SCRIPTS[C.script].end(C,'down');busy=false;winCombat(r);return true}
  if(checkDown())return true;
  if(dead||C.ko||C.e.pv<=0){busy=false;const r=C.script&&SCRIPTS[C.script].end?SCRIPTS[C.script].end(C,'win'):null;winCombat(r||undefined);return true}
  if(C.script&&SCRIPTS[C.script].check){const r=SCRIPTS[C.script].check(C);if(r){busy=false;winCombat(r);return true}}
  return false;
}

/* ---------- NEX / interlúdio ---------- */
function startLevel(next){
  S.lvl={next,stage:'nex',opt:null,sub:null,from:S.nex};
  const old={pv:S.pvMax,pe:S.peMax,san:S.sanMax};
  S.nex+=5;recalcMax();
  const g={pv:S.pvMax-old.pv,pe:S.peMax-old.pe,san:S.sanMax-old.san};
  S.pv+=g.pv;S.pe+=g.pe;S.san+=g.san;S.lvl.gains=g;
  S.screen='levelup';S.outcome=null;save();render();window.scrollTo(0,0);
}

    return `<section class="lvl"><div class="act">${L('Exposição paranormal','Paranormal exposure','Exposición paranormal')}</div>

    <div class="nexbig">NEX ${Lv.from}% → <b>${S.nex}%</b></div>
    <div class="gains"><span style="color:var(--pv)">+${Lv.gains.pv} ${PV()}</span><span style="color:var(--pe)">+${Lv.gains.pe} ${L('PE','EP','PE')}</span><span style="color:var(--san)">+${Lv.gains.san} SAN</span></div>
    <p class="lede">${L('Escolha uma evolução:','Choose an upgrade:','Elige una mejora:')}</p>
    <div class="grid" style="margin-top:12px">
      <button class="card ${Lv.opt==='skill'?'sel':''}" data-a="lv-opt" data-id="skill" ${!untrained.length?'disabled':''}><b>${L('Treinar perícia','Train a skill','Entrenar una pericia')}</b><span>${L('Uma perícia nova recebe +5.','A new skill gets +5.','Una pericia nueva recibe +5.')}</span></button>
      <button class="card ${Lv.opt==='rit'?'sel':''}" data-a="lv-opt" data-id="rit" ${!unknown.length?'disabled':''}><b>${L('Aprender ritual','Learn a ritual','Aprender un ritual')}</b><span>${L('Um ritual novo. Sem ser Ocultista, cada conjuração custa 2 SAN.','A new ritual. Since you\'re not an Occultist, each casting costs 2 SAN.','Un ritual nuevo. Al no ser Ocultista, cada lanzamiento cuesta 2 SAN.')}</span></button>
      <button class="card ${Lv.opt==='power'?'sel':''}" data-a="lv-opt" data-id="power" ${cantPower?'disabled':''}><b>${L('Aprimorar','Improve','Mejorar')} ${c.power}</b><span>${L('Perito passa a somar 1d8 em vez de 1d6.','Expert adds 1d8 instead of 1d6.','Perito suma 1d8 en lugar de 1d6.')}</span></button>
    </div>
    ${Lv.opt==='skill'?`<div class="step"><h2>${L('Qual perícia?','Which skill?','¿Qué pericia?')}</h2><div class="chips">${untrained.map(k=>`<button class="chip ${Lv.sub===k?'sel':''}" data-a="lv-sub" data-id="${k}">${sk(k)}<small>${ab(SKILLS[k])}</small></button>`).join('')}</div></div>`:''}
    ${Lv.opt==='rit'?`<div class="step"><h2>${L('Qual ritual?','Which ritual?','¿Qué ritual?')}</h2><div class="grid">${unknown.map(k=>{const r=RITUALS[k];return `<button class="card ${Lv.sub===k?'sel':''}" data-a="lv-sub" data-id="${k}"><b>${r.name}</b><span>${r.desc}</span><small><span class="el ${r.el}">${EL_NAME[r.el]}</span></small></button>`}).join('')}</div></div>`:''}
    <div class="summary"><div style="flex:1"></div><button class="cta" data-a="lv-ok" ${!Lv.opt||(Lv.opt!=='power'&&!Lv.sub)?'disabled':''}>${L('Confirmar','Confirm','Confirmar')}</button></div></section>`;
  }
  return `<section class="lvl"><div class="act">${L('Interlúdio','Interlude','Interludio')}</div>
  <h1 class="scene">${L('Um respiro','A breather','Un respiro')}</h1>
  <p class="lede">${L('Você recupera todos os PE. Como usa o resto do tempo?','You recover all your EP. How do you spend the rest of the time?','Recuperas todos tus PE. ¿Cómo usas el resto del tiempo?')}</p>
  <div class="grid" style="margin-top:16px">
    <button class="card" data-a="rest" data-id="sleep"><b>${L('Dormir','Sleep','Dormir')}</b><span>${L('Recupera metade dos PV máximos.','Recover half your max HP.','Recuperas la mitad de tus PV máximos.')}</span><small>${PV()} ${S.pv}/${S.pvMax}</small></button>
    <button class="card" data-a="rest" data-id="mind"><b>${L('Cuidar da cabeça','Clear your head','Despejar la cabeza')}</b><span>${L(`Recupera 2d4+${S.attr.PRE} de Sanidade.`,`Recover 2d4+${S.attr.PRE} Sanity.`,`Recuperas 2d4+${S.attr.PRE} de Cordura.`)}</span><small>SAN ${S.san}/${S.sanMax}</small></button>
    <button class="card" data-a="rest" data-id="study"><b>${L('Revisar as pistas e reabastecer','Review clues and restock','Revisar las pistas y reabastecerte')}</b><span>${L('+5 no primeiro teste do próximo capítulo, +1 cena em cada pacote de munição e recarrega itens com usos.','+5 on the next chapter\'s first roll, +1 scene on each ammo pack and recharges items with uses.','+5 en la primera tirada del próximo capítulo, +1 escena en cada paquete de munición y recarga objetos con usos.')}</span><small>${S.clues.length} ${L('pistas','clues','pistas')}</small></button>
  </div></section>`;
}
function restChoice(id){
  S.pe=S.peMax;let t='';
  if(id==='sleep'){const h=healPv(Math.ceil(S.pvMax/2));t=L(`Você dorme um sono sem sonhos. +${h} PV.`,`You sleep without dreams. +${h} HP.`,`Duermes sin soñar. +${h} PV.`)}
  if(id==='mind'){const b=S.san;S.san=Math.min(S.sanMax,S.san+rollExpr('2d4').total+S.attr.PRE);t=L(`Por alguns minutos o mundo volta a ser normal. +${S.san-b} SAN.`,`For a few minutes the world is normal again. +${S.san-b} SAN.`,`Por unos minutos el mundo vuelve a ser normal. +${S.san-b} SAN.`)}
  if(id==='study'){S.nextBonus=5;S.inv.forEach(i=>{const it=ITEMS[i.id];if(it.cenas&&it.cenas<99)i.cenas++;if(it.charges)i.charges=it.charges});t=L('Você liga os pontos e reabastece. +5 no próximo teste.','You connect the dots and restock. +5 on your next roll.','Unes los puntos y te reabasteces. +5 en tu próxima tirada.')}
  S.scene=S.lvl.next;S.lvl=null;S.screen='game';S.treatReady=true;
  S.outcome=`<p>${t} ${L('PE restaurados.','EP restored.','PE restaurados.')}</p>`;S.outcomeCls='ok';
  setCheckpoint();save();render();window.scrollTo(0,0);
}

/* ---------- fim ---------- */
function renderEnd(){
  const sanP=S.san/S.sanMax;const B=k=>S.bond[k]||0;
  const bonds=Object.values(S.bond).reduce((a,b)=>a+b,0);const sus=Object.keys(S.susp).length;
  const score=S.clues.length+bonds+sus*2+(sanP>.5?2:0)+(fl('kavyur_salvo')?2:0)+(fl('avisou')?2:0);
  const rank=score>=28?'S':score>=20?'A':score>=13?'B':'C';
  const rankTxt={S:L('Mada diz, sem rodeio, que você é a melhor agente que ele já treinou.','Mada says, flat out, that you\'re the best agent he\'s ever trained.','Mada dice, sin rodeos, que eres la mejor agente que entrenó.'),A:L('Uma agente de verdade. A Ordem renasce em mãos boas.','A real agent. The Order is reborn in good hands.','Una agente de verdad. La Orden renace en buenas manos.'),B:L('Você sobreviveu ao que derrubou uma Ordem inteira.','You survived what brought down an entire Order.','Sobreviviste a lo que derribó a toda una Orden.'),C:L('Você sobreviveu. Por pouco. E ainda tem muito para aprender.','You survived. Barely. And you still have a lot to learn.','Sobreviviste. Por poco. Y todavía tienes mucho que aprender.')}[rank];
  const names=Object.keys(S.susp).map(k=>TEAM[k].name.split(' ')[0]).join(L(' e ',' and ',' y '));
  const Ls=[];
  Ls.push(has('verdade')?L('Você sabe a verdade inteira: o que seu pai fez com dois garotos, por que Aline mudou de lado, e como a esperança do Eros virou a arma deles.','You know the whole truth: what your father did to two boys, why Aline switched sides, and how Eros\'s hope became their weapon.','Sabes toda la verdad: lo que tu padre les hizo a dos chicos, por qué Aline cambió de bando, y cómo la esperanza de Eros se volvió su arma.'):has('frederick')?L('Você leu o bastante para saber que seu pai não era inocente. O resto, o túmulo de Felipe guarda.','You read enough to know your father wasn\'t innocent. The rest is buried with Felipe.','Leíste lo suficiente para saber que tu padre no era inocente. El resto lo guarda la tumba de Felipe.'):L('Muita coisa ficou sem resposta. Às vezes você acorda achando que devia ter lido aqueles papéis.','A lot went unanswered. Sometimes you wake up thinking you should have read those papers.','Mucho quedó sin respuesta. A veces despiertas pensando que debiste leer esos papeles.'));
  Ls.push(L('O último rosto que o Eros viu foi o seu. Ele soube, no fim, que você estava viva. Ele disse para você correr. Você não correu.','The last face Eros saw was yours. In the end, he knew you were alive. He told you to run. You didn\'t.','El último rostro que vio Eros fue el tuyo. Al final supo que estabas viva. Te dijo que corrieras. No corriste.'));
  Ls.push(sus>=3?L('Você desconfiou dos três traidores antes de qualquer um. Mada nunca mais deixa de te ouvir.','You suspected all three traitors before anyone else. Mada never stops listening to you again.','Sospechaste de los tres traidores antes que nadie. Mada nunca vuelve a dejar de escucharte.'):sus>0?L(`Você viu os sinais em ${names} antes da hora. Não o bastante para salvar a Base, mas o bastante para Mada te levar a sério.`,`You saw the signs in ${names} early. Not enough to save the Base, but enough for Mada to take you seriously.`,`Viste las señales en ${names} antes de tiempo. No lo suficiente para salvar la Base, pero sí para que Mada te tome en serio.`):L('A traição te pegou de surpresa, como pegou todo mundo.','The betrayal caught you by surprise, like it did everyone.','La traición te tomó por sorpresa, como a todos.'));
  Ls.push(B('mada')>=5?L('Mada confia em você como confiava nos irmãos.','Mada trusts you the way he trusted his brothers.','Mada confía en ti como confiaba en sus hermanos.'):B('mada')>=3?L('Mada te trata como parte da família que sobrou.','Mada treats you as part of the family that\'s left.','Mada te trata como parte de la familia que queda.'):L('Mada ainda te observa de longe, medindo.','Mada still watches you from a distance, sizing you up.','Mada todavía te observa de lejos, midiéndote.'));
  Ls.push(B('derick')>=4?L('Derick te chama de irmã quando acha que você não está ouvindo.','Derick calls you sister when he thinks you\'re not listening.','Derick te llama hermana cuando cree que no escuchas.'):B('derick')>=2?L('Derick e você viraram a dupla que segura a Base.','You and Derick became the duo holding the Base together.','Derick y tú se volvieron la dupla que sostiene la Base.'):L('Derick é gentil, mas ainda fala mais com o Mada do que com você.','Derick is kind, but he still talks to Mada more than to you.','Derick es amable, pero todavía habla más con Mada que contigo.'));
  Ls.push(fl('kavyur_salvo')?L('Kavyur manda mensagem toda semana. VT, nunca. Mas também nunca desligou o telefone de emergência.','Kavyur texts every week. VT, never. But he never turned off the emergency phone either.','Kavyur escribe cada semana. VT, nunca. Pero tampoco apagó el teléfono de emergencia.'):L('VT cortou relações. Kavyur ainda escreve, escondido.','VT cut ties. Kavyur still writes, in secret.','VT cortó relaciones. Kavyur todavía escribe, a escondidas.'));
  Ls.push(sanP>.6?L('Você dorme bem na maioria das noites.','You sleep well most nights.','Duermes bien la mayoría de las noches.'):sanP>.3?L('Você ainda não consegue ver uma aranha sem sair do cômodo.','You still can\'t see a spider without leaving the room.','Todavía no puedes ver una araña sin salir del cuarto.'):L('Toda noite você sonha com a mesa de domingo. Todas as cadeiras ocupadas por Lodo.','Every night you dream of the Sunday table. Every chair taken by Sludge.','Cada noche sueñas con la mesa del domingo. Todas las sillas ocupadas por Lodo.'));
  return `<section class="lvl"><div class="act">${L('Fim · Ato II','End · Act II','Fin · Acto II')}</div>
  <h1 class="scene">${L('Relatório de agente','Agent report','Informe de agente')}</h1>
  <div class="report"><span class="rank">${rank}</span><h2>Koranna Wezen</h2>
    <p style="font-family:var(--mono);font-size:13px">${CLASSES[S.cls].name} · ${ORIGINS[S.origin]?.name??''} · NEX ${S.nex}% · SAN ${S.san}/${S.sanMax} · ${PV()} ${S.pv}/${S.pvMax}</p>
    ${Ls.map(l=>`<p>${l}</p>`).join('')}
    <p><b>${L('Avaliação','Evaluation','Evaluación')}:</b> ${rankTxt}</p>
    <ul><li>${L('Pistas','Clues','Pistas')}: ${S.clues.length}/${Object.keys(CLUES).length}</li><li>${L('Traidores percebidos antes da hora','Traitors spotted early','Traidores detectados a tiempo')}: ${sus}/3</li><li>${L('Vínculos','Bonds','Vínculos')}: ${bonds}</li><li>${L('Pontuação','Score','Puntuación')}: ${score}</li></ul>
  </div>
  <div class="btns"><button class="cta" data-a="new">${L('Jogar de novo','Play again','Jugar de nuevo')}</button><button class="ghost" data-a="menu">${L('Menu principal','Main menu','Menú principal')}</button></div>
  ${X_LINK}</section>`;
}

/* ================= EVENTOS ================= */
function setLang(l){
  if(!LANG_NAMES[l]||l===LANG)return;
  LANG=l;try{localStorage.setItem(LANG_KEY,l)}catch(e){}
  buildData();render();
}
async function treat(){
  if(busy||!S.treatReady)return;busy=true;render();
  const r=await test('Medicina',15,{label:L('Primeiros socorros','First aid','Primeros auxilios')});
  S.treatReady=false;busy=false;
  if(r.ok){const h=healPv(rollExpr('2d6').total+S.attr.INT);S.outcome=`<p class="gain">${L('Primeiros socorros','First aid','Primeros auxilios')}: +${h} ${PV()}.</p>`;S.outcomeCls='ok'}
  else{S.outcome=`<p>${L('Os curativos não seguram. Você só vai poder tentar de novo depois da próxima luta.','The bandages don\'t hold. You can only try again after the next fight.','Los vendajes no aguantan. Solo podrás intentarlo de nuevo después de la próxima pelea.')}</p>`;S.outcomeCls='fail'}
  save();render();
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  switch(a){
    case 'lang':setLang(id);break;
    case 'new':D=draft();S={screen:'create'};render();window.scrollTo(0,0);break;
    case 'continue':{const sv=loadSave();if(sv){S=sv;busy=false;if(S.screen==='combat'&&!S.combat)S.screen='game';if(S.screen==='arsenal')S.screen='game';render()}break}
    case 'back':case 'menu':if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};render();break;
    case 'origin':{D.origin=id;if(id==='amnesico'){D.rand=Object.keys(SKILLS).sort(()=>Math.random()-.5).slice(0,2)}render();break}
    case 'attr':{D.attr[id]+=+b.dataset.d;const max=dPickCount();if(D.picks.length>max)D.picks=D.picks.slice(0,max);render();break}
    case 'pick':D.picks=D.picks.includes(id)?D.picks.filter(x=>x!==id):[...D.picks,id];render();break;
    case 'start':startGame();break;
    case 'team-toggle':{const sel=S.teamSel||[];S.teamSel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];render();break}
    case 'team-ok':if((S.teamSel||[]).length===3){S.team=S.teamSel;S.screen='game';S.scene='c1_arsenal';S.outcome=null;save();render();window.scrollTo(0,0)}break;
    case 'arsenal-ok':{if(gearProblems(D.inv,D.attr.FOR).length)return;S.inv=D.inv;const l=S.inv.find(i=>i.id==='lanca')||S.inv.find(i=>ITEMS[i.id].dmg);if(!S.inv.some(i=>i.uid===S.equip))S.equip=l?l.uid:'_desarmado';S.scene=S.arsenal.next;S.arsenal=null;S.screen='game';S.outcome=null;if(SCENES[S.scene].checkpoint)setCheckpoint();save();render();window.scrollTo(0,0);break}
    case 'g-add':D.inv.push(newInst(id));render();break;
    case 'g-del':D.inv=D.inv.filter(i=>i.uid!==id);render();break;
    case 'g-moddel':{const i=D.inv.find(x=>x.uid===id);if(i){i.mods=i.mods.filter(m=>m!==b.dataset.mod);if(b.dataset.mod==='funcao')i.skill2=null;if(b.dataset.mod==='instrumental'&&i.id!=='kit')i.kitSkill=null}render();break}
    case 'g-suggest':D.inv=suggestInv(D.cls);render();break;
    case 'g-clear':D.inv=[];render();break;
    case 'choose':choose(+b.dataset.i);break;
    case 'treat':treat();break;
    case 'equip':if(!busy){S.equip=id;save();render()}break;
    case 'use-out':{if(busy)return;const i=S.inv.find(x=>x.uid===id);if(!i)return;S.inv=S.inv.filter(x=>x!==i);const h=healPv(rollExpr('2d8+2').total);log(`${ITEMS.cicatrizante.name}: +${h}`);S.outcome=`<p class="gain">${ITEMS.cicatrizante.name}: +${h} ${PV()}.</p>`;S.outcomeCls='ok';save();render();break}
    case 'castout':{const r=RITUALS[id];if(busy||S.pe<r.cost)return;S.pe-=r.cost;let t='';if(S.cls!=='ocultista'){S.san=Math.max(0,S.san-2);t=' (−2 SAN)'}
      if(r.type==='heal'){const h=healPv(rollExpr(r.dmg,1,S.cls==='ocultista'?S.power:0).total);t=`${r.name}${t}: +${h} ${PV()}.`}else{S.nextBonus=5;t=`${r.name}${t}: +5.`}
      log(t);S.outcome=`<p class="gain">${t}</p>`;S.outcomeCls='ok';if(checkDown())return;save();render();break}
    case 'c-atk':playerAction('atk',id);break;
    case 'c-rit':playerAction('rit',id);break;
    case 'c-item':playerAction('item',id);break;
    case 'c-mina':playerAction('mina');break;
    case 'c-scan':playerAction('scan',id);break;
    case 'c-kav':playerAction('kav');break;
    case 'c-final':playerAction('final');break;
    case 'c-lant':{const C=S.combat;if(busy||!C||C.lant)return;C.lant=true;C.cond.ofusc=Math.max(C.cond.ofusc,1);cline(L('Você mira a lanterna tática nos olhos dele. Ofuscado! (ação livre)','You shine the tactical flashlight in its eyes. Dazzled! (free action)','Le apuntas la linterna táctica a los ojos. ¡Deslumbrado! (acción libre)'),'good');break}
    case 'c-guard':playerAction('guard');break;
    case 'lv-opt':S.lvl.opt=id;S.lvl.sub=null;render();break;
    case 'lv-sub':S.lvl.sub=id;render();break;
    case 'lv-ok':{const Lv=S.lvl;if(Lv.opt==='skill')S.trained.push(Lv.sub);if(Lv.opt==='rit')S.rituals.push(Lv.sub);if(Lv.opt==='power')S.power++;Lv.stage='rest';save();render();window.scrollTo(0,0);break}
    case 'rest':restChoice(id);break;
    case 'retry':{const cp=S.checkpoint;S=clone(cp);S.checkpoint=cp;busy=false;S.screen='game';S.outcome=null;save();render();window.scrollTo(0,0);break}
  }
});
document.addEventListener('toggle',ev=>{const t=ev.target;if(t.classList&&t.classList.contains('cg')){D.openG=D.openG||{};D.openG[t.dataset.g]=t.open}},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='sc-in'){const b=ev.target.parentElement.querySelector('[data-a=choose]');if(b)b.click()}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='langSel'){setLang(t.value);return}
  if(t.id==='perito'){S.peritoArmed=t.checked;save();return}
  if(t.id==='c-equip'){switchWeapon(t.value);return}
  if(t.dataset&&t.dataset.inv){const i=D.inv.find(x=>x.uid===t.dataset.inv);if(!i)return;const f=t.dataset.f;
    if(f==='mod'){if(!t.value)return;i.mods.push(t.value);if(t.value==='funcao')i.skill2='Intuição';if(t.value==='instrumental')i.kitSkill=i.kitSkill||'Medicina'}
    else i[f]=t.value;
    render()}
});
$('sheetBtn').addEventListener('click',()=>$('sheet').classList.toggle('open'));
$('menuBtn').addEventListener('click',()=>{if(busy)return;if(S&&S.cls&&S.screen!=='end')save();S={screen:'title'};$('sheet').classList.remove('open');render()});
document.addEventListener('click',ev=>{const sh=$('sheet');if(sh.classList.contains('open')&&!sh.contains(ev.target)&&ev.target.id!=='sheetBtn')sh.classList.remove('open')});

/* ================= BOOT ================= */
function start(data){
  buildData();
  if(data&&data.S){S=data.S;if(data.D)D=data.D}else S={screen:'title'};
  busy=false;
  if(S.screen==='arsenal'&&(!D||!D.inv))S.screen='game';
  PATENTE=PATENTES[S.patente||'recruta'];
  const h=$('crestSm');if(h)h.src=CREST;
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,D}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
</body>
</html>

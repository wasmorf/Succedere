  --sangue:#d4463d; --morte:#a3a3aa; --energia:#a07bff; --conhec:#e3b943; --medo:#f4f1ec;
  --pv:#d4463d; --pe:#5fb8cc; --san:#d9c9ff;
  --ok:#86c47f; --fail:#e0574d;
  --type:"Special Elite", "Courier New", monospace;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --insan:0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
body{background:var(--ground);color:var(--bone);font-family:var(--serif);font-weight:500;font-size:18px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  opacity:calc(.12 + var(--insan)*1.2)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(60,20,110,calc(var(--insan)*.6)) 100%)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--conhec);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(8,7,11,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--type);font-size:20px;letter-spacing:.04em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.freq{color:var(--accent)}
.top-sp{flex:1}
.mini{display:none;gap:10px;font-family:var(--mono);font-size:13px}
.mini b{font-weight:600}
.tbtn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.tbtn:hover{border-color:var(--muted)}
#sheetBtn{display:none}

.layout{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:24px 60px;display:grid;grid-template-columns:310px minmax(0,1fr);gap:32px;align-items:start}
.layout.nosheet{grid-template-columns:minmax(0,1fr)}
#sheet{position:sticky;top:70px;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;scrollbar-width:thin}
#sheet:empty{display:none}
main{min-width:0}

/* sheet */
.sh-name{font-family:var(--type);font-size:22px;line-height:1.2;margin:0}
.sh-sub{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.nex{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:3px 8px;border-radius:3px}
.nex b{color:var(--conhec);font-size:15px}
.meters{display:grid;gap:10px;margin:16px 0}
.meter{display:grid;grid-template-columns:38px 1fr 64px;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.meter .bar{height:8px;background:var(--panel2);border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;transition:width .5s ease}
.meter .v{text-align:right;font-variant-numeric:tabular-nums}
.meter.pv i{background:var(--pv)} .meter.pe i{background:var(--pe)} .meter.san i{background:var(--san)}
.meter.pv .l{color:var(--pv)} .meter.pe .l{color:var(--pe)} .meter.san .l{color:var(--san)}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.attr{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 0}
.attr b{display:block;font-family:var(--mono);font-size:18px}
.attr span{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.sh-h{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between}
.kv{display:flex;justify-content:space-between;font-size:14px;gap:8px;padding:2px 0}
.kv span:last-child{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:13px}
.skills div{display:flex;justify-content:space-between;color:var(--faint)}
.skills div.tr{color:var(--bone)}
.skills em{font-style:normal;font-family:var(--mono);font-size:11px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.sbtn{background:none;border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sbtn:hover:not(:disabled){color:var(--bone);border-color:var(--muted)}
.el{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:2px;border:1px solid currentColor}
.el.sangue{color:var(--sangue)} .el.morte{color:var(--morte)} .el.energia{color:var(--energia)} .el.conhecimento{color:var(--conhec)} .el.medo{color:var(--medo)}
.clues{display:flex;flex-direction:column;gap:8px}
.clue{background:var(--paper);color:var(--paper-ink);border-radius:2px;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.clue:nth-child(odd){transform:rotate(-.6deg)} .clue:nth-child(even){transform:rotate(.5deg)}
.clue summary{font-family:var(--type);padding:6px 10px;cursor:pointer;list-style:none}
.clue summary::-webkit-details-marker{display:none}
.clue summary::before{content:"▸ ";opacity:.6}
.clue[open] summary::before{content:"▾ "}
.clue p{margin:0;padding:0 10px 8px;font-size:13.5px;line-height:1.45}
.empty{font-size:13px;color:var(--faint);font-style:italic}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log div{border-left:2px solid var(--line);padding-left:6px}
details.logw summary{cursor:pointer}

/* story */
.act{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);display:flex;gap:10px;align-items:center}
.act::after{content:"";flex:1;height:1px;background:var(--line)}
h1.scene{font-family:var(--type);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:10px 0 18px;text-wrap:balance}
.story{max-width:66ch}
.story p{margin:0 0 1em;text-shadow:calc(var(--insan)*2.2px) 0 rgba(212,70,61,.55),calc(var(--insan)*-2.2px) 0 rgba(160,123,255,.5)}
.story .radio{border-left:3px solid var(--pe);padding:4px 0 4px 14px;font-style:italic;color:#cfe6ec}
.story .radio b{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pe);display:block}
.whisper{display:block;font-family:var(--type);color:var(--accent);letter-spacing:.3em;font-size:13px;margin:-4px 0 12px;opacity:.8;animation:flick 2.4s infinite}
@keyframes flick{0%,100%{opacity:.8}45%{opacity:.2}50%{opacity:.9}}
.outcome{max-width:66ch;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:12px 16px;margin:0 0 22px;font-size:16px}
.outcome.ok{border-color:rgba(134,196,127,.5)} .outcome.fail{border-color:rgba(224,87,77,.5)}
.outcome p{margin:0 0 .5em} .outcome p:last-child{margin:0}
.gain{font-family:var(--mono);font-size:13px;color:var(--conhec)}
.loss{font-family:var(--mono);font-size:13px;color:var(--fail)}
.choices{display:flex;flex-direction:column;gap:10px;max-width:66ch;margin-top:26px}
.choice{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;transition:border-color .15s,transform .15s}
.choice:hover:not(:disabled){border-color:var(--bone);transform:translateX(3px)}
.choice .t{font-size:17px}
.choice .tag{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right;line-height:1.35}
.choice .tag b{color:var(--bone);font-weight:600}
.choice.main{border-color:var(--accent)}
.choice.main .t::before{content:"→ ";color:var(--accent)}
.perito{display:flex;align-items:center;gap:10px;margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.perito input{accent-color:var(--conhec)}

/* tray */
#tray[hidden]{display:none}
#tray{margin-top:28px;max-width:66ch;border:1px dashed var(--line);border-radius:6px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;background:linear-gradient(180deg,var(--panel),transparent)}
.tr-label{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tr-dice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--mono)}
.die{width:40px;height:44px;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--ground);background:var(--bone);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);font-variant-numeric:tabular-nums}
.die.drop{background:var(--faint);opacity:.55}
.die.spin{animation:spin .12s linear infinite}
.die.n20{background:var(--conhec)} .die.n1{background:var(--sangue);color:var(--bone)}
.die.en{background:var(--sangue);color:var(--bone)}
@keyframes spin{50%{transform:rotate(12deg) scale(.92)}}
.tr-sum{font-size:14px;color:var(--muted)}
.tr-sum b{font-size:22px;color:var(--bone);font-variant-numeric:tabular-nums}
.stamp{grid-row:1/span 2;grid-column:2;font-family:var(--type);font-size:20px;letter-spacing:.1em;padding:4px 12px;border:2px solid currentColor;transform:rotate(-6deg);border-radius:3px}
.stamp.ok{color:var(--ok)} .stamp.fail{color:var(--fail)} .stamp.crit{color:var(--conhec)} .stamp.none{display:none}
.tr-parts{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* create */
.wrap{max-width:900px}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.step{margin-top:34px}
.step h2{font-family:var(--type);font-weight:400;font-size:22px;margin:0 0 4px}
.step .hint{font-size:14px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.grid.origins{max-height:520px;overflow:auto;padding:2px 6px 2px 2px;scrollbar-width:thin}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--conhec);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--conhec)}
.card b{font-family:var(--type);font-weight:400;font-size:18px}
.card span{font-size:13.5px;color:var(--muted);line-height:1.4}
.card small{font-family:var(--mono);font-size:11px;color:var(--faint)}
.field{background:var(--panel);border:1px solid var(--line);color:var(--bone);font:inherit;font-family:var(--type);font-size:22px;padding:10px 14px;border-radius:4px;width:100%;max-width:420px}
.alloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.al{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.al .row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.al b{font-family:var(--mono);font-size:26px}
.al .nm{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.al p{font-size:12.5px;color:var(--faint);margin:6px 0 0;line-height:1.35}
.pm{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:18px}
.pool{font-family:var(--mono);font-size:13px;margin-bottom:12px}
.pool b{color:var(--conhec);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.chip.sel{border-color:var(--conhec);color:var(--conhec)}
.chip.lock{border-style:dashed;color:var(--muted);cursor:default}
.summary{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:20px}
.summary .stats{font-family:var(--mono);font-size:14px;display:flex;gap:16px;flex-wrap:wrap}
.cta{background:var(--accent-deep);color:#fff;border:none;border-radius:4px;padding:12px 22px;font-family:var(--type);font-size:18px;letter-spacing:.04em}
.cta:hover:not(:disabled){filter:brightness(1.1)}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:11px 20px;font-family:var(--type);font-size:17px}
.warn{font-family:var(--mono);font-size:12px;color:var(--fail)}

/* title */
.title{padding-block:6vh 0;max-width:760px}
.title .case{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.title h1{white-space:nowrap;font-family:var(--type);font-weight:400;font-size:clamp(44px,13vw,92px);line-height:.95;margin:14px 0 18px;letter-spacing:-.01em}
.title h1 span{display:inline;color:var(--accent);position:relative}
.crest{width:min(220px,55vw);height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 0 22px rgba(157,107,255,.55))}
.title{margin-inline:auto;text-align:center}
.title .lede{margin-inline:auto}
.title .btns{justify-content:center}
.title .rules{text-align:left}
.title .rules summary{text-align:center}
.crest-sm{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(157,107,255,.5))}
.brand{align-items:center!important}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.rules{margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.rules summary{font-family:var(--type);font-size:19px;cursor:pointer}
.rules dl{display:grid;grid-template-columns:140px 1fr;gap:10px 18px;font-size:15px;margin-top:16px}
.rules dt{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--conhec);padding-top:3px}
.rules dd{margin:0;color:var(--muted)}
.wheel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono);font-size:12px}

/* combat */
.foe{max-width:66ch;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;position:relative;overflow:hidden}
.foe::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 10%,var(--foec,transparent),transparent 60%);opacity:.18;pointer-events:none}
.foe h2{font-family:var(--type);font-weight:400;font-size:26px;margin:4px 0 2px}
.foe .kind{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foe .meter{grid-template-columns:38px 1fr 80px;margin-top:14px}
.foe .meter i{background:var(--foec,var(--sangue))}
.foe .desc{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.obj{margin-top:12px;font-family:var(--mono);font-size:12px;display:flex;gap:6px;align-items:center}
.obj i{width:18px;height:8px;border:1px solid var(--pe);display:inline-block}
.obj i.on{background:var(--pe)}
.round{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin:22px 0 8px}
.clog{max-width:66ch;display:flex;flex-direction:column;gap:6px;font-size:15.5px}
.clog p{margin:0;padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.clog p:last-child{color:var(--bone);border-color:var(--bone)}
.clog p.hit{border-color:var(--fail)} .clog p.good{border-color:var(--ok)}
.actions{max-width:66ch;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:22px}
.abtn{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.abtn:hover:not(:disabled){border-color:var(--bone)}
.abtn b{font-weight:600;font-size:15.5px}
.abtn small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.abtn.sp{border-color:rgba(95,184,204,.5)}
.abtn .el{align-self:flex-start;margin-top:3px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}


/* equipamento */
.gear-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 14px;margin-bottom:10px}
.gear-head b{color:var(--bone);font-size:16px;font-variant-numeric:tabular-nums}
.gear-head b.bad{color:var(--fail)}
.gear-head .sp{flex:1}
.note{font-family:var(--mono);font-size:12px;color:var(--conhec);margin:8px 0;line-height:1.5}
.invlist{display:flex;flex-direction:column;gap:8px;margin:12px 0 20px}
.inv{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.inv-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv-top b{font-weight:600}
.inv-top small{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;min-width:120px}
.inv-opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.inv-opts:empty{display:none}
.inv-opts .chip{font-size:12px;padding:3px 10px}
.cat{font-family:var(--mono);font-size:10.5px;font-weight:600;border-radius:2px;padding:1px 6px;border:1px solid currentColor}
.cat.c0{color:var(--muted)} .cat.c1{color:var(--pe)} .cat.c2,.cat.c3{color:var(--fail)}
.sel-s{background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:12px;padding:4px 6px;max-width:100%}
.catalog{display:flex;flex-direction:column;gap:8px}
.cg{border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.cg summary{cursor:pointer;padding:10px 14px;font-family:var(--type);font-size:17px}
.cg summary small{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
.csub{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);padding:10px 14px 4px;border-top:1px solid var(--line)}
.gi{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:8px 14px}
.gi-t{min-width:0}
.gi-t small{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.gi-t em{color:var(--conhec);font-style:normal}
.gi-t p{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.4}
.sbtn.add{white-space:nowrap;flex-shrink:0}
.sbtn.add:not(:disabled){color:var(--bone);border-color:var(--muted)}
.dim{font-family:var(--mono);font-size:11px;color:var(--faint)}
.wsel{max-width:66ch;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:18px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.wsel small{font-size:11px;color:var(--faint)}
.abtn.it{border-style:dashed}

/* succedere */
.allies{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.allies span{border:1px solid var(--line);border-radius:12px;padding:2px 10px;color:var(--bone)}
.abtn.final{grid-column:1/-1;border-color:var(--accent);background:linear-gradient(90deg,rgba(157,107,255,.2),transparent)}
.abtn.final b{font-family:var(--type);font-size:20px;font-weight:400;color:var(--accent)}
.inputc{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inputc .field{max-width:260px;text-transform:uppercase;letter-spacing:.2em}
.profile{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:4px;padding:16px 18px;max-width:66ch}
.profile p{margin:0 0 8px}
.bondv{color:var(--accent)!important;letter-spacing:.15em}
.clog p.hint{border-color:var(--conhec)}
/* social */
.social{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:var(--bone);text-decoration:none;font-family:var(--mono);font-size:13px;background:var(--panel)}
.social:hover,.social:focus-visible{border-color:var(--accent);color:var(--accent)}
.social .x{font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Math","DejaVu Sans",sans-serif;font-size:18px;line-height:1}
/* idioma */
.langpick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 18px}
.langpick .chip{font-size:14px}
.langsel{appearance:none;-webkit-appearance:none;padding:6px 10px;color:var(--bone);cursor:pointer}
/* level */
.lvl{max-width:760px}
.nexbig{font-family:var(--mono);font-size:15px;color:var(--muted);display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.nexbig b{font-size:40px;color:var(--conhec);font-weight:600}
.gains{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:14px;margin-bottom:10px}
.report{max-width:66ch;background:var(--paper);color:var(--paper-ink);padding:22px 24px;border-radius:2px;margin-top:10px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.report h2{font-family:var(--type);font-weight:400;margin:0 0 6px;font-size:24px}
.report .rank{font-family:var(--type);font-size:64px;line-height:1;color:#5b2aa8;float:right;border:3px solid #5b2aa8;padding:4px 14px;transform:rotate(6deg);margin:0 0 10px 16px}
.report p{margin:0 0 .8em}
.report ul{margin:.3em 0 0;padding-left:18px;font-size:15px}

@media (max-width:860px){
  .top-in{gap:8px 10px}
  .brand{order:2;flex:1;justify-content:center;min-width:0}
  #sheetBtn{order:1}
  #menuBtn{order:3}
  .top-sp{display:none}
  .mini{order:4;flex-basis:100%;justify-content:center}
  .langsel{order:3}
  .mini:empty{display:none}
  input,select,.sel-s,.field{font-size:16px!important}
  #sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-block:18px 60px}
  #sheet{position:fixed;top:0;left:0;bottom:0;width:min(88vw,340px);max-height:none;border-radius:0;z-index:60;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  #sheet.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  #sheetBtn{display:inline-block}
  .mini{display:flex}
  .brand small{display:none}
  .choice{flex-direction:column;align-items:flex-start}
  .choice .tag{text-align:left;white-space:normal}
  .rules dl{grid-template-columns:1fr}
  body{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <button class="tbtn" id="sheetBtn" type="button" aria-controls="sheet">Ficha</button>
    <div class="brand"><img class="crest-sm" id="crestSm" alt=""><span>Succe<span class="freq">dere</span></span><small>Ordo Realitas · história de fã</small></div>
    <div class="top-sp"></div>
    <div class="mini" id="mini"></div>
    <select id="langSel" class="tbtn langsel" aria-label="Idioma / Language"><option value="pt">PT</option><option value="en">EN</option><option value="es">ES</option></select>
    <button class="tbtn" id="menuBtn" type="button">Menu</button>
  </div>
</header>
<div class="layout" id="layout">
  <aside id="sheet" aria-label="Ficha do agente"></aside>
  <main>
    <div id="screen"></div>
    <div id="tray" hidden></div>
  </main>
</div>

/* ================= EQUIPAMENTO (lógica) ================= */
function catCount(inv,c){return inv.filter(i=>itemCat(i)===c).length}
function critStr(c){const [m,x]=c;return m<20?(x>2?`${m}/x${x}`:`${m}`):`x${x}`}
function modGroup(it){if(it.kind==='arma')return it.fire?'fire':'melee';if(it.kind==='municao')return 'ammo';if(it.kind==='protecao')return 'prot';if(it.kind==='acessorio')return 'acc';return null}
function newInst(id){const it=ITEMS[id];return {uid:Math.random().toString(36).slice(2,9),id,mods:[],
  skill:it.pick==='skill'?'Percepção':null,skill2:null,kitSkill:it.pick==='kit'?'Medicina':null,
  cenas:it.cenas??null,charges:it.charges??null}}
function itemCat(i){return ITEMS[i.id].cat+i.mods.length}
function itemSp(i){const it=ITEMS[i.id];if(!it.sp)return 0;return Math.max(0,it.sp-(i.mods.some(m=>DISCRETE.includes(m))?1:0)+(i.mods.includes('blindada')?1:0)+(i.mods.includes('reforcada')?1:0))}
function spacesUsed(inv){return inv.reduce((s,i)=>s+itemSp(i),0)}
function capacity(FOR,inv){return Math.min(15,(FOR>0?5*FOR:2)+(inv.some(i=>i.id==='mochila')?2:0))}
const scenesWord=n=>n>1?L('cenas','scenes','escenas'):L('cena','scene','escena');
function itemStats(it,i){
  if(it.dmg)return `${it.dmg}${it.dmg2?'/'+it.dmg2:''} · ${critStr(it.crit)} · ${it.alc||'—'} · ${it.tipo||''}`;
  if(it.kind==='protecao')return `+${it.def} ${L('Defesa','Defense','Defensa')}${it.rd?' · '+L('RD','DR','RD')+' '+it.rd:''}`;
  if(it.cenas){const n=i?i.cenas:it.cenas;return it.cenas>=99?L('dura a missão','lasts the mission','dura la misión'):`${n} ${scenesWord(n)}`}
  if(it.charges)return `${i?i.charges:it.charges} ${L('usos','uses','usos')}`;
  return '';
}
function armorInfo(inv,cls,grip){
  let def=0,rd=0,heavy=false,nonprof=false;const names=[];const p=PROF[cls]||{};
  inv.forEach(i=>{const it=ITEMS[i.id];if(it.kind!=='protecao')return;
    let dv=it.def+(i.mods.includes('reforcada')?2:0);
    if(it.shield&&grip==='duas')dv=0;
    def+=dv;if(it.rd)rd=Math.max(rd,it.rd);if(i.mods.includes('blindada'))rd=Math.max(rd,5);
    if(it.heavy)heavy=true;
    if(!(i.id==='leve'&&p.leve))nonprof=true;
    names.push(it.name+(it.shield&&grip==='duas'?L(' (sem mão livre)',' (no free hand)',' (sin mano libre)'):''))});
  return {def,rd,heavy,nonprof,names};
}
const hasItem=id=>!!(S&&S.inv)&&S.inv.some(i=>i.id===id);
function removeItem(id){const k=S.inv.findIndex(i=>i.id===id);if(k>=0)S.inv.splice(k,1)}
function weaponList(){return [...S.inv.filter(i=>ITEMS[i.id].dmg).map(i=>({inst:i,it:ITEMS[i.id]})),{inst:{uid:'_desarmado',id:'_desarmado',mods:[]},it:UNARMED}]}
function equipped(){const l=weaponList();return l.find(w=>w.inst.uid===S.equip)||l[0]}
function curArmor(){return armorInfo(S.inv,S.cls,equipped().it.grip)}
function wStats(w,mode='normal'){
  const it=w.it,m=w.inst.mods,coron=mode==='coronhada',o={};
  o.name=coron?`${L('Coronhada','Pistol-whip','Culatazo')} (${it.name})`:it.name;
  o.ranged=!coron&&!!it.ranged;
  o.skill=o.ranged?'Pontaria':'Luta';
  o.attr=o.ranged?'AGI':(it.agil&&!coron?'AGI':'FOR');
  let base=coron?(it.grip==='duas'?'1d6':'1d4'):it.dmg;
  if(!coron&&it.dmg2&&!S.inv.some(i=>i.id==='escudo'))base=it.dmg2;
  const mm=/(\d+)d(\d+)/.exec(base);o.n=+mm[1];o.s=+mm[2];
  o.margin=coron?20:it.crit[0]-((m.includes('perigosa')||m.includes('laser'))?2:0);
  o.mult=coron?2:it.crit[1];
  o.atk=(!coron&&(m.includes('certeira')||m.includes('alongada')))?2:0;
  o.dmgB=(!coron&&m.includes('cruel')?2:0)+(it.unarmed&&hasItem('soqueira')?1:0);
  o.extraDice=(!coron&&m.includes('calibre')?1:0)+(S.cls==='combatente'?S.power:0);
  o.addAttr=o.ranged?(it.forDmg?'FOR':null):o.attr;
  o.auto=!coron&&(!!it.auto||m.includes('ferrolho'));
  o.comp=m.includes('compensador');
  const p=PROF[S.cls]||{};
  o.prof=coron||it.prof!=='tatica'||!!p.tatica;
  o.chainsaw=!!it.chainsaw&&!coron;
  o.diceMod=(o.prof?0:-2)+(o.chainsaw?-1:0)+(curArmor().nonprof?-1:0);
  o.ammo=coron?null:(it.ammo||null);
  o.thermal=m.includes('termica_f');
  o.fire=!!it.fire;
  return o;
}
function gearBonus(skl,ctx=[]){
  const inv=(S&&S.inv)||[],parts=[];let b=0;
  if(skl==='Atletismo'){b+=2;parts.push(L('braço mecânico +2','mechanical arm +2','brazo mecánico +2'))}
  if(KIT_SKILLS.includes(skl)&&!inv.some(i=>i.kitSkill===skl&&(i.id==='kit'||i.mods.includes('instrumental')))){b-=5;parts.push(L('sem kit −5','no kit −5','sin kit −5'))}
  let vest=0;
  inv.forEach(i=>{const it=ITEMS[i.id];if(it.kind!=='acessorio')return;
    if(it.vest){vest++;if(vest>2)return}
    if(it.pick==='skill'&&i.skill===skl){const v=i.mods.includes('aprimorado')?5:2;b+=v;parts.push(`${it.name} +${v}`)}
    if(i.mods.includes('funcao')&&i.skill2===skl){b+=2;parts.push(`${it.name} +2`)}});
  const CTX={escuro:['lanterna','Percepção',2],distante:['binoculos','Percepção',5],escalar:['corda','Atletismo',5],mato:['sobrev','Sobrevivência',5],porta:['pecabra','Atletismo',5],respirar:['mascara','Fortitude',10],ambiente:['hazmat','Fortitude',5]};
  ctx.forEach(c=>{const [id,s,v]=CTX[c];if(s===skl&&inv.some(i=>i.id===id)){b+=v;parts.push(`${ITEMS[id].name} +${v}`)}});
  if(LOAD.has(skl)&&S&&S.cls&&S.inv){const ar=curArmor();if(ar.heavy){b-=5;parts.push(L('carga −5','load −5','carga −5'))}if(ar.nonprof){b-=5;parts.push(L('proteção sem proficiência −5','non-proficient armor −5','protección sin competencia −5'))}}
  return {b,parts};
}
function itemDT(attr='AGI'){return 10+S.attr[attr]+Math.floor(S.nex/5)}

function suggestInv(cls){const inv=(SUGGEST[cls]||SUGGEST.especialista).map(([id,o])=>Object.assign(newInst(id),o||{}));const cap=capacity(D.attr.FOR,inv);while(spacesUsed(inv)>cap&&inv.length)inv.pop();return inv}

p_ligacao:{act:L('Prólogo','Prologue','Prólogo'),title:L('A ligação','The call','La llamada'),checkpoint:true,
  text:()=>P(L(`Três e dez da manhã. O braço mecânico range com o frio do apartamento alugado. Você não dorme direito há seis anos, desde a noite em que a Mansão Wezen virou um matadouro e a sua família virou manchete.

Você ainda lembra de tudo antes disso. Dos domingos de macarrão. Do ritual de criança que vocês dois fizeram para trazer de volta o Skart, o gato preto: você perdeu o braço direito, o Eros perdeu a visão do olho esquerdo. E lembra da última imagem do seu irmão: correndo para longe, enquanto a coisa de oito patas descia pela parede atrás de vocês.

Num arquivo de caso que você não deveria ter lido, um número de telefone. Você liga. Uma mulher atende no primeiro toque.

RADIO:TELEFONE · JUDITE|"Eros Wezen? Sim. Agente em atividade." Um silêncio longo. "Quem está perguntando?"`,
`3:10 a.m. The mechanical arm creaks in the cold of the rented apartment. You haven't slept properly in six years, not since the night the Wezen Mansion became a slaughterhouse and your family became a headline.

You still remember everything before that. Sunday pasta. The childhood ritual the two of you did to bring back Skart, the black cat: you lost your right arm, Eros lost the sight in his left eye. And you remember the last image of your brother: running away while the eight-legged thing crawled down the wall behind you.

In a case file you shouldn't have read, a phone number. You call. A woman picks up on the first ring.

RADIO:PHONE · JUDITE|"Eros Wezen? Yes. Active agent." A long silence. "Who's asking?"`,
`Las tres y diez de la madrugada. El brazo mecánico cruje con el frío del departamento alquilado. No duermes bien desde hace seis años, desde la noche en que la Mansión Wezen se volvió un matadero y tu familia, un titular.

Todavía recuerdas todo lo de antes. Los domingos de pasta. El ritual de niños que hicieron los dos para traer de vuelta a Skart, el gato negro: tú perdiste el brazo derecho, Eros perdió la vista del ojo izquierdo. Y recuerdas la última imagen de tu hermano: huyendo, mientras la cosa de ocho patas bajaba por la pared detrás de ustedes.

En un expediente que no deberías haber leído, un número de teléfono. Llamas. Una mujer contesta al primer tono.

RADIO:TELÉFONO · JUDITE|"¿Eros Wezen? Sí. Agente en actividad." Un silencio largo. "¿Quién pregunta?"`)),
  choices:()=>[
    {once:'judite',label:L('Pressionar Judite por mais informações','Press Judite for more','Presionar a Judite por más información'),test:{sk:'Diplomacia',dt:13},
      ok:()=>({text:P(L(`"Ele não fala de família. Só uma vez, bêbado, falou de uma irmã que morreu por culpa dele." Ela anota seu nome. "Venha até o bar. Rua da Alfândega, 212. Sozinha."`,`"He doesn't talk about family. Only once, drunk, he mentioned a sister who died because of him." She writes down your name. "Come to the bar. 212 Alfândega Street. Alone."`,`"No habla de su familia. Solo una vez, borracho, habló de una hermana que murió por su culpa." Anota tu nombre. "Ven al bar. Calle de la Aduana, 212. Sola."`))+addClue('eros_vivo')}),
      fail:()=>({text:P(L(`"Isso não é assunto para telefone." Ela te dá um endereço, Rua da Alfândega, 212, e desliga.`,`"This isn't a phone conversation." She gives you an address, 212 Alfândega Street, and hangs up.`,`"Esto no se habla por teléfono." Te da una dirección, Calle de la Aduana, 212, y cuelga.`))+addClue('eros_vivo')})},
    {label:L('Ir até o endereço agora','Go to the address now','Ir a la dirección ahora'),main:true,run:()=>{addClue('eros_vivo');return {go:'c1_bar'}}}
  ]},

c1_bar:{act:CH1,title:L('O bar','The bar','El bar'),
  text:()=>P(L(`Um bar de esquina com cadeiras em cima das mesas. Judite, cinquenta e poucos anos, cabelo preso num lápis, te olha como quem mede um caixão. Ela empurra a estante de vinhos. Atrás dela, uma escada de concreto desce para uma luz branca.

"Só eu abro isso por cima", diz. "Lembre disso."

Lá embaixo, a Base da Ordo Realitas: corredores de azulejo, cheiro de café velho e pólvora. E a notícia, dada sem cerimônia por um homem de dreads chamado Mada: a Equipe Bob, a equipe do seu irmão, sumiu há um mês. Última localização: o hospital abandonado da zona norte.`,
`A corner bar with chairs stacked on the tables. Judite, early fifties, hair held up with a pencil, looks at you like she's measuring a coffin. She pushes the wine rack aside. Behind it, a concrete staircase goes down into white light.

"Only I can open this from above," she says. "Remember that."

Down below, the Ordo Realitas Base: tiled corridors, the smell of stale coffee and gunpowder. And the news, delivered without ceremony by a man with dreadlocks named Mada: Team Bob, your brother's team, went missing a month ago. Last known location: the abandoned hospital on the north side.`,
`Un bar de esquina con las sillas sobre las mesas. Judite, cincuenta y pico, el pelo sujeto con un lápiz, te mira como quien mide un ataúd. Empuja el estante de vinos. Detrás, una escalera de concreto baja hacia una luz blanca.

"Solo yo abro esto desde arriba", dice. "Recuérdalo."

Abajo, la Base de la Ordo Realitas: pasillos de azulejos, olor a café viejo y pólvora. Y la noticia, dada sin ceremonia por un hombre con rastas llamado Mada: el Equipo Bob, el equipo de tu hermano, desapareció hace un mes. Última ubicación: el hospital abandonado de la zona norte.`)),
  choices:()=>[{label:L('Seguir Mada até a sala de reunião','Follow Mada to the meeting room','Seguir a Mada a la sala de reuniones'),main:true,run:()=>({go:'c1_base'})}]},

c1_base:{act:CH1,title:L('Sala de reunião','Meeting room','Sala de reuniones'),
  text:()=>P(L(`Roger, o líder, ex-militar, fala rápido e não pisca. Ao lado dele, Thomas, o irmão mais velho do Mada, de braços cruzados. Encostado na parede, um garoto de dezesseis anos com cara de sono: Derick.

"Você não é agente", diz Roger. "Se morrer lá dentro, o problema é seu." Mada olha para você por um tempo longo. "Eu não posso sair da Base agora. Mas posso te dar uma equipe. Três agentes. Você escolhe."`,
`Roger, the leader, ex-military, talks fast and doesn't blink. Next to him is Thomas, Mada's older brother, arms crossed. Leaning against the wall, a sleepy-looking sixteen-year-old: Derick.

"You're not an agent," Roger says. "If you die in there, that's on you." Mada looks at you for a long time. "I can't leave the Base right now. But I can give you a team. Three agents. You pick."`,
`Roger, el líder, exmilitar, habla rápido y no parpadea. A su lado, Thomas, el hermano mayor de Mada, de brazos cruzados. Apoyado en la pared, un chico de dieciséis años con cara de sueño: Derick.

"No eres agente", dice Roger. "Si mueres allá adentro, es tu problema." Mada te mira un largo rato. "No puedo salir de la Base ahora. Pero puedo darte un equipo. Tres agentes. Tú eliges."`)),
  choices:()=>[
    {once:'b_mada',label:L('Perguntar a Mada sobre Eros','Ask Mada about Eros','Preguntarle a Mada por Eros'),
      run:()=>({text:P(L(`"Bom agente. Quieto. Chegou do nada há uns anos, sabia mais de ritual que muito veterano." Ele hesita. "Nunca falou de família. Nenhuma vez." A frase dói mais do que devia.`,`"Good agent. Quiet. Showed up out of nowhere a few years ago, knew more about rituals than a lot of veterans." He hesitates. "Never talked about family. Not once." That hurts more than it should.`,`"Buen agente. Callado. Apareció de la nada hace unos años, sabía más de rituales que muchos veteranos." Duda. "Nunca habló de su familia. Ni una vez." La frase duele más de lo que debería.`))+bond('mada')})},
    {once:'b_thomas',label:L('Sustentar o olhar de Thomas, que te mede de cima a baixo','Hold Thomas\'s stare as he sizes you up','Sostenerle la mirada a Thomas, que te mide de arriba abajo'),test:{sk:'Intimidação',dt:14},
      ok:()=>({text:P(L(`Thomas sorri de canto. "Pelo menos essa não abaixa a cabeça." É quase um elogio.`,`Thomas half-smiles. "At least this one doesn't look down." It's almost a compliment.`,`Thomas sonríe de lado. "Al menos esta no baja la cabeza." Es casi un elogio.`))+bond('thomas')}),
      fail:()=>({text:P(L(`Thomas ri pelo nariz e volta a olhar o mapa. Você sente o rosto quente.`,`Thomas snorts and goes back to the map. Your face burns.`,`Thomas resopla con una risa y vuelve al mapa. Sientes la cara arder.`))})},
    {label:L('Escolher a equipe de resgate','Choose the rescue team','Elegir el equipo de rescate'),main:true,run:()=>({team:true})}
  ]},

c1_arsenal:{act:CH1,title:L('O arsenal','The armory','El arsenal'),
  text:()=>P(L(`Derick te leva até o arsenal, uma sala de grades com cheiro de óleo de máquina. "Regra da casa: recruta leva no máximo duas coisas de categoria I. O resto, o que couber na mochila."

Ele pega uma lança da parede e te olha, desconfiado. "Quem escolhe lança em pleno século XXI?" Depois sorri. "Combina com você. Mas leva a pistola também."

Equipe: ${teamNames().join(', ')}.`,
`Derick takes you to the armory, a caged room that smells of machine oil. "House rule: recruits take two category I items, max. Everything else, whatever fits in the backpack."

He takes a spear off the wall and eyes you. "Who picks a spear in the twenty-first century?" Then he smiles. "Suits you. But take the pistol too."

Team: ${teamNames().join(', ')}.`,
`Derick te lleva al arsenal, una sala enrejada con olor a aceite de máquina. "Regla de la casa: un recluta lleva como máximo dos cosas de categoría I. Lo demás, lo que quepa en la mochila."

Descuelga una lanza de la pared y te mira, receloso. "¿Quién elige una lanza en pleno siglo XXI?" Luego sonríe. "Te queda. Pero llévate también la pistola."

Equipo: ${teamNames().join(', ')}.`)),
  choices:()=>[{label:L('Abrir o arsenal','Open the armory','Abrir el arsenal'),main:true,run:()=>({arsenal:{next:'c1_saida',patente:'recruta',suggest:'koranna'}})}]},

c1_saida:{act:CH1,title:L('A caminho do hospital','On the way to the hospital','Camino al hospital'),
  text:()=>{
    const l=[];
    if(tm('lipe')&&tm('jade'))l.push(L('No banco de trás, Lipe e Jade dividem um fone de ouvido e seguram a mão um do outro sem perceber.','In the back seat, Lipe and Jade share one earbud and hold hands without noticing.','En el asiento de atrás, Lipe y Jade comparten un auricular y se toman de la mano sin darse cuenta.'));
    else if(tm('lipe'))l.push(L('Lipe conta piadas ruins para quebrar o gelo. Ninguém ri. Ele conta outra.','Lipe tells bad jokes to break the ice. Nobody laughs. He tells another.','Lipe cuenta chistes malos para romper el hielo. Nadie se ríe. Cuenta otro.'));
    else if(tm('jade'))l.push(L('Jade desenha símbolos no vidro embaçado e apaga cada um com a manga.','Jade draws symbols on the fogged window and wipes each one away with her sleeve.','Jade dibuja símbolos en el vidrio empañado y borra cada uno con la manga.'));
    if(tm('leon'))l.push(L('Leon dirige rápido demais e não tira o olho do retrovisor.','Leon drives too fast and never takes his eyes off the rearview mirror.','Leon maneja demasiado rápido y no quita la vista del retrovisor.'));
    if(tm('jon'))l.push(L('Jon confere o fuzil três vezes. Não diz uma palavra a viagem toda.','Jon checks his rifle three times. He doesn\'t say a word the whole ride.','Jon revisa el fusil tres veces. No dice una palabra en todo el viaje.'));
    if(tm('rjr'))l.push(L('Roger Jr abre a planta do bairro no colo e divide a equipe em formação antes mesmo de chegar.','Roger Jr spreads the neighborhood map on his lap and sets the team\'s formation before they even arrive.','Roger Jr abre el plano del barrio en el regazo y arma la formación antes de llegar.'));
    return P(l.join(' ')+L(`

RADIO:RÁDIO · MADA|"Koranna. Cuidado lá dentro. Se ficar feio, me chama. Eu vou."

O hospital aparece no fim da rua: seis andares de janelas quebradas e uma cruz vermelha apagada.`,`

RADIO:RADIO · MADA|"Koranna. Be careful in there. If it gets ugly, call me. I'll come."

The hospital appears at the end of the street: six floors of broken windows and a dead red cross.`,`

RADIO:RADIO · MADA|"Koranna. Cuidado allá adentro. Si se pone feo, llámame. Voy."

El hospital aparece al final de la calle: seis pisos de ventanas rotas y una cruz roja apagada.`))},
  choices:()=>[
    {once:'obs1',label:L('Observar o grupo em silêncio durante a viagem','Quietly watch the group during the ride','Observar al grupo en silencio durante el viaje'),test:{sk:'Intuição',dt:14},
      ok:()=>({text:hintTraitor()}),
      fail:()=>({text:P(L(`Você tenta ler cada um, mas só consegue pensar no seu irmão.`,`You try to read each of them, but all you can think about is your brother.`,`Intentas leer a cada uno, pero solo puedes pensar en tu hermano.`))})},
    {label:L('Entrar no hospital','Enter the hospital','Entrar al hospital'),main:true,run:()=>({go:'h1_hall'})}
  ]},

h1_hall:{act:CH2,title:L('Primeiro andar','First floor','Primer piso'),checkpoint:true,
  text:()=>P(L(`O saguão fede a formol e ferrugem. Macas viradas, papel de parede descascando em línguas. Quatro portas: a recepção, a farmácia, o necrotério e, no fim do corredor, o escritório do médico-chefe, com a porta entreaberta e uma luz que não devia estar acesa.`,`The lobby reeks of formaldehyde and rust. Overturned gurneys, wallpaper peeling in long tongues. Four doors: reception, the pharmacy, the morgue and, at the end of the hall, the chief physician's office, its door ajar and a light on that shouldn't be.`,`El vestíbulo apesta a formol y óxido. Camillas volcadas, papel tapiz desprendiéndose en lenguas. Cuatro puertas: la recepción, la farmacia, la morgue y, al final del pasillo, el despacho del médico jefe, con la puerta entreabierta y una luz que no debería estar encendida.`))+
    (S.done.parasita?P(L(`A escada para o segundo andar está livre.`,`The stairs to the second floor are clear.`,`La escalera al segundo piso está libre.`)):''),
  choices:()=>[
    {once:'recepcao',label:L('Revirar a recepção','Search the reception desk','Revisar la recepción'),test:{sk:'Investigação',dt:12},
      ok:()=>({text:P(L(`O livro de visitas ainda está no balcão. Você passa o dedo pelas assinaturas e para.`,`The visitor log is still on the counter. You run a finger down the signatures and stop.`,`El libro de visitas sigue en el mostrador. Pasas el dedo por las firmas y te detienes.`))+addClue('registro')+loseSan('1d2',L('a letra dele','his handwriting','su letra'))}),
      fail:()=>({text:P(L(`Fichas mofadas, nada legível. Algo se mexe atrás do balcão, mas é só um rato.`,`Moldy files, nothing legible. Something moves behind the counter, but it's just a rat.`,`Fichas enmohecidas, nada legible. Algo se mueve detrás del mostrador, pero es solo una rata.`))})},
    {once:'farmacia',label:L('Procurar suprimentos na farmácia','Look for supplies in the pharmacy','Buscar suministros en la farmacia'),test:{sk:'Percepção',dt:13},
      ok:()=>({text:P(L(`Atrás de um armário tombado, uma caixa lacrada, com validade em dia. Alguém esteve aqui recentemente.`,`Behind a toppled cabinet, a sealed box, still in date. Someone was here recently.`,`Detrás de un armario volcado, una caja sellada, sin vencer. Alguien estuvo aquí hace poco.`))+addLoot('cicatrizante')}),
      fail:()=>({text:P(L(`Você derruba uma prateleira. O barulho ecoa. Algo responde lá do fundo.`,`You knock over a shelf. The noise echoes. Something answers from the back.`,`Tiras un estante. El ruido retumba. Algo responde desde el fondo.`)),combat:{id:'zumbi',after:'h1_hall',allies:S.team,enemyFirst:true,winText:L('O zumbi desaba sobre os frascos quebrados.','The zombie collapses onto the broken vials.','El zombi se desploma sobre los frascos rotos.')}})},
    {once:'necroterio',label:L('Descer ao necrotério','Go down to the morgue','Bajar a la morgue'),
      run:()=>({text:P(L(`As gavetas estão abertas. Todas. Uma delas ainda tem alguém dentro, e esse alguém está se sentando.`,`The drawers are open. All of them. One still has someone inside, and that someone is sitting up.`,`Los cajones están abiertos. Todos. Uno todavía tiene a alguien adentro, y ese alguien se está sentando.`)),combat:{id:'zumbi',after:'h1_necro',allies:S.team}})},
    {once:'parasita',label:L('Entrar no escritório do médico','Enter the physician\'s office','Entrar al despacho del médico'),main:!S.done.parasita,run:()=>({go:'h1_escritorio'})},
    {cond:()=>!!S.done.parasita,label:L('Subir ao segundo andar','Go up to the second floor','Subir al segundo piso'),main:true,run:()=>({go:'h2_andar'})}
  ]},

h1_necro:{act:CH2,title:L('Necrotério','Morgue','Morgue'),
  text:()=>P(L(`Nas outras gavetas, corpos secos como papel, sem uma gota de sangue. Todos com a mesma marca no pescoço: dois furos, lado a lado. Não é mordida de gente.`,`In the other drawers, bodies dry as paper, without a drop of blood. All with the same mark on the neck: two holes, side by side. That's not a human bite.`,`En los otros cajones, cuerpos secos como papel, sin una gota de sangre. Todos con la misma marca en el cuello: dos agujeros, uno junto al otro. No es mordida humana.`)),
  choices:()=>[{label:L('Voltar ao corredor','Back to the hallway','Volver al pasillo'),main:true,run:()=>({go:'h1_hall',text:loseSan('1d2',L('o necrotério','the morgue','la morgue'))})}]},

h1_escritorio:{act:CH2,title:L('O escritório do médico','The physician\'s office','El despacho del médico'),
  text:()=>P(L(`A sala é estreita. Só dá para entrar em fila. Você vai no meio, como Derick ensinou. ${teamNames().join(', ')}: alguém vai ter que entrar por último e fechar a retaguarda.

Um aviso que você só vai entender tarde demais: o que vive nesta sala sempre escolhe o último a entrar.`,
`The room is narrow. You can only go in single file. You take the middle, like Derick taught you. ${teamNames().join(', ')}: someone has to go in last and cover the rear.

A warning you'll only understand too late: whatever lives in this room always chooses the last one in.`,
`La sala es estrecha. Solo se puede entrar en fila. Tú vas en el medio, como enseñó Derick. ${teamNames().join(', ')}: alguien tiene que entrar último y cubrir la retaguardia.

Una advertencia que solo entenderás demasiado tarde: lo que vive en esta sala siempre elige al último en entrar.`)),
  choices:()=>S.team.map(id=>({label:L(`${TEAM[id].name} entra por último`,`${TEAM[id].name} goes in last`,`${TEAM[id].name} entra último`),run:()=>{S.host=id;return {go:'h1_sonho'}}}))},

h1_sonho:{act:CH2,title:L('O sonho compartilhado','The shared dream','El sueño compartido'),
  text:()=>P(L(`A porta bate atrás de vocês. A lâmpada estoura. E, de repente, vocês quatro estão em outro lugar, todos ao mesmo tempo, vendo a mesma coisa.

${GUILT[S.host]}

Você acorda de joelhos no chão do escritório. Todos acordam. Alguém entre vocês está respirando errado. Você tem segundos.`,
`The door slams behind you. The bulb bursts. And suddenly the four of you are somewhere else, all at once, seeing the same thing.

${GUILT[S.host]}

You wake up on your knees on the office floor. Everyone wakes up. Someone among you is breathing wrong. You have seconds.`,
`La puerta se cierra de golpe detrás de ustedes. La bombilla estalla. Y de pronto los cuatro están en otro lugar, al mismo tiempo, viendo lo mismo.

${GUILT[S.host]}

Despiertas de rodillas en el piso del despacho. Todos despiertan. Alguien entre ustedes respira mal. Tienes segundos.`)),
  choices:()=>[
    {label:L('Procurar os sinais no rosto de cada um','Look for signs on each face','Buscar señales en la cara de cada uno'),test:{sk:'Percepção',dt:15},
      ok:()=>({text:P(L(`As pupilas de ${TEAM[S.host].name} estão do tamanho de uma moeda. "É ${fn(S.host)}!" O Parasita arranca-se das costas dele antes de tomar o controle, e fica exposto no meio da sala.`,`${TEAM[S.host].name}'s pupils are the size of coins. "It's ${fn(S.host)}!" The Parasite tears itself off his back before it can take control, and is left exposed in the middle of the room.`,`Las pupilas de ${TEAM[S.host].name} son del tamaño de una moneda. "¡Es ${fn(S.host)}!" El Parásito se arranca de su espalda antes de tomar el control y queda expuesto en medio de la sala.`))+(ALLIES[S.host].traitor?susp(S.host,L('o sonho','the dream','el sueño')):'')+bond('derick'),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),weak:true,winText:PARA_WIN}}),
      fail:()=>({go:'h1_descontrole'})},
    {label:L('Confiar no instinto','Trust your gut','Confiar en el instinto'),test:{sk:'Intuição',dt:14},
      ok:()=>({text:P(L(`Você não sabe explicar, mas sabe: ${TEAM[S.host].name}. Você grita o nome dele e o Parasita, descoberto, se solta do hospedeiro.`,`You can't explain it, but you know: ${TEAM[S.host].name}. You shout his name and the Parasite, found out, lets go of its host.`,`No sabes explicarlo, pero lo sabes: ${TEAM[S.host].name}. Gritas su nombre y el Parásito, descubierto, suelta a su huésped.`))+(ALLIES[S.host].traitor?susp(S.host,L('o sonho','the dream','el sueño')):''),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),weak:true,winText:PARA_WIN}}),
      fail:()=>({go:'h1_descontrole'})}
  ]},

h1_descontrole:{act:CH2,title:L('Descontrole','Loss of control','Descontrol'),
  text:()=>P(L(`Tarde demais. ${TEAM[S.host].name} se levanta com os olhos virados e ataca quem estiver mais perto. Ninguém quer atirar num colega. Alguém precisa segurá-lo.`,`Too late. ${TEAM[S.host].name} gets up with his eyes rolled back and attacks whoever is closest. Nobody wants to shoot a teammate. Someone has to hold him down.`,`Demasiado tarde. ${TEAM[S.host].name} se levanta con los ojos en blanco y ataca a quien esté más cerca. Nadie quiere dispararle a un compañero. Alguien tiene que sujetarlo.`))+(ALLIES[S.host].traitor?P(L(`E a imagem do sonho não sai da sua cabeça.`,`And the image from the dream won't leave your head.`,`Y la imagen del sueño no se te va de la cabeza.`))+susp(S.host,L('o sonho','the dream','el sueño')):''),
  choices:()=>[
    {label:L(`Abraçar ${fn(S.host)} com toda a força`,`Hug ${fn(S.host)} with all your strength`,`Abrazar a ${fn(S.host)} con todas tus fuerzas`),test:{sk:'Vontade',dt:14},
      ok:()=>({text:P(L(`Você o prende com o braço mecânico e não solta, nem quando ele morde seu ombro. Aos poucos, ele volta. O Parasita escorre das costas dele como óleo.`,`You lock him in with your mechanical arm and don't let go, not even when he bites your shoulder. Little by little he comes back. The Parasite slides off his back like oil.`,`Lo sujetas con el brazo mecánico y no lo sueltas, ni cuando te muerde el hombro. Poco a poco vuelve en sí. El Parásito se escurre de su espalda como aceite.`))+losePv('1d4',L('mordida','bite','mordida')),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:PARA_WIN}}),
      fail:()=>({text:P(L(`Ele te joga contra a parede antes de você fechar o abraço. Outro agente consegue segurá-lo, e sai com o rosto aberto.`,`He throws you against the wall before you can close your arms. Another agent manages to hold him, and comes away with a split face.`,`Te lanza contra la pared antes de que cierres el abrazo. Otro agente logra sujetarlo, y sale con la cara abierta.`))+losePv('2d6',L('o golpe','the blow','el golpe')),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:PARA_WIN}})},
    {label:L('Deixar outro agente tentar','Let another agent try','Dejar que otro agente lo intente'),
      run:()=>{S.flags.host_ferido=true;const o=fn(S.team.filter(x=>x!==S.host)[0]);return {text:P(L(`Você hesita. ${o} se joga e segura, levando um golpe feio no processo.`,`You hesitate. ${o} throws himself in and holds on, taking a nasty hit in the process.`,`Dudas. ${o} se lanza y lo sujeta, llevándose un golpe feo en el intento.`))+loseSan('1d4',L('a hesitação','hesitation','la duda')),combat:{id:'parasita',after:'h1_depois',allies:S.team.filter(x=>x!==S.host),winText:PARA_WIN}}}}
  ]},

h1_depois:{act:CH2,title:L('Depois do sonho','After the dream','Después del sueño'),
  text:()=>P(L(`${TEAM[S.host].name} fica sentado no chão por um minuto, sem olhar para ninguém. Todos viram o que ele viu. Ninguém comenta.`,`${TEAM[S.host].name} sits on the floor for a minute, not looking at anyone. Everyone saw what he saw. No one says a word.`,`${TEAM[S.host].name} se queda sentado en el piso un minuto, sin mirar a nadie. Todos vieron lo que él vio. Nadie comenta.`))+(ALLIES[S.host].traitor?P(L(`Você comenta menos ainda. Mas guarda.`,`You say even less. But you remember.`,`Tú comentas todavía menos. Pero lo guardas.`)):P(L(`Você põe a mão no ombro dele. Todo mundo tem um lago escuro em algum lugar.`,`You put a hand on his shoulder. Everyone has a dark lake somewhere.`,`Le pones la mano en el hombro. Todos tienen un lago oscuro en algún lugar.`))),
  choices:()=>[{label:L('Voltar ao corredor','Back to the hallway','Volver al pasillo'),main:true,run:()=>({go:'h1_hall'})}]},

h2_andar:{act:CH2,title:L('Segundo andar','Second floor','Segundo piso'),
  text:()=>P(L(`O segundo andar está pior: marcas de garra no teto, e um rastro de sangue antigo que vai direto até uma porta com a placa "ARQUIVO". À esquerda, a ala pediátrica, com bichinhos de pelúcia pendurados pelo pescoço no corrimão.`,`The second floor is worse: claw marks on the ceiling, and an old trail of blood leading straight to a door marked "ARCHIVE". To the left, the pediatric ward, with stuffed animals hanging by their necks from the handrail.`,`El segundo piso está peor: marcas de garras en el techo y un rastro de sangre vieja que lleva directo a una puerta con el cartel "ARCHIVO". A la izquierda, el ala pediátrica, con peluches colgados del cuello en el pasamanos.`)),
  choices:()=>[
    {once:'pediatria',label:L('Explorar a ala pediátrica','Explore the pediatric ward','Explorar el ala pediátrica'),test:{sk:'Vontade',dt:12},
      ok:()=>({text:P(L(`Você entra e não desvia o olhar. Nas paredes, desenhos novos, de giz de cera.`,`You go in and don't look away. On the walls, new crayon drawings.`,`Entras y no apartas la mirada. En las paredes, dibujos nuevos hechos con crayones.`))+addClue('desenho')}),
      fail:()=>({text:P(L(`Um carrinho de brinquedo começa a andar sozinho na sua direção. Você sai de lá sem respirar, mas não antes de ver os desenhos.`,`A toy car starts rolling toward you on its own. You get out without breathing, but not before you see the drawings.`,`Un autito de juguete empieza a rodar solo hacia ti. Sales sin respirar, pero no antes de ver los dibujos.`))+addClue('desenho')+loseSan('1d4',L('a ala pediátrica','the pediatric ward','el ala pediátrica'))})},
    {once:'obs2',label:L('Observar os colegas enquanto andam','Watch your teammates as you walk','Observar a los compañeros mientras caminan'),test:{sk:'Intuição',dt:14},
      ok:()=>({text:hintTraitor()}),
      fail:()=>({text:P(L(`Todo mundo parece tenso. Isso não quer dizer nada. Ou quer.`,`Everyone looks tense. That means nothing. Or it does.`,`Todos parecen tensos. Eso no significa nada. O sí.`))})},
    {label:L('Seguir o rastro até o arquivo','Follow the trail to the archive','Seguir el rastro hasta el archivo'),main:true,run:()=>({go:'h2_arquivo'})}
  ]},

h2_arquivo:{act:CH2,title:L('Sala de arquivos','Archive room','Sala de archivos'),
  text:()=>P(L(`Arquivos de aço até o teto. Na mesa, alguém deixou a planta do hospital aberta, presa por um bisturi. Como se fosse para vocês acharem.`,`Steel filing cabinets up to the ceiling. On the desk, someone left the hospital blueprint open, pinned down with a scalpel. As if it were meant for you to find.`,`Archivadores de acero hasta el techo. En la mesa, alguien dejó el plano del hospital abierto, sujeto con un bisturí. Como si fuera para que lo encontraran.`))+addClue('planta'),
  choices:()=>[
    {once:'dono',label:L('Procurar quem é o dono do prédio','Find out who owns the building','Buscar quién es el dueño del edificio'),test:{sk:'Investigação',dt:14},
      ok:()=>({text:P(L(`Uma pasta de escrituras. Você lê o nome da empresa três vezes antes de acreditar.`,`A folder of deeds. You read the company name three times before you believe it.`,`Una carpeta de escrituras. Lees el nombre de la empresa tres veces antes de creerlo.`))+addClue('dono')+loseSan('1d3',L('o nome do seu pai','your father\'s name','el nombre de tu padre'))}),
      fail:()=>({text:P(L(`Escrituras, alvarás, papelada. Nada que ajude agora.`,`Deeds, permits, paperwork. Nothing that helps right now.`,`Escrituras, permisos, papeleo. Nada que ayude ahora.`))})},
    {label:L('Ir até a parede leste','Go to the east wall','Ir a la pared este'),main:true,run:()=>({go:'h2_parede'})}
  ]},

h2_parede:{act:CH2,title:L('A parede manchada','The stained wall','La pared manchada'),
  text:()=>P(L(`A parede leste do corredor está coberta de manchas de sangue secas. Não são aleatórias: alguém pressionou a mão em pontos específicos, muitas vezes. Uma delas abre a passagem. As outras, você não quer descobrir.

Tentativas restantes: ${3-(S.flags.tries||0)}.`,`The east wall of the corridor is covered in dried bloodstains. They're not random: someone pressed a hand on specific spots, many times. One of them opens the passage. The others, you don't want to find out.

Attempts left: ${3-(S.flags.tries||0)}.`,`La pared este del pasillo está cubierta de manchas de sangre seca. No son al azar: alguien apoyó la mano en puntos específicos, muchas veces. Una abre el pasaje. Las otras, prefieres no descubrirlo.

Intentos restantes: ${3-(S.flags.tries||0)}.`))+(S.flags.dica?P(L(`Com a planta nas mãos, você tem certeza: o cômodo fantasma fica alinhado ao poço da escada.`,`With the blueprint in hand, you're sure: the phantom room lines up with the stairwell.`,`Con el plano en la mano, estás segura: el cuarto fantasma está alineado con el hueco de la escalera.`)):''),
  choices:()=>{
    const spot=(label,right)=>({label,run:()=>{
      if(right){S.flags.alarme=false;return {text:P(L(`Você encosta a mão. Um estalo seco. A parede gira para dentro sem um ruído.`,`You press your hand to it. A dry click. The wall swings inward without a sound.`,`Apoyas la mano. Un chasquido seco. La pared gira hacia adentro sin un ruido.`)),go:'h3_subsolo'}}
      S.flags.tries=(S.flags.tries||0)+1;
      if(S.flags.tries>=3){S.flags.alarme=true;return {text:P(L(`A terceira mancha afunda. A parede se abre, e junto com ela uma sirene antiga começa a uivar lá embaixo. Quem estiver no subsolo sabe que vocês chegaram.`,`The third stain sinks in. The wall opens, and with it an old siren starts howling below. Whoever is in the basement knows you've arrived.`,`La tercera mancha se hunde. La pared se abre, y con ella una sirena vieja empieza a aullar abajo. Quien esté en el subsuelo sabe que llegaron.`)),go:'h3_subsolo'}}
      return {text:P(L(`Nada. Só o gesso frio e um cheiro de ferro que fica na sua mão.`,`Nothing. Just cold plaster and a smell of iron that stays on your hand.`,`Nada. Solo yeso frío y un olor a hierro que se te queda en la mano.`))}}});
    return [
      {once:'dica',label:L('Comparar as manchas com a planta','Compare the stains with the blueprint','Comparar las manchas con el plano'),test:{sk:'Investigação',dt:13},
        ok:()=>{S.flags.dica=true;return {text:P(L(`A planta resolve: o cômodo sem porta está exatamente atrás do poço da escada.`,`The blueprint settles it: the doorless room is right behind the stairwell.`,`El plano lo resuelve: el cuarto sin puerta está justo detrás del hueco de la escalera.`))}},
        fail:()=>({text:P(L(`As linhas da planta dançam na luz da lanterna. Você não consegue alinhar nada.`,`The blueprint's lines dance in the flashlight beam. You can't line anything up.`,`Las líneas del plano bailan con la luz de la linterna. No logras alinear nada.`))})},
      spot(L('A mancha em arco, perto da janela quebrada','The arc-shaped stain by the broken window','La mancha en arco, cerca de la ventana rota'),false),
      spot(L('A mão aberta embaixo do extintor','The open hand below the fire extinguisher','La mano abierta debajo del extintor'),false),
      spot(L('A mancha junto ao poço da escada, na altura do peito','The stain by the stairwell, at chest height','La mancha junto al hueco de la escalera, a la altura del pecho'),true),
      spot(L('O borrão no rodapé, perto da porta do arquivo','The smear on the baseboard, near the archive door','El borrón en el zócalo, cerca de la puerta del archivo'),false),
      spot(L('A marca de dedos no alto, quase no teto','The fingerprints up high, almost at the ceiling','La marca de dedos en lo alto, casi en el techo'),false)
    ]}},

h3_subsolo:{act:CH2,title:L('O subsolo','The basement','El subsuelo'),
  text:()=>P(L(`Uma escada em caracol, depois um corredor de celas. Na última, três vultos magros: Bob, Luna, Ryan. Vivos.

E, no fim do corredor, saindo por outra porta: Luck, de nunchaku no ombro. Formiga, arrastando os pés. E entre os dois, de costas, um homem com um tapa-olho improvisado.

Você conhece aquele andar. Você conhece aqueles ombros. É o Eros.

Ele não te vê. A porta se fecha atrás deles. No lugar dela, uma mulher com cortes no rosto desembainha uma espada.`,
`A spiral staircase, then a corridor of cells. In the last one, three thin figures: Bob, Luna, Ryan. Alive.

And at the end of the corridor, leaving through another door: Luck, nunchaku over his shoulder. Formiga, shuffling his feet. And between them, back turned, a man with a makeshift eyepatch.

You know that walk. You know those shoulders. It's Eros.

He doesn't see you. The door closes behind them. In front of it, a woman with scars across her face draws a sword.`,
`Una escalera de caracol y luego un pasillo de celdas. En la última, tres siluetas flacas: Bob, Luna, Ryan. Vivos.

Y al final del pasillo, saliendo por otra puerta: Luck, con el nunchaku al hombro. Formiga, arrastrando los pies. Y entre los dos, de espaldas, un hombre con un parche improvisado.

Conoces esa forma de caminar. Conoces esos hombros. Es Eros.

No te ve. La puerta se cierra detrás de ellos. En su lugar, una mujer con cortes en la cara desenvaina una espada.`))+(S.flags.alarme?P(L(`Ela estava esperando. A sirene ainda uiva.`,`She was waiting. The siren is still howling.`,`Ella estaba esperando. La sirena todavía aúlla.`)):''),
  choices:()=>[
    {label:L('Gritar o nome dele','Scream his name','Gritar su nombre'),
      run:()=>({text:P(L(`"EROS!" O grito ecoa, mas a porta já está fechada. Aline sorri. "Ele não vai voltar por você."`,`"EROS!" The scream echoes, but the door is already shut. Aline smiles. "He's not coming back for you."`,`"¡EROS!" El grito retumba, pero la puerta ya está cerrada. Aline sonríe. "No va a volver por ti."`))+loseSan('1d4',L('a porta fechada','the closed door','la puerta cerrada')),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:ALINE_WIN}})},
    {label:L('Correr atrás dele','Run after him','Correr tras él'),test:{sk:'Atletismo',dt:16},
      ok:()=>({text:P(L(`Você chega a tocar a maçaneta. Trancada. Quando se vira, a espada de Aline já está vindo, e você desvia por reflexo.`,`You get as far as touching the handle. Locked. When you turn, Aline's sword is already coming and you dodge on reflex.`,`Llegas a tocar el picaporte. Cerrado. Cuando te das vuelta, la espada de Aline ya viene y la esquivas por reflejo.`)),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,winText:ALINE_WIN}}),
      fail:()=>({text:P(L(`Aline corta seu caminho, literalmente.`,`Aline cuts you off, literally.`,`Aline te corta el paso, literalmente.`))+losePv('1d6',L('a espada','the sword','la espada')),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:ALINE_WIN}})},
    {label:L('Engolir o grito e atacar primeiro','Swallow the scream and strike first','Tragarte el grito y atacar primero'),test:{sk:'Vontade',dt:13},
      ok:()=>({text:P(L(`Você morde a língua até sentir gosto de sangue, e avança antes que ela termine de se posicionar.`,`You bite your tongue until you taste blood, and move before she's done taking her stance.`,`Te muerdes la lengua hasta sentir sabor a sangre, y avanzas antes de que ella termine de ponerse en guardia.`)),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,surprise:!S.flags.alarme,winText:ALINE_WIN}}),
      fail:()=>({text:P(L(`Seu corpo não obedece. Você fica parada olhando a porta.`,`Your body won't obey. You stand there staring at the door.`,`Tu cuerpo no obedece. Te quedas quieta mirando la puerta.`)),combat:{id:'aline1',after:'h3_resgate',allies:S.team,traitorsHold:true,enemyFirst:true,winText:ALINE_WIN}})}
  ]},

h3_resgate:{act:CH2,title:L('Resgate','Rescue','Rescate'),
  text:()=>P(L(`Aline está algemada no chão, rindo baixo. Vocês arrombam a cela. Bob, o mais novo dos Zart, mal consegue ficar de pé. Luna chora sem som. Ryan olha para você com ódio assim que ouve seu sobrenome.

"Wezen", Bob repete, devagar. "Você é a irmã." Não é uma pergunta.`,
`Aline is cuffed on the floor, laughing softly. You break open the cell. Bob, the youngest Zart, can barely stand. Luna cries without a sound. Ryan looks at you with hatred the moment he hears your last name.

"Wezen," Bob repeats slowly. "You're the sister." It isn't a question.`,
`Aline está esposada en el suelo, riendo bajito. Fuerzan la celda. Bob, el menor de los Zart, apenas puede mantenerse en pie. Luna llora sin sonido. Ryan te mira con odio apenas oye tu apellido.

"Wezen", repite Bob, despacio. "Eres la hermana." No es una pregunta.`))+(S.team.some(x=>ALLIES[x].traitor)&&S.flags.aline_hint?P(L(`E você não consegue parar de pensar em como alguns tiros passaram tão perto dela. E tão longe.`,`And you can't stop thinking about how some of those shots came so close to her. And so far.`,`Y no puedes dejar de pensar en cómo algunos golpes pasaron tan cerca de ella. Y tan lejos.`)):''),
  choices:()=>[
    {once:'pensar',cond:()=>S.team.some(x=>ALLIES[x].traitor),label:L('Repassar a luta na cabeça','Replay the fight in your head','Repasar la pelea en tu cabeza'),test:{sk:'Intuição',dt:13},
      ok:()=>{const t=S.team.filter(x=>ALLIES[x].traitor);const n=t.map(fn).join(L(' e ',' and ',' y '));return {text:P(L(`Você lembra de cada golpe. ${n} não acertou${t.length>1?'am':''} Aline nenhuma vez que importasse.`,`You remember every blow. ${n} never hit Aline once when it mattered.`,`Recuerdas cada golpe. ${n} no le acert${t.length>1?'aron':'ó'} a Aline ni una vez que importara.`))+t.map(x=>susp(x,L('a luta','the fight','la pelea'))).join('')}},
      fail:()=>({text:P(L(`Foi tudo rápido demais. Você só lembra da espada.`,`It all happened too fast. All you remember is the sword.`,`Todo fue demasiado rápido. Solo recuerdas la espada.`))})},
    {label:L('Levar todos de volta à Base','Take everyone back to the Base','Llevar a todos de vuelta a la Base'),main:true,run:()=>({levelup:'b1_ala'})}
  ]},

b1_ala:{act:CH3,title:L('Ala médica','Medical wing','Ala médica'),checkpoint:true,
  text:()=>P(L(`Um dia inteiro de repouso obrigatório. A Equipe Bob dorme sob soro. Aline está trancada na cela do fundo, e a porta só abre na hora oficial do interrogatório.

Pela primeira vez em seis anos, você tem tempo para pensar. É pior do que correr.`,
`A full day of mandatory rest. Team Bob sleeps on IV drips. Aline is locked in the back cell, and the door only opens at the official time for the interrogation.

For the first time in six years, you have time to think. It's worse than running.`,
`Un día entero de reposo obligatorio. El Equipo Bob duerme con suero. Aline está encerrada en la celda del fondo, y la puerta solo se abre a la hora oficial del interrogatorio.

Por primera vez en seis años, tienes tiempo para pensar. Es peor que correr.`)),
  choices:()=>[
    {once:'c_mada',label:L('Conversar com Mada','Talk to Mada','Hablar con Mada'),
      run:()=>({text:P(L(`Ele fala olhando para a katana no colo. "Zumbis de sangue. Eu tinha quinze anos. Meus pais eram dublês, eu também queria ser. Cheguei em casa e..." Ele para. "Desde então, proteger é a única coisa que eu sei fazer direito."`,`He talks while looking at the katana in his lap. "Blood zombies. I was fifteen. My parents were stunt performers, I wanted to be one too. I got home and..." He stops. "Since then, protecting people is the only thing I know how to do right."`,`Habla mirando la katana en su regazo. "Zombis de sangre. Yo tenía quince años. Mis padres eran dobles de riesgo, yo también quería serlo. Llegué a casa y..." Se detiene. "Desde entonces, proteger es lo único que sé hacer bien."`))+bond('mada')+calm(2)})},
    {once:'c_derick',label:L('Conversar com Derick','Talk to Derick','Hablar con Derick'),
      run:()=>({text:P(L(`"Sério, uma lança?" Ele ri pela primeira vez. Depois conta, sem drama, que o próprio pai tentou usar o sangue dele num ritual aos doze anos. "Mada chegou antes. Matou ele na minha frente." Pausa. "Eu devo tudo a ele. Tudo."`,`"Seriously, a spear?" He laughs for the first time. Then he tells you, without drama, that his own father tried to use his blood in a ritual when he was twelve. "Mada got there first. Killed him right in front of me." A pause. "I owe him everything. Everything."`,`"¿En serio, una lanza?" Se ríe por primera vez. Luego te cuenta, sin drama, que su propio padre intentó usar su sangre en un ritual cuando tenía doce años. "Mada llegó antes. Lo mató delante de mí." Pausa. "Le debo todo. Todo."`))+bond('derick')+calm(2)})},
    {once:'c_thomas',label:L('Conversar com Thomas','Talk to Thomas','Hablar con Thomas'),
      run:()=>({text:P(L(`"Roger está velho. Quando ele sair, alguém tem que segurar isso aqui." Thomas não diz quem, mas nem precisa. "E esse alguém não vai ser o filho dele. Aquele garoto não escolheu nada na vida. Isso é perigoso."`,`"Roger is getting old. When he steps down, someone has to hold this place together." Thomas doesn't say who, but he doesn't need to. "And it won't be his son. That kid never chose anything in his life. That's dangerous."`,`"Roger está viejo. Cuando se vaya, alguien tiene que sostener esto." Thomas no dice quién, pero no hace falta. "Y ese alguien no va a ser su hijo. Ese chico nunca eligió nada en su vida. Eso es peligroso."`))+bond('thomas')})},
    {label:L('Ir à reunião geral','Go to the general meeting','Ir a la reunión general'),main:true,run:()=>({go:'b2_reuniao'})}
  ]},

b2_reuniao:{act:CH3,title:L('Reunião geral','General meeting','Reunión general'),
  text:()=>P(L(`Bob fala com a voz rouca. Eros os levou até o subsolo. Na hora, virou a arma contra a própria equipe. Aline, Luck e Formiga já esperavam lá. Um mês preso, sem saber por quê.

Roger nem pestaneja. "Mada, Derick. Interroguem a Aline. Do jeito que for preciso." Thomas se levanta: "Isso é tortura, Roger." "Isso é guerra."

Você dá um passo à frente. "Eu vou junto." Mada balança a cabeça. "Não."`,
`Bob speaks in a hoarse voice. Eros led them to the basement. At the last moment, he turned his gun on his own team. Aline, Luck and Formiga were already waiting. A month locked up, without knowing why.

Roger doesn't even blink. "Mada, Derick. Interrogate Aline. However it takes." Thomas stands up: "That's torture, Roger." "That's war."

You step forward. "I'm going with them." Mada shakes his head. "No."`,
`Bob habla con la voz ronca. Eros los llevó al subsuelo. En el momento, apuntó el arma contra su propio equipo. Aline, Luck y Formiga ya esperaban allí. Un mes encerrados, sin saber por qué.

Roger ni parpadea. "Mada, Derick. Interroguen a Aline. Como sea necesario." Thomas se levanta: "Eso es tortura, Roger." "Esto es guerra."

Das un paso al frente. "Yo voy con ellos." Mada niega con la cabeza. "No."`)),
  choices:()=>[
    {label:L('Aceitar em silêncio','Accept in silence','Aceptar en silencio'),run:()=>{S.flags.resignada=true;return {text:P(L(`Você recua. Mada percebe, e aperta seu ombro ao passar. "Obrigado."`,`You step back. Mada notices, and squeezes your shoulder as he passes. "Thank you."`,`Retrocedes. Mada lo nota y te aprieta el hombro al pasar. "Gracias."`))+bond('mada'),go:'b3_espera'}}},
    {label:L('Insistir','Insist','Insistir'),test:{sk:'Diplomacia',dt:16},
      ok:()=>({text:P(L(`"É o meu irmão." Mada para. "Por isso mesmo você não vai." A voz dele não é dura. É cuidadosa. Você entende.`,`"He's my brother." Mada stops. "That's exactly why you're not going." His voice isn't harsh. It's careful. You understand.`,`"Es mi hermano." Mada se detiene. "Justamente por eso no vas." Su voz no es dura. Es cuidadosa. Entiendes.`))+bond('mada'),go:'b3_espera'}),
      fail:()=>{S.flags.raiva=true;return {text:P(L(`"Não." E a porta fecha na sua cara. Você fica com a raiva presa na garganta.`,`"No." And the door closes in your face. The anger sticks in your throat.`,`"No." Y la puerta se cierra en tu cara. Te queda la rabia atorada en la garganta.`)),go:'b3_espera'}}}
  ]},

b3_espera:{act:CH3,title:L('A espera','The wait','La espera'),
  text:()=>P(L(`Enquanto o interrogatório acontece, a Base fica em silêncio. Thomas chama Roger para uma sala e fecha a porta. A Equipe Bob está acordada na ala médica.`,`While the interrogation goes on, the Base falls silent. Thomas calls Roger into a room and shuts the door. Team Bob is awake in the medical wing.`,`Mientras ocurre el interrogatorio, la Base queda en silencio. Thomas llama a Roger a una sala y cierra la puerta. El Equipo Bob está despierto en el ala médica.`)),
  choices:()=>[
    {once:'ouvir_thomas',label:L('Passar perto da porta de Thomas e Roger','Walk past Thomas and Roger\'s door','Pasar cerca de la puerta de Thomas y Roger'),test:{sk:'Furtividade',dt:14},
      ok:()=>({text:P(L(`Só um pedaço, abafado: "...o seu filho, Roger. Olha pra ele. Olha de verdade." Roger não responde.`,`Just a muffled fragment: "...your son, Roger. Look at him. Really look." Roger doesn't answer.`,`Solo un fragmento, ahogado: "...tu hijo, Roger. Míralo. Míralo de verdad." Roger no responde.`))+susp('rjr',L('a conversa de Thomas','Thomas\'s conversation','la charla de Thomas'))}),
      fail:()=>({text:P(L(`Roger abre a porta de repente. "Algum problema, Wezen?" Você inventa que procurava o banheiro.`,`Roger suddenly opens the door. "Problem, Wezen?" You claim you were looking for the bathroom.`,`Roger abre la puerta de golpe. "¿Algún problema, Wezen?" Inventas que buscabas el baño.`))})},
    {once:'ryan',label:L('Falar com Ryan sobre Eros','Talk to Ryan about Eros','Hablar con Ryan sobre Eros'),
      run:()=>({text:P(L(`"Seu irmão sorria pra gente todo dia. Todo dia. E aí virou a arma." Ryan cospe no chão. "Se eu achar ele primeiro, não sobra nada pra você enterrar."`,`"Your brother smiled at us every day. Every day. And then he turned the gun." Ryan spits on the floor. "If I find him first, there won't be anything left for you to bury."`,`"Tu hermano nos sonreía todos los días. Todos. Y después apuntó el arma." Ryan escupe en el suelo. "Si lo encuentro primero, no te va a quedar nada que enterrar."`))+loseSan('1d2',L('o ódio de Ryan','Ryan\'s hatred','el odio de Ryan'))})},
    {once:'luna',label:L('Falar com Luna sobre Eros','Talk to Luna about Eros','Hablar con Luna sobre Eros'),
      run:()=>({text:P(L(`Luna segura sua mão. "Ele era bom. Ingênuo. Fazia café pra todo mundo. Quando virou a arma, estava chorando." Ela hesita. "Ele disse: desculpa, eu preciso trazer ela de volta."`,`Luna takes your hand. "He was good. Naive. Made coffee for everyone. When he turned the gun, he was crying." She hesitates. "He said: I'm sorry, I have to bring her back."`,`Luna te toma la mano. "Era bueno. Ingenuo. Hacía café para todos. Cuando apuntó el arma, estaba llorando." Duda. "Dijo: perdón, tengo que traerla de vuelta."`))+bond('bob')})},
    {once:'bob',label:L('Falar com Bob','Talk to Bob','Hablar con Bob'),
      run:()=>({text:P(L(`Bob desvia o olhar toda vez que você fala o nome do Eros. "Descansa, Wezen." É tudo que ele diz.`,`Bob looks away every time you say Eros's name. "Get some rest, Wezen." That's all he says.`,`Bob aparta la mirada cada vez que dices el nombre de Eros. "Descansa, Wezen." Es todo lo que dice.`))})},
    {label:L('Esperar o fim do interrogatório','Wait for the interrogation to end','Esperar el fin del interrogatorio'),main:true,run:()=>({go:'b4_resultado'})}
  ]},

b4_resultado:{act:CH3,title:L('O que Aline disse','What Aline said','Lo que dijo Aline'),
  text:()=>P(L(`Mada sai com as mãos lavadas e o rosto fechado. Derick nem sai. "Nada", diz Mada. "Só uma frase. De novo e de novo."

"Luck e Formiga vão acabar com vocês."

Ryan chuta uma cadeira. "Então a gente acaba com eles primeiro. E com o Eros." Todos olham para você.`,
`Mada comes out with washed hands and a closed face. Derick doesn't come out at all. "Nothing," says Mada. "Just one sentence. Over and over."

"Luck and Formiga are going to finish you all."

Ryan kicks a chair. "Then we finish them first. And Eros." Everyone looks at you.`,
`Mada sale con las manos lavadas y el rostro cerrado. Derick ni siquiera sale. "Nada", dice Mada. "Solo una frase. Una y otra vez."

"Luck y Formiga van a acabar con ustedes."

Ryan patea una silla. "Entonces acabamos con ellos primero. Y con Eros." Todos te miran.`)),
  choices:()=>[
    {label:L('Defender o seu irmão','Defend your brother','Defender a tu hermano'),test:{sk:'Diplomacia',dt:14},
      ok:()=>({text:P(L(`"Ninguém toca no meu irmão antes de eu ouvir da boca dele." Ryan te encara, mas é o primeiro a desviar.`,`"Nobody touches my brother before I hear it from his own mouth." Ryan stares you down, but he's the first to look away.`,`"Nadie toca a mi hermano antes de que yo lo escuche de su boca." Ryan te clava la mirada, pero es el primero en apartarla.`)),go:'b5_alarme'}),
      fail:()=>({text:P(L(`Ryan te empurra contra a parede. Bob o segura. Ninguém te defende.`,`Ryan shoves you against the wall. Bob holds him back. No one defends you.`,`Ryan te empuja contra la pared. Bob lo sujeta. Nadie te defiende.`))+loseSan('1d2',L('a humilhação','the humiliation','la humillación')),go:'b5_alarme'})},
    {label:L('Ficar calada','Stay quiet','Quedarte callada'),run:()=>({text:P(L(`Você fica calada. Roger Jr quebra o silêncio, sem levantar a voz: "Se ela está tão confiante, é porque a Base já está comprometida."`,`You stay quiet. Roger Jr breaks the silence without raising his voice: "If she's that confident, the Base is already compromised."`,`Te quedas callada. Roger Jr rompe el silencio sin alzar la voz: "Si ella está tan confiada, es porque la Base ya está comprometida."`)),go:'b5_alarme'})}
  ]},

b5_alarme:{act:CH3,title:L('Alarme','Alarm','Alarma'),
  text:()=>P(L(`No segundo em que Roger Jr termina a frase, as luzes ficam vermelhas e a sirene da Base dispara. Todo mundo corre para um lado.

Dez minutos de busca. Nada. Nenhuma porta arrombada, nenhuma câmera com imagem.
